name: batch-contract

# Shared automated evidence for the v4 batch-runner contract.
# The suite runs the public script CLIs in isolated temporary workspaces with
# fake OpenFOAM commands. The job needs no OpenFOAM installation.

on:
  push:
    paths:
      - 'src/run_batch.sh'
      - 'src/master_batch/lib_batch_stage.sh'
      - 'src/master_batch/setup_cases.sh'
      - 'src/master_batch/run_mesh_cases.sh'
      - 'src/master_batch/run_flow_cases.sh'
      - 'src/master_batch/run_transport_cases.sh'
      - 'src/master_batch/run_post_processing_cases.sh'
      - 'tests/**'
      - '.github/workflows/batch-contract.yml'
      - '.github/workflows/openfoam-evidence.yml'
      - '.github/workflows/openfoam-m3-mesh-diagnostic.yml'
      - '.github/workflows/openfoam-m3-metric-validation.yml'
      - '.github/scripts/check-shellcheck-baseline.sh'
      - '.github/shellcheck-baseline.gcc'
      - '.openfoam-version'
  pull_request:
    paths:
      - 'src/run_batch.sh'
      - 'src/master_batch/lib_batch_stage.sh'
      - 'src/master_batch/setup_cases.sh'
      - 'src/master_batch/run_mesh_cases.sh'
      - 'src/master_batch/run_flow_cases.sh'
      - 'src/master_batch/run_transport_cases.sh'
      - 'src/master_batch/run_post_processing_cases.sh'
      - 'tests/**'
      - '.github/workflows/batch-contract.yml'
      - '.github/workflows/openfoam-evidence.yml'
      - '.github/workflows/openfoam-m3-mesh-diagnostic.yml'
      - '.github/workflows/openfoam-m3-metric-validation.yml'
      - '.github/scripts/check-shellcheck-baseline.sh'
      - '.github/shellcheck-baseline.gcc'
      - '.openfoam-version'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contract-tests:
    name: v4 batch-runner contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Report the runner environment
        run: |
          set -euo pipefail
          echo "Bash version : ${BASH_VERSION}"
          echo "Commit       : ${GITHUB_SHA}"
          if command -v checkMesh >/dev/null 2>&1; then
            echo "OpenFOAM     : present in PATH"
          else
            echo "OpenFOAM     : absent (the contract tests use fake commands)"
          fi

      - name: Check the contract-test harness syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
            echo "syntax OK: $script"
          done < <(find tests -type f -name '*.sh' | sort)

      - name: Provision the M3 VTU reader dependencies
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # ---- M3 VTU provision: begin ----
          # The fixed provision of the pinned VTU reader (Issue #80, admission 6160693923
          # of dependency addendum 6158946927, Sections 2 to 6, and Owner decision
          # 6160428682). This block is byte-identical in batch-contract.yml and in
          # openfoam-evidence.yml, so the manifest and the provision code have one
          # SHA-256 in both workflows. The readback checks that SHA-256.
          #
          # vp_provision [<latest-end>] makes one fresh task root of this user,
          # RUNNER_TEMP/m3-vtu-deps.XXXXXXXX, and runs the three fixed vectors of the
          # addendum, Section 4: the standard-library downloader of the thirteen exact
          # HTTPS artifacts with the ZIP, METADATA, tag, and closure checks; the offline
          # hash-required target install with the verified pip wheel; and the installed
          # closure and native import check. <latest-end> is an absolute time in seconds
          # by which the provision must end. The provision writes only below its task
          # root, the validated root and the result in GITHUB_ENV, and no system, user,
          # repository, Case, or DOE Batch CSV path. It uses no privilege, system
          # package, index, resolver, source build, mirror, proxy, retry, or fallback.
          #
          # Results: PROVISION_AVAILABLE only when all three operations PASS, each
          # process group stopped, the archives and the installer data are removed, and
          # the receipt is complete. Wrong bytes or SHA-256, an invalid lock, an
          # unexpected distribution or requirement, and an unsafe layout are FAIL. No
          # time, a missing interpreter or library, an unsupported layout, a limit, a
          # warning, and an incomplete record are NOT_VERIFIED. No provision time before
          # any work is NOT_ATTEMPTED. Each record in records/ holds at most 65536 bytes.
          # The task-size value is a phase checkpoint, not a continuous disk quota.
          VP_TOTAL_MS=90000
          VP_FETCH_MS=30000
          VP_INSTALL_MS=35000
          VP_VERIFY_MS=10000
          VP_RESERVE_MS=15000
          VP_KILL_GRACE_MS=5000
          VP_ARCHIVE_LIMIT=154218283
          VP_EXPANDED_LIMIT=1073741824
          VP_TASK_LIMIT=3221225472
          VP_AS_LIMIT=4294967296
          VP_CPU_SECONDS=60
          VP_TEXT_LIMIT=65536
          VP_PYTHON=/usr/bin/python3.12
          VP_MARK_BEGIN='# ---- M3 VTU provision: begin ----'
          VP_MARK_END='# ---- M3 VTU provision: end ----'

          # vp_now_ms - the wall clock in milliseconds.
          vp_now_ms() {
              local t="${EPOCHREALTIME//[!0-9]/}"
              printf '%s\n' "$(( 10#$t / 1000 ))"
          }

          # vp_text <text> [<limit>] - one line of at most <limit> (300) characters,
          # with no tab.
          vp_text() {
              local text="${1//[$'\t\r\n']/ }"
              printf '%s\n' "${text:0:${2:-300}}"
          }

          # vp_block_sha - the SHA-256 of this block in the running script, from the
          # begin marker line through the end marker line and its line end. Each marker
          # line must be in the script once.
          vp_block_sha() {
              local script="${BASH_SOURCE[0]}" text
              [[ -f "$script" && -r "$script" ]] || return 1
              [[ "$(grep -cx -F -- "$VP_MARK_BEGIN" "$script") $(grep -cx -F -- "$VP_MARK_END" "$script")" == "1 1" ]] || return 1
              text="$(awk -v begin="$VP_MARK_BEGIN" -v end="$VP_MARK_END" '
                  $0 == begin { inside = 1 }
                  inside { print }
                  inside && $0 == end { exit }' "$script")" || return 1
              printf '%s\n' "$text" | sha256sum | cut -d ' ' -f 1
          }

          # vp_group_members <group> - print the PID of each live process in one process
          # group. Every /proc/<pid>/stat file is readable for every user, so the check
          # does not depend on the permission to signal. A zombie has stopped. Returns 1
          # when the stat file of a listed process cannot be read.
          vp_group_members() {
              local file line rest state
              for file in /proc/[0-9]*/stat; do
                  if ! { read -r line < "$file"; } 2>/dev/null; then
                      [[ -e "$file" ]] && return 1
                      continue
                  fi
                  [[ "$line" == *" $1 "* ]] || continue
                  rest="${line##*") "}"
                  state="${rest%% *}"
                  rest="${rest#* }"
                  rest="${rest#* }"
                  if [[ "${rest%% *}" == "$1" && "$state" != Z ]]; then
                      printf '%s\n' "${file:6:-5}"
                  fi
              done
              return 0
          }

          # vp_group_empty <group> - status 0 only for a complete check with no live
          # process in the group.
          vp_group_empty() {
              local members
              members="$(vp_group_members "$1")" || return 1
              [[ -z "$members" ]]
          }

          # vp_stop_group <group> <end-ms> - stop each process that is still in the
          # group after its command returned. The processes get SIGTERM, and SIGKILL one
          # second before <end-ms> or VP_KILL_GRACE_MS later, whichever is first. The
          # stop and its check end by <end-ms>. A group ID below 2 is refused. Sets
          # VP_STOP to EMPTY, STOPPED, or NOT_STOPPED, and returns 1 for NOT_STOPPED.
          vp_stop_group() {
              local group="$1" end="$2" kill_at now members=""
              VP_STOP=EMPTY
              if [[ ! "$group" =~ ^[1-9][0-9]*$ ]] || (( group < 2 )); then
                  VP_STOP=NOT_STOPPED
                  return 1
              fi
              vp_group_empty "$group" && return 0
              VP_STOP=STOPPED
              now="$(vp_now_ms)"
              kill_at=$(( end - 1000 ))
              if (( kill_at > now + VP_KILL_GRACE_MS )); then
                  kill_at=$(( now + VP_KILL_GRACE_MS ))
                  end=$(( kill_at + 1000 ))
              fi
              if (( now < kill_at )); then
                  kill -TERM -- "-${group}" 2>/dev/null || true
                  while (( $(vp_now_ms) < kill_at )); do
                      vp_group_empty "$group" && return 0
                      sleep 0.1
                  done
              fi
              kill -KILL -- "-${group}" 2>/dev/null || true
              while :; do
                  if members="$(vp_group_members "$group")" && [[ -z "$members" ]]; then
                      return 0
                  fi
                  (( $(vp_now_ms) + 150 < end )) || break
                  sleep 0.1
              done
              VP_STOP=NOT_STOPPED
              return 1
          }

          # vp_op <label> <phase-limit-ms> <command> [args...] - one bounded operation.
          # The limit is the smaller of the phase limit and the time left before the
          # provision end less VP_RESERVE_MS. Below one second, nothing starts. A fixed
          # vector function (vp_*_vector) replaces the operation subshell with its own
          # exact timeout vector; another command runs as timeout --signal=TERM
          # --kill-after=5s <limit> <command>. Thus the subshell PID is the timeout PID
          # and the group ID. Standard input is VP_OP_STDIN (empty: /dev/null), and the
          # two logs are records/<label>.out and records/<label>.err. VP_OP_RECORD is
          # the expanded vector for commands.tsv, with @SECONDS@ for the limit. Sets
          # VP_OP_STATUS, VP_OP_OUTCOME (COMPLETED, FAILED, TIMEOUT, NOT_STOPPED, or
          # NOT_STARTED), VP_OP_LIMIT_MS, VP_OP_SECONDS, VP_OP_GROUP, and VP_STOP.
          vp_op() {
              local label="$1" phase="$2" start limit record code=-
              shift 2
              start="$(vp_now_ms)"
              limit=$(( VP_END_MS - VP_RESERVE_MS - start ))
              (( phase < limit )) && limit="$phase"
              (( limit > 0 )) || limit=0
              printf -v VP_OP_SECONDS '%d.%03d' "$(( limit / 1000 ))" "$(( limit % 1000 ))"
              VP_OP_LIMIT_MS="$limit" VP_OP_STATUS=124 VP_OP_OUTCOME=NOT_STARTED VP_OP_GROUP=- VP_STOP=EMPTY
              record="${VP_OP_RECORD:-}"
              if [[ -z "$record" ]]; then
                  record="timeout --signal=TERM --kill-after=5s @SECONDS@s$(printf ' %q' "$@")"
              fi
              record="${record//@SECONDS@/${VP_OP_SECONDS}}"
              if [[ -n "${VP_OP_STDIN:-}" ]]; then
                  code="$(sha256sum <<< "$VP_OP_STDIN" | cut -d ' ' -f 1)"
              fi
              if (( limit >= 1000 )); then
                  (
                      if [[ -n "${VP_OP_STDIN:-}" ]]; then
                          exec <<< "$VP_OP_STDIN"
                      else
                          exec < /dev/null
                      fi
                      exec > "${VP_ROOT}/records/${label}.out" 2> "${VP_ROOT}/records/${label}.err"
                      if [[ "$(type -t "$1")" == function ]]; then
                          "$@"
                      fi
                      exec timeout --signal=TERM --kill-after=5s "${VP_OP_SECONDS}s" "$@"
                  ) &
                  VP_OP_GROUP=$!
                  wait "$VP_OP_GROUP" && VP_OP_STATUS=0 || VP_OP_STATUS=$?
                  vp_stop_group "$VP_OP_GROUP" "$(( start + limit + VP_KILL_GRACE_MS + 1000 ))" || true
                  case "$VP_OP_STATUS" in
                      0) VP_OP_OUTCOME=COMPLETED ;;
                      124|137) VP_OP_OUTCOME=TIMEOUT ;;
                      *) VP_OP_OUTCOME=FAILED ;;
                  esac
                  [[ "$VP_STOP" != NOT_STOPPED ]] || VP_OP_OUTCOME=NOT_STOPPED
              fi
              [[ -s "${VP_ROOT}/records/commands.tsv" ]] ||
                  printf 'seq\tlabel\tlimit_ms\tstart_ms\tend_ms\tstatus\toutcome\tgroup\tstop\tcode_sha256\tvector\n' \
                      > "${VP_ROOT}/records/commands.tsv"
              VP_OP_SEQ=$(( ${VP_OP_SEQ:-0} + 1 ))
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$VP_OP_SEQ" "$label" "$limit" "$start" "$(vp_now_ms)" \
                  "$VP_OP_STATUS" "$VP_OP_OUTCOME" "$VP_OP_GROUP" "$VP_STOP" "$code" "$(vp_text "$record" 4000)" \
                  >> "${VP_ROOT}/records/commands.tsv"
              VP_OP_RECORD=""
              return 0
          }

          # The three fixed vectors of the addendum, Section 4. Each one runs in the
          # subshell of vp_op and replaces it with timeout.
          vp_fetch_vector() {
              local DEP_FETCH_SECONDS="$VP_OP_SECONDS"
              exec \
              timeout --signal=TERM --kill-after=5s "${DEP_FETCH_SECONDS}s" \
                /usr/bin/python3.12 -I - "$M3_VTU_DEP_ROOT"
          }

          vp_install_vector() {
              local DEP_INSTALL_SECONDS="$VP_OP_SECONDS"
              PIP_CONFIG_FILE=/dev/null TMPDIR="${M3_VTU_DEP_ROOT}/tmp" \
              exec \
              timeout --signal=TERM --kill-after=5s "${DEP_INSTALL_SECONDS}s" \
                /usr/bin/python3.12 -I - \
                "${M3_VTU_DEP_ROOT}/installer/pip-25.2-py3-none-any.whl" \
                --isolated --disable-pip-version-check install --no-index \
                --find-links="${M3_VTU_DEP_ROOT}/wheels" --require-hashes \
                --only-binary=:all: --no-cache-dir --no-compile \
                --target="${M3_VTU_DEP_ROOT}/site" \
                --requirement="${M3_VTU_DEP_ROOT}/requirements.lock"
          }

          vp_verify_vector() {
              local DEP_VERIFY_SECONDS="$VP_OP_SECONDS"
              exec \
              timeout --signal=TERM --kill-after=5s "${DEP_VERIFY_SECONDS}s" \
                /usr/bin/python3.12 -I - "${M3_VTU_DEP_ROOT}/site"
          }

          # vp_env_value <file> <key> - the one value of <key> in a complete env record
          # (a regular file that ends with its WORK_FINISH line), or nothing.
          vp_env_value() {
              local text="" line value="" count=0 complete=$'(^|\n)WORK_FINISH=[0-9]+\n$'
              [[ -f "$1" && ! -L "$1" ]] || return 0
              IFS= read -r -d '' text < "$1" || true
              [[ "$text" =~ $complete ]] || return 0
              while IFS= read -r line; do
                  if [[ "$line" == "$2="* ]]; then
                      value="${line#*=}"
                      count=$(( count + 1 ))
                  fi
              done <<< "$text"
              (( count == 1 )) && printf '%s\n' "$value"
              return 0
          }

          # vp_phase <label> <record> <prefix> - status 0 when the last operation
          # completed with status 0 and its record has <prefix>_RESULT=PASS. Otherwise
          # the first failure sets VP_RESULT and VP_REASON. Sets VP_<prefix>_RESULT.
          vp_phase() {
              local file="${VP_ROOT}/records/$2" result reason
              result="$(vp_env_value "$file" "${3}_RESULT")"
              reason="$(vp_env_value "$file" "${3}_REASON")"
              if [[ "$VP_OP_OUTCOME" == COMPLETED && "$result" == PASS ]]; then
                  printf -v "VP_${3}_RESULT" '%s' PASS
                  return 0
              fi
              case "$VP_OP_OUTCOME" in
                  NOT_STARTED) vp_fail NOT_VERIFIED "no time was left for the $1 operation (limit ${VP_OP_LIMIT_MS} ms)" ;;
                  NOT_STOPPED) vp_fail NOT_VERIFIED "process group ${VP_OP_GROUP} of the $1 operation did not stop by its deadline" ;;
                  TIMEOUT) vp_fail NOT_VERIFIED "the $1 operation did not complete within its ${VP_OP_LIMIT_MS} ms limit" ;;
                  *)
                      if [[ "$result" == FAIL || "$result" == NOT_VERIFIED ]]; then
                          vp_fail "$result" "the $1 operation: ${reason:-no reason}"
                      else
                          vp_fail NOT_VERIFIED "the $1 operation ended with status ${VP_OP_STATUS} and no complete PASS record"
                      fi ;;
              esac
              [[ "$result" == FAIL ]] || result=NOT_VERIFIED
              printf -v "VP_${3}_RESULT" '%s' "$result"
              return 1
          }

          # vp_fail <result> <reason> - the first failure sets the result and reason.
          vp_fail() {
              if [[ "$VP_RESULT" == PENDING ]]; then
                  VP_RESULT="$1"
                  VP_REASON="$(vp_text "$2")"
              fi
              return 0
          }

          # vp_finish - write records/result.env as the last record, when the task root
          # exists, and publish the validated root and the result in GITHUB_ENV.
          vp_finish() {
              local LC_ALL=C text name var
              [[ "$VP_RESULT" != PENDING ]] || vp_fail NOT_VERIFIED "the provision did not record a result"
              if [[ -n "$VP_ROOT" && -d "${VP_ROOT}/records" && ! -L "${VP_ROOT}/records" ]]; then
                  text="PROVISION_SCHEMA=m3-vtu-provision/1"$'\n'
                  for name in RESULT REASON ROOT PARENT BLOCK_SHA256 MANIFEST_SHA256 LOCK_SHA256 REQUIRES_SHA256 \
                              FETCH_CODE_SHA256 INSTALL_CODE_SHA256 VERIFY_CODE_SHA256 PYTHON PYTHON_SHA256 IMAGE \
                              FETCH_RESULT INSTALL_RESULT VERIFY_RESULT CLEANUP START_MS END_MS; do
                      var="VP_${name}"
                      text+="PROVISION_${name}=$(vp_text "${!var:-UNAVAILABLE}")"$'\n'
                  done
                  text+="PROVISION_FINISH_MS=$(vp_now_ms)"$'\n'"WORK_FINISH=$(vp_now_ms)"$'\n'
                  if (( ${#text} > VP_TEXT_LIMIT )) || ! printf '%s' "$text" > "${VP_ROOT}/records/result.env" 2> /dev/null; then
                      VP_RESULT=NOT_VERIFIED VP_REASON="the provision receipt records/result.env cannot be written"
                  fi
              fi
              if [[ -n "${GITHUB_ENV:-}" ]]; then
                  {
                      if [[ -n "$VP_ROOT" ]]; then
                          printf 'M3_VTU_DEP_ROOT=%s\n' "$VP_ROOT"
                      fi
                      printf 'M3_VTU_PROVISION_RESULT=%s\n' "$VP_RESULT"
                  } >> "$GITHUB_ENV" || { VP_RESULT=NOT_VERIFIED; VP_REASON="GITHUB_ENV cannot be written"; }
              fi
              # The step log shows the result and the bounded main records.
              printf 'M3 VTU provision: %s: %s\n' "$VP_RESULT" "$VP_REASON"
              if [[ -n "$VP_ROOT" ]]; then
                  for name in result.env commands.tsv fetch.env install.env verify.env; do
                      if [[ -f "${VP_ROOT}/records/${name}" && ! -L "${VP_ROOT}/records/${name}" ]]; then
                          printf '== records/%s ==\n' "$name"
                          head -c "$VP_TEXT_LIMIT" -- "${VP_ROOT}/records/${name}" || true
                      fi
                  done
              fi
              return 0
          }

          # vp_root_safe - status 0 when VP_ROOT is one task root of this user directly
          # below RUNNER_TEMP, of mode 700, with no link.
          vp_root_safe() {
              [[ "${VP_ROOT%/*}" == "$VP_PARENT" && "${VP_ROOT##*/}" =~ ^m3-vtu-deps\.[A-Za-z0-9]{8}$ ]] &&
                  [[ -d "$VP_ROOT" && ! -L "$VP_ROOT" && -O "$VP_ROOT" ]] &&
                  [[ "$(stat -c %a -- "$VP_ROOT")" == 700 && "$(cd -P -- "$VP_ROOT" && pwd -P)" == "$VP_ROOT" ]]
          }

          # vp_write <name> <text> - write one task-root file and check its bytes.
          vp_write() {
              local LC_ALL=C
              printf '%s' "$2" > "${VP_ROOT}/$1" && [[ "$(wc -c < "${VP_ROOT}/$1")" == "${#2}" ]]
          }

          # vp_provision [<latest-end>] - the complete provision; see the block header.
          # Sets VP_RESULT, VP_REASON, and VP_ROOT, and returns 0.
          vp_provision() {
              local latest="${1:-}" name dir var
              VP_RESULT=PENDING VP_REASON="" VP_ROOT="" M3_VTU_DEP_ROOT="" VP_OP_SEQ=0 VP_OP_RECORD=""
              VP_FETCH_RESULT=NOT_RUN VP_INSTALL_RESULT=NOT_RUN VP_VERIFY_RESULT=NOT_RUN VP_CLEANUP=NOT_RUN
              VP_PARENT="${RUNNER_TEMP:-}" VP_IMAGE="${ImageOS:-UNAVAILABLE} ${ImageVersion:-UNAVAILABLE}"
              VP_START_MS="$(vp_now_ms)"
              VP_END_MS=$(( VP_START_MS + VP_TOTAL_MS ))
              if [[ -n "$latest" ]]; then
                  if [[ ! "$latest" =~ ^-?(0|[1-9][0-9]*)$ ]]; then
                      vp_fail NOT_ATTEMPTED "the latest provision end '${latest}' is not a whole number of seconds"
                      vp_finish
                      return 0
                  fi
                  (( latest * 1000 >= VP_END_MS )) || VP_END_MS=$(( latest * 1000 ))
              fi
              # The gate before any work and any network access.
              if (( VP_END_MS - VP_RESERVE_MS - VP_START_MS < 1000 )); then
                  vp_fail NOT_ATTEMPTED "no provision time: the end ${VP_END_MS} ms leaves less than one second after the ${VP_RESERVE_MS} ms stop and receipt reserve from the start ${VP_START_MS} ms"
                  vp_finish
                  return 0
              fi
              if (( EUID == 0 )); then
                  vp_fail NOT_VERIFIED "the provision runs only as an unprivileged user"
              elif [[ -z "$VP_PARENT" || "$VP_PARENT" != /* || -L "$VP_PARENT" || ! -d "$VP_PARENT" || ! -O "$VP_PARENT" ]] ||
                      [[ "$(cd -P -- "$VP_PARENT" && pwd -P)" != "$VP_PARENT" ]]; then
                  vp_fail NOT_VERIFIED "RUNNER_TEMP '${VP_PARENT}' is not an absolute directory of this user without links"
              elif [[ ! -f "$VP_PYTHON" || -L "$VP_PYTHON" || ! -x "$VP_PYTHON" ]]; then
                  vp_fail NOT_VERIFIED "the interpreter ${VP_PYTHON} is not an executable regular file"
              elif ! VP_BLOCK_SHA256="$(vp_block_sha)" || [[ ! "$VP_BLOCK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
                  vp_fail NOT_VERIFIED "the provision block cannot be read once from the running script"
              fi
              if [[ "$VP_RESULT" != PENDING ]]; then
                  vp_finish
                  return 0
              fi
              VP_PYTHON_SHA256="$(sha256sum < "$VP_PYTHON" | cut -d ' ' -f 1)"

              # One fresh task root, with its named directories and its fixed inputs.
              VP_ROOT="$(mktemp -d "${VP_PARENT}/m3-vtu-deps.XXXXXXXX" 2> /dev/null)" || VP_ROOT=""
              if [[ -z "$VP_ROOT" ]] || ! vp_root_safe || [[ -n "$(ls -A -- "$VP_ROOT")" ]]; then
                  vp_fail NOT_VERIFIED "mktemp gave no new empty task root of this user below RUNNER_TEMP: '${VP_ROOT}'"
                  VP_ROOT=""
                  vp_finish
                  return 0
              fi
              M3_VTU_DEP_ROOT="$VP_ROOT"
              for dir in installer wheels site tmp records; do
                  mkdir -m 700 -- "${VP_ROOT}/${dir}" || vp_fail NOT_VERIFIED "the task directory ${dir} cannot be made"
              done
              for name in manifest.tsv:VP_MANIFEST requirements.lock:VP_LOCK requires.tsv:VP_REQUIRES; do
                  var="${name#*:}"
                  vp_write "${name%%:*}" "${!var}" ||
                      vp_fail NOT_VERIFIED "the task input ${name%%:*} cannot be written completely"
              done
              VP_MANIFEST_SHA256="$(sha256sum < "${VP_ROOT}/manifest.tsv" | cut -d ' ' -f 1)"
              VP_LOCK_SHA256="$(sha256sum < "${VP_ROOT}/requirements.lock" | cut -d ' ' -f 1)"
              VP_REQUIRES_SHA256="$(sha256sum < "${VP_ROOT}/requires.tsv" | cut -d ' ' -f 1)"
              VP_FETCH_CODE_SHA256="$(sha256sum <<< "$VP_FETCH_PY" | cut -d ' ' -f 1)"
              VP_INSTALL_CODE_SHA256="$(sha256sum <<< "$VP_INSTALL_PY" | cut -d ' ' -f 1)"
              VP_VERIFY_CODE_SHA256="$(sha256sum <<< "$VP_VERIFY_PY" | cut -d ' ' -f 1)"
              if [[ "$VP_RESULT" != PENDING ]]; then
                  vp_finish
                  return 0
              fi

              # The three fixed operations. A failed operation stops the provision.
              VP_OP_STDIN="$VP_FETCH_PY"
              VP_OP_RECORD="timeout --signal=TERM --kill-after=5s @SECONDS@s /usr/bin/python3.12 -I - $(printf '%q' "$VP_ROOT")"
              vp_op fetch "$VP_FETCH_MS" vp_fetch_vector
              if vp_phase fetch fetch.env FETCH; then
                  VP_OP_STDIN="$VP_INSTALL_PY"
                  VP_OP_RECORD="PIP_CONFIG_FILE=/dev/null TMPDIR=$(printf '%q' "${VP_ROOT}/tmp") timeout --signal=TERM --kill-after=5s @SECONDS@s /usr/bin/python3.12 -I -$(printf ' %q' "${VP_ROOT}/installer/pip-25.2-py3-none-any.whl" --isolated --disable-pip-version-check install --no-index "--find-links=${VP_ROOT}/wheels" --require-hashes --only-binary=:all: --no-cache-dir --no-compile "--target=${VP_ROOT}/site" "--requirement=${VP_ROOT}/requirements.lock")"
