              for clause in specifier.split(","):
                  clause = clause.strip()
                  match = re.fullmatch(r"(>=|<=|==|!=|>|<)\s*([0-9][0-9.]*?)(\.\*)?", clause)
                  if not match or (match.group(3) and match.group(1) not in ("==", "!=")):
                      raise Gap("NOT_VERIFIED", "the version specifier %s has an unsupported form" % clause)
                  op, want, wild = match.groups()
                  have, want = release(version), release(want)
                  if wild:
                      equal = have[:len(want)] == want
                      ok = equal if op == "==" else not equal
                  else:
                      width = max(len(have), len(want))
                      a, b = have + (0,) * (width - len(have)), want + (0,) * (width - len(want))
                      ok = {">=": a >= b, "<=": a <= b, "==": a == b, "!=": a != b, ">": a > b, "<": a < b}[op]
                  if not ok:
                      return False
              return True


          def mandatory_requirements(meta):
              """The Requires-Dist values of the METADATA bytes that have no extra
              marker. A value with another marker is not supported."""
              headers = email.parser.BytesHeaderParser().parsebytes(meta)
              result = []
              for value in headers.get_all("Requires-Dist") or []:
                  value = " ".join(str(value).split())
                  requirement, sep, marker = value.partition(";")
                  if sep and re.search(r"\bextra\s*==", marker):
                      continue
                  if sep:
                      raise Gap("NOT_VERIFIED", "the requirement %s has an environment marker, which is not supported" % value)
                  result.append(value)
              return headers, result


          def check_requirements(name, found, requires, rows):
              """The mandatory requirements of one distribution are exactly the approved
              ones, and the selected versions satisfy them."""
              approved = requires.get(name, [])
              if sorted(found) != sorted(approved):
                  raise Gap("FAIL", "the mandatory requirements of %s [%s] are not the approved requirements [%s]"
                            % (name, "; ".join(found), "; ".join(approved)))
              versions = {normal_name(row.name): row.version for row in rows if row.role == "runtime"}
              for requirement in found:
                  match = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9._-]*)\s*(.*)", requirement)
                  if not match or normal_name(match.group(1)) not in versions:
                      raise Gap("FAIL", "the requirement %s of %s is not a selected distribution" % (requirement, name))
                  if match.group(2) and not satisfies(versions[normal_name(match.group(1))], match.group(2)):
                      raise Gap("FAIL", "the requirement %s of %s is not satisfied by %s %s"
                                % (requirement, name, match.group(1), versions[normal_name(match.group(1))]))


          def file_sha(path):
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1048576), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def finish(env_path, counts, result_key, reason_key, status):
              """Add the stream counts to the env record. A stream past its limit, or
              text on standard error after a PASS, is NOT_VERIFIED."""
              values = {}
              try:
                  for line in read_text(env_path).splitlines():
                      key, sep, value = line.partition("=")
                      if sep:
                          values[key] = value
              except (OSError, Gap):
                  return status or 2
              values.update({"STDOUT_KEPT": counts["out_kept"], "STDOUT_DROPPED": counts["out_dropped"],
                             "STDERR_KEPT": counts["err_kept"], "STDERR_DROPPED": counts["err_dropped"]})
              if counts["out_dropped"] or counts["err_dropped"]:
                  values[result_key] = "NOT_VERIFIED"
                  values[reason_key] = "the output passed the %d-byte stream limit: %d and %d bytes were not kept" % (
                      TEXT_LIMIT, counts["out_dropped"], counts["err_dropped"])
                  status = 2
              elif values.get(result_key) == "PASS" and counts["err_kept"]:
                  values[result_key] = "NOT_VERIFIED"
                  values[reason_key] = "the operation wrote %d bytes of unexplained standard-error text" % counts["err_kept"]
                  status = 2
              try:
                  write_env(env_path, values)
              except (OSError, Gap):
                  return 2
              return status


          import base64, warnings


          def record_path(name, path):
              """A RECORD path relative to the site. pip --target installs into a
              temporary home and moves it to the target. RECORD keeps each path of the
              home data scheme (scripts in bin/, headers in include/, and data files)
              relative to the lib directory home/lib/python, as ../../<path>."""
              if path.startswith("../../"):
                  path = path[len("../../"):]
              if not path or path.startswith("/") or ".." in path.split("/") or "\\" in path:
                  raise Gap("FAIL", "the RECORD of %s has the unexpected path %s" % (name, path))
              return path


          def inventory(site, rows, requires):
              """The installed layout, distributions, METADATA, and RECORD files."""
              files = {}
              for base, dirs, names in os.walk(site):
                  for name in dirs + names:
                      path = os.path.join(base, name)
                      st = os.lstat(path)
                      rel = os.path.relpath(path, site)
                      if stat.S_ISLNK(st.st_mode):
                          raise Gap("FAIL", "site/%s is a link" % rel)
                      if name in names and not stat.S_ISREG(st.st_mode):
                          raise Gap("FAIL", "site/%s is not a regular file" % rel)
                      if name in names:
                          files[rel] = st.st_size
              runtime = [row for row in rows if row.role == "runtime"]
              expected = {stem(row.name, row.version) + ".dist-info": row for row in runtime}
              found = {name for name in os.listdir(site) if name.endswith(".dist-info")}
              for name in sorted(set(expected) - found):
                  raise Gap("FAIL", "the installed distribution %s is missing" % name)
              for name in sorted(found - set(expected)):
                  raise Gap("FAIL", "the installed distribution %s is not in the manifest" % name)
              covered, table, lines = {}, [], []
              for info, row in expected.items():
                  meta = open(os.path.join(site, info, "METADATA"), "rb").read()
                  if len(meta) != row.meta_bytes or hashlib.sha256(meta).hexdigest() != row.meta_sha:
                      raise Gap("FAIL", "the installed METADATA of %s is not the published core metadata" % row.name)
                  headers, found_requires = mandatory_requirements(meta)
                  check_requirements(row.name, found_requires, requires, rows)
                  count = size = 0
                  text = read_text(os.path.join(site, info, "RECORD"), 16 * TEXT_LIMIT)
                  for cells in csv.reader(io.StringIO(text)):
                      if not cells:
                          continue
                      if len(cells) != 3:
                          raise Gap("FAIL", "the RECORD of %s has a row without three fields" % row.name)
                      path = record_path(row.name, cells[0])
                      if path in covered:
                          raise Gap("FAIL", "site/%s is listed in the RECORD of %s and %s" % (path, covered[path], row.name))
                      if path not in files:
                          raise Gap("FAIL", "the RECORD of %s lists the missing file site/%s" % (row.name, path))
                      covered[path] = row.name
                      if path == info + "/RECORD":
                          continue
                      if not cells[1].startswith("sha256=") or cells[2] != str(files[path]):
                          raise Gap("FAIL", "the RECORD row of site/%s has no SHA-256 and size" % path)
                      digest = file_sha(os.path.join(site, path))
                      wanted = base64.urlsafe_b64decode(cells[1][len("sha256="):] + "==").hex()
                      if digest != wanted:
                          raise Gap("FAIL", "the SHA-256 of site/%s differs from its RECORD" % path)
                      lines.append("%s\t%d\t%s\n" % (path, files[path], digest))
                      count, size = count + 1, size + files[path]
                  table.append([row.name, row.version, row.meta_sha, count, size, "PASS", "-"])
              for path in sorted(set(files) - set(covered)):
                  raise Gap("FAIL", "site/%s is not listed in a RECORD" % path)
              digest = hashlib.sha256("".join(sorted(lines)).encode("utf-8")).hexdigest()
              return table, len(files), sum(files.values()), digest


          def loaded_libraries(site):
              """The shared libraries that this process has mapped, with their bytes and
              SHA-256; at most 400 of them."""
              paths = set()
              with open("/proc/self/maps") as maps:
                  for line in maps:
                      path = line.split(None, 5)[5].strip() if len(line.split(None, 5)) == 6 else ""
                      if path.startswith("/") and re.search(r"\.so(\.[0-9]+)*$", path):
                          paths.add(path)
              rows = []
              for path in sorted(paths)[:400]:
                  real = os.path.realpath(path)
                  origin = "site" if real.startswith(site + "/") else "system"
                  try:
                      rows.append([real, origin, os.lstat(real).st_size, file_sha(real)])
                  except OSError as error:
                      rows.append([real, origin, "-", "UNAVAILABLE: %s" % error.strerror])
              return rows


          def native_check(site, values):
              """A bounded import of the pinned consumer from the task site only: the
              standard library paths and the validated site, no other package origin,
              no bytecode, and no warning."""
              sys.path[:] = [path for path in sys.path if path in stdlib_paths()] + [site]
              sys.dont_write_bytecode = True
              with warnings.catch_warnings(record=True) as caught:
                  warnings.simplefilter("always")
                  try:
                      import vtkmodules
                      from vtkmodules import vtkCommonCore, vtkIOXML
                      vtkIOXML.vtkXMLUnstructuredGridReader
                  except Exception as error:
                      raise Gap("NOT_VERIFIED", "the consumer vtkmodules.vtkIOXML.vtkXMLUnstructuredGridReader cannot be imported from the task site: %s: %s"
                                % (type(error).__name__, error))
              for module in (vtkmodules, vtkCommonCore, vtkIOXML):
                  origin = os.path.realpath(getattr(module, "__file__", None) or "-")
                  if not origin.startswith(site + "/"):
                      raise Gap("NOT_VERIFIED", "the module %s comes from %s, not from the task site" % (module.__name__, origin))
              values["VTK_VERSION"] = vtkCommonCore.vtkVersion.GetVTKVersion()
              values["VTK_MODULE"] = os.path.realpath(vtkCommonCore.__file__)
              if values["VTK_VERSION"] != "9.5.2":
                  raise Gap("NOT_VERIFIED", "the consumer VTK version is %s, not 9.5.2" % values["VTK_VERSION"])
              for module in (vtkCommonCore, vtkIOXML):
                  if not re.search(r"\.cpython-312-x86_64-linux-gnu\.so$", module.__file__):
                      raise Gap("NOT_VERIFIED", "the module %s is not a native cp312 extension module" % module.__name__)
              if caught:
                  raise Gap("NOT_VERIFIED", "the import gave the warning: %s" % caught[0].message)


          def run(site, values):
              root = os.path.dirname(site)
              check_root(root)
              if site != os.path.join(root, "site"):
                  raise Gap("NOT_VERIFIED", "the argument %s is not the site directory of a task root" % site)
              rows = read_manifest(root)
              requires = read_requires(root, rows)
              table, values["INSTALLED_FILES"], values["INSTALLED_BYTES"], values["INSTALLED_INVENTORY_SHA256"] = \
                  inventory(site, rows, requires)
              values["DISTRIBUTIONS"] = " ".join("%s==%s" % (row.name, row.version) for row in rows if row.role == "runtime")
              write_record(os.path.join(root, "records", "installed.tsv"), tsv(
                  [["distribution", "version", "metadata_sha256", "record_files", "record_bytes", "result", "reason"]] + table))
              values["TASK_BYTES"] = task_bytes(root)
              if values["TASK_BYTES"] > TASK_LIMIT:
                  raise Gap("NOT_VERIFIED", "the task root holds %d bytes, above the %d-byte checkpoint limit"
                            % (values["TASK_BYTES"], TASK_LIMIT))
              native_check(site, values)
              libraries = loaded_libraries(site)
              values["LOADED_LIBRARIES"] = len(libraries)
              write_record(os.path.join(root, "records", "libraries.tsv"), tsv([["path", "origin", "bytes", "sha256"]] + libraries))
              values["LIBRARIES_SHA256"] = hashlib.sha256(tsv(libraries).encode("utf-8")).hexdigest()
              return "PASS", "the locked closure is installed with complete RECORD files, and the native VTK 9.5.2 consumer imports from the task site"


          def main(argv):
              set_limits(TEXT_LIMIT)
              state = bound_streams()
              values = {"VERIFY_RESULT": "NOT_VERIFIED", "VERIFY_REASON": "the check did not reach its end"}
              try:
                  try:
                      if len(argv) != 1:
                          raise Gap("FAIL", "the check needs exactly the site argument")
                      result, reason = run(argv[0], values)
                  except Gap as gap:
                      result, reason = gap.result, gap.reason
                  except Exception as error:
                      result, reason = "NOT_VERIFIED", "the check stopped: %s: %s" % (type(error).__name__, error)
              finally:
                  counts = close_streams(state)
              values["VERIFY_RESULT"], values["VERIFY_REASON"] = result, reason
              status = {"PASS": 0, "FAIL": 1}.get(result, 2)
              if len(argv) != 1 or not os.path.isdir(os.path.join(os.path.dirname(argv[0]), "records")):
                  return status or 2
              env = os.path.join(os.path.dirname(argv[0]), "records", "verify.env")
              try:
                  write_env(env, values)
              except (OSError, Gap):
                  return 2
              return finish(env, counts, "VERIFY_RESULT", "VERIFY_REASON", status)


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          VP_VERIFY_PY
          # ---- M3 VTU provision: end ----
          vp_provision
          if [[ "$VP_RESULT" != PROVISION_AVAILABLE ]]; then
              echo "M3 VTU provision: ${VP_RESULT}: ${VP_REASON}" >&2
              exit 1
          fi

      - name: Run the v4 contract tests
        run: bash tests/run_contract_tests.sh

      - name: Confirm that the working tree is unchanged
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The contract suite changed the working tree:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "The working tree is unchanged."

  shellcheck:
    name: ShellCheck baseline gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run the ShellCheck baseline gate
        run: bash .github/scripts/check-shellcheck-baseline.sh
