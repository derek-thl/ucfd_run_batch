              """Status of <version> for a comma-separated specifier of the forms >=,
              >, <=, <, ==, and !=, with an optional .* on == and !=."""
              for clause in specifier.split(","):
                  clause = clause.strip()
                  match = re.fullmatch(r"(>=|<=|==|!=|>|<)\s*([0-9][0-9.]*?)(\.\*)?", clause)
                  if not match or (match.group(3) and match.group(1) not in ("==", "!=")):
                      raise Gap("NOT_VERIFIED", "the version specifier %s has an unsupported form" % clause)
                  op, want, wild = match.groups()
                  have, want = release(version), release(want)
                  if wild:
                      equal = have[:len(want)] == want
                      ok = equal if op == "==" else not equal
                  else:
                      width = max(len(have), len(want))
                      a, b = have + (0,) * (width - len(have)), want + (0,) * (width - len(want))
                      ok = {">=": a >= b, "<=": a <= b, "==": a == b, "!=": a != b, ">": a > b, "<": a < b}[op]
                  if not ok:
                      return False
              return True


          def mandatory_requirements(meta):
              """The Requires-Dist values of the METADATA bytes that have no extra
              marker. A value with another marker is not supported."""
              headers = email.parser.BytesHeaderParser().parsebytes(meta)
              result = []
              for value in headers.get_all("Requires-Dist") or []:
                  value = " ".join(str(value).split())
                  requirement, sep, marker = value.partition(";")
                  if sep and re.search(r"\bextra\s*==", marker):
                      continue
                  if sep:
                      raise Gap("NOT_VERIFIED", "the requirement %s has an environment marker, which is not supported" % value)
                  result.append(value)
              return headers, result


          def check_requirements(name, found, requires, rows):
              """The mandatory requirements of one distribution are exactly the approved
              ones, and the selected versions satisfy them."""
              approved = requires.get(name, [])
              if sorted(found) != sorted(approved):
                  raise Gap("FAIL", "the mandatory requirements of %s [%s] are not the approved requirements [%s]"
                            % (name, "; ".join(found), "; ".join(approved)))
              versions = {normal_name(row.name): row.version for row in rows if row.role == "runtime"}
              for requirement in found:
                  match = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9._-]*)\s*(.*)", requirement)
                  if not match or normal_name(match.group(1)) not in versions:
                      raise Gap("FAIL", "the requirement %s of %s is not a selected distribution" % (requirement, name))
                  if match.group(2) and not satisfies(versions[normal_name(match.group(1))], match.group(2)):
                      raise Gap("FAIL", "the requirement %s of %s is not satisfied by %s %s"
                                % (requirement, name, match.group(1), versions[normal_name(match.group(1))]))


          def file_sha(path):
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1048576), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def finish(env_path, counts, result_key, reason_key, status):
              """Add the stream counts to the env record. A stream past its limit, or
              text on standard error after a PASS, is NOT_VERIFIED."""
              values = {}
              try:
                  for line in read_text(env_path).splitlines():
                      key, sep, value = line.partition("=")
                      if sep:
                          values[key] = value
              except (OSError, Gap):
                  return status or 2
              values.update({"STDOUT_KEPT": counts["out_kept"], "STDOUT_DROPPED": counts["out_dropped"],
                             "STDERR_KEPT": counts["err_kept"], "STDERR_DROPPED": counts["err_dropped"]})
              if counts["out_dropped"] or counts["err_dropped"]:
                  values[result_key] = "NOT_VERIFIED"
                  values[reason_key] = "the output passed the %d-byte stream limit: %d and %d bytes were not kept" % (
                      TEXT_LIMIT, counts["out_dropped"], counts["err_dropped"])
                  status = 2
              elif values.get(result_key) == "PASS" and counts["err_kept"]:
                  values[result_key] = "NOT_VERIFIED"
                  values[reason_key] = "the operation wrote %d bytes of unexplained standard-error text" % counts["err_kept"]
                  status = 2
              try:
                  write_env(env_path, values)
              except (OSError, Gap):
                  return 2
              return status


          import http.client, platform, ssl, urllib.parse, zipfile

          HOST = "files.pythonhosted.org"
          HTTPSConnection = http.client.HTTPSConnection
          TLS_CONTEXT = []


          def tls_context():
              """One default TLS context with certificate and host-name verification."""
              if not TLS_CONTEXT:
                  TLS_CONTEXT.append(ssl.create_default_context())
              return TLS_CONTEXT[0]


          def interpreter_facts():
              glibc = os.confstr("CS_GNU_LIBC_VERSION") if hasattr(os, "confstr") else ""
              return {"implementation": sys.implementation.name, "version": platform.python_version(),
                      "build": " ".join(platform.python_build()), "soabi": sysconfig.get_config_var("SOABI") or "",
                      "machine": platform.machine(), "platform": sys.platform, "glibc": glibc or "",
                      "executable": os.path.realpath(sys.executable)}


          def glibc_version(facts):
              match = re.fullmatch(r"glibc ([0-9]+)\.([0-9]+)", facts.get("glibc", ""))
              return (int(match.group(1)), int(match.group(2))) if match else None


          def check_interpreter(facts):
              """The approved consumer environment: CPython 3.12, the standard cp312 ABI,
              Linux x86_64, glibc 2.28 or later, and the fixed /usr/bin/python3.12."""
              wanted = {"implementation": "cpython", "soabi": "cpython-312-x86_64-linux-gnu", "machine": "x86_64",
                        "platform": "linux", "executable": "/usr/bin/python3.12"}
              for key, value in wanted.items():
                  if facts.get(key) != value:
                      raise Gap("NOT_VERIFIED", "the interpreter %s is %s, not %s" % (key, facts.get(key), value))
              if not facts.get("version", "").startswith("3.12."):
                  raise Gap("NOT_VERIFIED", "the interpreter version is %s, not CPython 3.12" % facts.get("version"))
              if (glibc_version(facts) or (0, 0)) < (2, 28):
                  raise Gap("NOT_VERIFIED", "the interpreter C library is %s, not glibc 2.28 or later" % facts.get("glibc"))


          def check_lock(root, rows):
              expected = "".join("%s==%s --hash=sha256:%s\n" % (row.name, row.version, row.sha)
                                 for row in rows if row.role == "runtime")
              if read_text(os.path.join(root, "requirements.lock")) != expected:
                  raise Gap("FAIL", "requirements.lock is not the hash lock of the manifest runtime rows")


          def fetch_one(root, row, out):
              """One exact HTTPS GET with TLS verification, no redirect, no proxy, and no
              retry. The body goes to a .part file with an active byte cap, and the file
              gets its name only after the registered bytes and SHA-256 match."""
              final = os.path.join(root, "installer" if row.role == "installer" else "wheels", row.file)
              part = final + ".part"
              record = [row.role, row.name, row.version, row.file, row.url, row.bytes, row.sha, "-", "-", "-", "NOT_VERIFIED", "-"]
              out.append(record)
              connection = None
              try:
                  try:
                      connection = HTTPSConnection(HOST, 443, timeout=20, context=tls_context())
                      connection.request("GET", urllib.parse.urlsplit(row.url).path,
                                         headers={"User-Agent": "ucfd-m3-vtu-provision/1", "Accept-Encoding": "identity"})
                      response = connection.getresponse()
                      record[9] = response.status
                      if response.status != 200:
                          raise Gap("NOT_VERIFIED", "%s: HTTP status %s; no redirect, retry, or other source is used"
                                    % (row.file, response.status))
                      encoding = response.getheader("Content-Encoding")
                      if encoding not in (None, "", "identity"):
                          raise Gap("NOT_VERIFIED", "%s: the response has Content-Encoding %s" % (row.file, encoding))
                      length = response.getheader("Content-Length")
                      if length is not None and length.strip().isdigit() and int(length) > row.bytes:
                          raise Gap("FAIL", "%s: the response declares %s bytes, longer than the registered %d bytes"
                                    % (row.file, length.strip(), row.bytes))
                      digest, size = hashlib.sha256(), 0
                      fd = os.open(part, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      try:
                          while True:
                              chunk = response.read(min(1048576, row.bytes + 1 - size))
                              if not chunk:
                                  break
                              size += len(chunk)
                              if size > row.bytes:
                                  raise Gap("FAIL", "%s: the body is longer than the registered %d bytes" % (row.file, row.bytes))
                              digest.update(chunk)
                              view = memoryview(chunk)
                              while view:
                                  view = view[os.write(fd, view):]
                      finally:
                          os.close(fd)
                  except (OSError, http.client.HTTPException, ssl.SSLError) as error:
                      raise Gap("NOT_VERIFIED", "%s: the network request failed: %s: %s" % (row.file, type(error).__name__, error))
                  record[7], record[8] = size, digest.hexdigest()
                  if size < row.bytes:
                      raise Gap("NOT_VERIFIED", "%s: the body ended after %d of the registered %d bytes" % (row.file, size, row.bytes))
                  if record[8] != row.sha:
                      raise Gap("FAIL", "%s: SHA-256 %s differs from the registered SHA-256 %s" % (row.file, record[8], row.sha))
                  os.rename(part, final)
                  record[10] = "PASS"
              except Gap as gap:
                  record[10], record[11] = gap.result, gap.reason
                  try:
                      os.unlink(part)
                  except OSError:
                      pass
                  raise
              finally:
                  if connection is not None:
                      connection.close()


          def member_name_safe(name):
              if not name or "\x00" in name or "\\" in name or name.startswith("/") or re.match(r"[A-Za-z]:", name):
                  return False
              parts = name[:-1].split("/") if name.endswith("/") else name.split("/")
              return all(part not in ("", ".", "..") for part in parts)


          def file_tags(file):
              parts = file[:-len(".whl")].split("-")
              if len(parts) not in (5, 6):
                  raise Gap("NOT_VERIFIED", "%s does not have the wheel file-name tag form" % file)
              pys, abis, plats = parts[-3].split("."), parts[-2].split("."), parts[-1].split(".")
              return {"%s-%s-%s" % (p, a, s) for p in pys for a in abis for s in plats}


          def tag_supported(tag, facts):
              py, abi, plat = tag.split("-")
              if py not in ("py3", "cp312") or abi not in ("none", "cp312"):
                  return False
              if plat == "any":
                  return True
              legacy = {"manylinux1_x86_64": (2, 5), "manylinux2010_x86_64": (2, 12), "manylinux2014_x86_64": (2, 17)}
              match = re.fullmatch(r"manylinux_([0-9]+)_([0-9]+)_x86_64", plat)
              need = legacy.get(plat) or ((int(match.group(1)), int(match.group(2))) if match else None)
              return need is not None and glibc_version(facts) is not None and need <= glibc_version(facts)


          def inspect_wheel(root, row, rows, requires, installed, out, facts):
              """ZIP, METADATA, WHEEL, RECORD, closure, and installed-path checks of one
              verified archive. Executes no archive content. Returns the declared
              expanded bytes."""
              path = os.path.join(root, "installer" if row.role == "installer" else "wheels", row.file)
              record = [row.file, "-", "-", "-", "-", "-", "-", "NOT_VERIFIED", "-"]
              out.append(record)
              try:
                  base = stem(row.name, row.version)
                  info_dir, data_dir = base + ".dist-info/", base + ".data/"
                  try:
                      archive = zipfile.ZipFile(path)
                  except (zipfile.BadZipFile, OSError) as error:
                      raise Gap("FAIL", "%s is not a valid ZIP archive: %s" % (row.file, error))
                  with archive:
                      infos, names, expanded = archive.infolist(), set(), 0
                      for info in infos:
                          if not member_name_safe(info.filename):
                              raise Gap("FAIL", "%s has the unsafe member name %r" % (row.file, info.filename))
                          kind = stat.S_IFMT(info.external_attr >> 16)
                          if kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                              raise Gap("FAIL", "%s has the member %s, which is a link or a special file" % (row.file, info.filename))
                          if info.filename in names:
                              raise Gap("FAIL", "%s has the duplicate member %s" % (row.file, info.filename))
                          if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED) or info.flag_bits & 0x1:
                              raise Gap("NOT_VERIFIED", "%s has the member %s with an unsupported compression" % (row.file, info.filename))
                          names.add(info.filename)
                          expanded += info.file_size
                      record[1], record[2] = len(infos), expanded
                      infos_dirs = {name.split("/")[0] for name in names if name.split("/")[0].endswith(".dist-info")}
                      if infos_dirs != {info_dir[:-1]} or not {info_dir + "METADATA", info_dir + "WHEEL", info_dir + "RECORD"} <= names:
                          raise Gap("FAIL", "%s does not have the one dist-info directory %s with METADATA, WHEEL, and RECORD"
                                    % (row.file, info_dir))
                      meta = archive.read(info_dir + "METADATA")
                      record[3], record[4] = len(meta), hashlib.sha256(meta).hexdigest()
                      if record[3] != row.meta_bytes or record[4] != row.meta_sha:
                          raise Gap("FAIL", "%s: the embedded METADATA (%d bytes, SHA-256 %s) is not the published core metadata"
                                    % (row.file, record[3], record[4]))
                      headers, found = mandatory_requirements(meta)
                      if normal_name(headers.get("Name", "")) != normal_name(row.name) or headers.get("Version") != row.version:
                          raise Gap("FAIL", "%s: the METADATA Name %s and Version %s are not %s %s"
                                    % (row.file, headers.get("Name"), headers.get("Version"), row.name, row.version))
                      wanted_python = headers.get("Requires-Python")
                      if wanted_python and not satisfies(facts.get("version", "0"), wanted_python):
                          raise Gap("NOT_VERIFIED", "%s requires Python %s" % (row.file, wanted_python))
                      if row.role == "runtime":
                          check_requirements(row.name, found, requires, rows)
                      elif found:
                          raise Gap("FAIL", "the installer %s has the mandatory requirements %s" % (row.file, "; ".join(found)))
                      wheel = email.parser.BytesHeaderParser().parsebytes(archive.read(info_dir + "WHEEL"))
                      tags = set(wheel.get_all("Tag") or [])
                      if not str(wheel.get("Wheel-Version", "")).startswith("1.") or not tags or not tags <= file_tags(row.file):
                          raise Gap("NOT_VERIFIED", "%s: the WHEEL version or tags %s do not match the file name"
                                    % (row.file, " ".join(sorted(tags))))
                      if not any(tag_supported(tag, facts) for tag in tags):
                          raise Gap("NOT_VERIFIED", "%s: no tag of %s is supported by CPython 3.12 on Linux x86_64 with %s"
                                    % (row.file, " ".join(sorted(tags)), facts.get("glibc")))
                      record[5], record[6] = " ".join(sorted(tags)), "; ".join(found) or "-"
                      listed = set()
                      for cells in csv.reader(io.StringIO(archive.read(info_dir + "RECORD").decode("utf-8"))):
                          if cells:
                              listed.add(cells[0])
                      files = {name for name in names if not name.endswith("/")}
                      if files - {info_dir + "RECORD"} - listed or listed - files:
                          raise Gap("FAIL", "%s: RECORD does not list exactly the archive files" % row.file)
                      if row.role == "runtime":
                          for name in sorted(files):
                              target = name
                              if name.startswith(data_dir):
                                  scheme, _, rest = name[len(data_dir):].partition("/")
                                  prefix = {"purelib": "", "platlib": "", "data": "", "scripts": "bin/", "headers": "include/"}.get(scheme)
                                  if prefix is None or not rest:
                                      raise Gap("NOT_VERIFIED", "%s has the unsupported install layout %s" % (row.file, name))
                                  target = prefix + rest
                              if installed.get(target, row.name) != row.name:
                                  raise Gap("FAIL", "the installed path %s of %s and %s collide" % (target, installed[target], row.name))
                              installed[target] = row.name
                  record[7] = "PASS"
                  return expanded
              except Gap as gap:
                  record[7], record[8] = gap.result, gap.reason
                  raise


          def run(root):
              """The downloader and the archive checks. Writes fetch.tsv, wheels.tsv,
              and fetch.env in records/. Returns 0 for PASS, 1 for FAIL, and 2 for
              NOT_VERIFIED."""
              values = {"FETCH_RESULT": "NOT_VERIFIED", "FETCH_REASON": "the downloader did not reach its end"}
              fetched, inspected, result, reason = [], [], "PASS", "all archives have the registered bytes and SHA-256 and pass the archive checks"
              try:
                  check_root(root, empty=("installer", "wheels", "site"))
                  values["TASK_BYTES_BEFORE"] = task_bytes(root)
                  facts = interpreter_facts()
                  values.update({"PYTHON_" + key.upper(): value for key, value in facts.items()})
                  check_interpreter(facts)
                  rows = read_manifest(root)
                  check_lock(root, rows)
                  requires = read_requires(root, rows)
                  values["ARCHIVES"] = len(rows)
                  values["ARCHIVE_BYTES"] = sum(row.bytes for row in rows)
                  for row in rows:
                      fetch_one(root, row, fetched)
                  installed, expanded = {}, 0
                  for row in rows:
                      expanded += inspect_wheel(root, row, rows, requires, installed, inspected, facts)
                      values["EXPANDED_BYTES"] = expanded
                      if expanded > EXPANDED_LIMIT:
                          raise Gap("NOT_VERIFIED", "the declared expanded member bytes %d are above the %d-byte limit"
                                    % (expanded, EXPANDED_LIMIT))
                  values["TASK_BYTES_AFTER"] = task_bytes(root)
                  if values["TASK_BYTES_AFTER"] > TASK_LIMIT:
                      raise Gap("NOT_VERIFIED", "the task root holds %d bytes, above the %d-byte checkpoint limit"
                                % (values["TASK_BYTES_AFTER"], TASK_LIMIT))
              except Gap as gap:
                  result, reason = gap.result, gap.reason
              except Exception as error:
                  result, reason = "NOT_VERIFIED", "the downloader stopped: %s: %s" % (type(error).__name__, error)
              values["FETCH_RESULT"], values["FETCH_REASON"] = result, reason
              try:
                  records = os.path.join(root, "records")
                  write_record(os.path.join(records, "fetch.tsv"), tsv(
                      [["role", "distribution", "version", "file", "url", "expected_bytes", "expected_sha256", "bytes", "sha256",
                        "http_status", "result", "reason"]] + fetched))
                  write_record(os.path.join(records, "wheels.tsv"), tsv(
                      [["file", "members", "expanded_bytes", "metadata_bytes", "metadata_sha256", "tags", "requires", "result",
                        "reason"]] + inspected))
                  write_env(os.path.join(records, "fetch.env"), values)
              except (OSError, Gap):
                  return 2
              return {"PASS": 0, "FAIL": 1}.get(result, 2)


          def main(argv):
              set_limits(ARCHIVE_LIMIT)
              state = bound_streams()
              status = 2
              try:
                  status = run(argv[0]) if len(argv) == 1 else 2
              finally:
                  counts = close_streams(state)
              if len(argv) == 1:
                  status = finish(os.path.join(argv[0], "records", "fetch.env"), counts, "FETCH_RESULT", "FETCH_REASON", status)
              return status


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          VP_FETCH_PY

          # The fixed install program: the exact standard input of its vector.
          IFS= read -r -d '' VP_INSTALL_PY <<'VP_INSTALL_PY' || true
          import csv, email.parser, hashlib, io, os, re, resource, signal, stat, sys, sysconfig, threading, time

          ARCHIVE_LIMIT = 154218283
          EXPANDED_LIMIT = 1073741824
          TASK_LIMIT = 3221225472
          AS_LIMIT = 4294967296
          CPU_SECONDS = 60
          TEXT_LIMIT = 65536
          MANIFEST_FIELDS = ["role", "distribution", "version", "file", "url", "bytes", "sha256", "metadata_bytes", "metadata_sha256"]
          URL_RE = re.compile(r"https://files\.pythonhosted\.org/packages/[0-9a-f]{2}/[0-9a-f]{2}/[0-9a-f]{60}/([A-Za-z0-9_.+-]+\.whl)")


          class Gap(Exception):
              """A provision gap with its result (FAIL or NOT_VERIFIED) and its reason."""

              def __init__(self, result, reason):
                  super().__init__(reason)
                  self.result, self.reason = result, reason


          class Row:
              def __init__(self, cells):
                  (self.role, self.name, self.version, self.file, self.url, size, self.sha,
                   meta_size, self.meta_sha) = cells
                  self.bytes, self.meta_bytes = int(size), int(meta_size)


          def one_line(text, limit=300):
              text = re.sub(r"[\t\r\n]+", " ", str(text))
              return text[:limit] if text else "-"


          def set_limits(file_limit):
              """The approved process limits, set before any package code runs."""
              for name, value in (("RLIMIT_AS", AS_LIMIT), ("RLIMIT_CPU", CPU_SECONDS), ("RLIMIT_CORE", 0),
                                  ("RLIMIT_FSIZE", file_limit)):
                  resource.setrlimit(getattr(resource, name), (value, value))
              signal.signal(signal.SIGXFSZ, signal.SIG_IGN)


          def bound_streams():
              """Replace standard output and error with pipes. One thread for each pipe
              copies at most TEXT_LIMIT bytes to the original file and counts the rest,
              so a writer never blocks and no log grows past the limit."""
              sys.stdout.flush()
              sys.stderr.flush()
              state = {}
              for fd, name in ((1, "out"), (2, "err")):
                  target = os.dup(fd)
                  read_end, write_end = os.pipe()
                  os.dup2(write_end, fd)
                  os.close(write_end)
                  counts = [0, 0]

                  def drain(read_end=read_end, target=target, counts=counts):
                      while True:
                          try:
                              chunk = os.read(read_end, 65536)
                          except OSError:
                              break
                          if not chunk:
                              break
                          keep = memoryview(chunk)[:max(TEXT_LIMIT - counts[0], 0)]
                          counts[0] += len(keep)
                          counts[1] += len(chunk) - len(keep)
                          while keep:
                              try:
                                  keep = keep[os.write(target, keep):]
                              except OSError:
                                  break
                      os.close(read_end)

                  thread = threading.Thread(target=drain, daemon=True)
                  thread.start()
                  state[name] = (fd, target, counts, thread)
              return state


          def close_streams(state):
              """Flush, give the original files back, and wait at most 2 seconds for each
              drain. Returns the kept and dropped byte counts of the two streams."""
              for stream in (sys.stdout, sys.stderr):
                  try:
                      stream.flush()
                  except Exception:
                      pass
              result = {}
              for name in ("out", "err"):
                  fd, target, counts, thread = state[name]
                  os.dup2(target, fd)
                  os.close(target)
                  thread.join(2.0)
                  if thread.is_alive():
                      counts[1] += 1
                  result[name + "_kept"], result[name + "_dropped"] = counts
              return result


          def read_text(path, limit=TEXT_LIMIT):
              st = os.lstat(path)
              if not stat.S_ISREG(st.st_mode) or st.st_size > limit:
                  raise Gap("NOT_VERIFIED", "%s is not a regular file of at most %d bytes" % (os.path.basename(path), limit))
              with open(path, "rb") as f:
                  data = f.read(limit + 1)
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  raise Gap("FAIL", "%s is not UTF-8 text" % os.path.basename(path))


          def write_record(path, text):
              """Write one record, with at most TEXT_LIMIT bytes, through no link."""
              data = text.encode("utf-8", "replace")
              if len(data) > TEXT_LIMIT:
                  raise Gap("NOT_VERIFIED", "%s would hold %d bytes, above the %d-byte record limit"
                            % (os.path.basename(path), len(data), TEXT_LIMIT))
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o600)
              try:
                  view = memoryview(data)
                  while view:
                      view = view[os.write(fd, view):]
              finally:
                  os.close(fd)


          def write_env(path, values):
              """KEY=value lines in insertion order, then WORK_FINISH as the last line."""
              values.pop("WORK_FINISH", None)
              lines = ["%s=%s" % (key, one_line(value, 4000)) for key, value in values.items()]
              lines.append("WORK_FINISH=%d" % int(time.time() * 1000))
              write_record(path, "\n".join(lines) + "\n")


          def tsv(rows):
              return "".join("\t".join(one_line(cell, 1000) for cell in row) + "\n" for row in rows)


          def check_root(root, empty=()):
