name: openfoam-evidence

# Manual real-OpenFOAM evidence run for the A4-1a evidence Item.
#
# This workflow runs OpenCFD OpenFOAM v2512 through the Orchestrator for one
# DOE Batch CSV row and one Case, with the Stages setup, mesh, flow, and
# post-processing. The transport Stage never runs.
#
# The workflow starts only through workflow_dispatch. It is never a required
# check. GitHub registers the trigger only for a workflow file that exists on
# the default branch, so this file reaches main before any dispatch.
#
# The workflow tunes nothing. The run uses the committed setup defaults, and a
# real product failure stays a real product failure.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: OpenFOAM v2512 four-Stage evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # No OpenFOAM target is hard-coded here. The committed
      # .openfoam-version file is the single active target, and the
      # baseline step publishes the derived values through GITHUB_ENV for
      # every later step. These placeholders only give an explicit value
      # to a step that runs before or without a resolved baseline.
      OPENFOAM_PACKAGE: UNAVAILABLE
      OPENFOAM_BASHRC: UNAVAILABLE

    steps:
      # ---------------------------------------------------------------------
      # 1. The clock. This step is first, before checkout, installation, and
      #    preparation, so the absolute deadline covers every later phase.
      # ---------------------------------------------------------------------
      - name: Start the evidence clock
        run: |
          start="$(date +%s)"
          # The runner context is not available in job-level env, and the
          # evidence directory must stay outside the checkout, so this step
          # derives it from RUNNER_TEMP and publishes it. This step writes no
          # repository file and no evidence file, so the order is safe.
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_CLOCK_START=${start}" >> "$GITHUB_ENV"
          echo "CAPTURE_DEADLINE=$(( start + 6300 ))" >> "$GITHUB_ENV"
          echo "CAPTURE_START_GUARD_SECONDS=60" >> "$GITHUB_ENV"
          {
            echo "CHECKOUT_RESULT=NOT_ATTEMPTED"
            echo "INSTALL_RESULT=NOT_ATTEMPTED"
            echo "PREPARE_RESULT=NOT_ATTEMPTED"
            echo "BASELINE_RESULT=NOT_ATTEMPTED"
            echo "OPENFOAM_BASELINE=UNAVAILABLE"
            echo "ORCHESTRATOR_STARTED=false"
            echo "OVERALL_RESULT=NOT_ATTEMPTED"
            echo "STAGE_SETUP=NOT_ATTEMPTED"
            echo "STAGE_MESH=NOT_ATTEMPTED"
            echo "STAGE_FLOW=NOT_ATTEMPTED"
            echo "STAGE_POST=NOT_ATTEMPTED"
            echo "OPENFOAM_VERSION=UNAVAILABLE"
            echo "TIMEOUT_WRAPPER_STATUS=NOT_RECORDED"
          } >> "$GITHUB_ENV"
          echo "evidence clock start: ${start}"
          echo "capture deadline    : $(( start + 6300 ))"

      # ---------------------------------------------------------------------
      # 2. The single status mechanism. Production and every pre-merge status
      #    check call these same three functions.
      # ---------------------------------------------------------------------
      - name: Create the bounded-runner library
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env, so the step
          # derives the library path from RUNNER_TEMP and publishes it.
          LIB="${RUNNER_TEMP}/evidence_lib.sh"
          echo "LIB=${LIB}" >> "$GITHUB_ENV"
          mkdir -p "$(dirname -- "$LIB")"
          cat > "$LIB" <<'EVIDENCE_LIB'
          # budget_seconds <grace> - print raw, grace, guard, available.
          # available = raw_remaining - termination_grace - capture_start_guard.
          # Pass only available to timeout.
          budget_seconds() {
              local grace="$1" now raw guard available
              now="$(date +%s)"
              raw=$(( CAPTURE_DEADLINE - now ))
              guard="$CAPTURE_START_GUARD_SECONDS"
              available=$(( raw - grace - guard ))
              printf '%s %s %s %s\n' "$raw" "$grace" "$guard" "$available"
          }

          # run_bounded <status_file> <timeout_log> <grace> <available> <command> [args...]
          # Sets TIMEOUT_WRAPPER_STATUS. Writes the child status atomically to
          # <status_file>. Terminates every descendant before it returns.
          run_bounded() {
              local status_file="$1" timeout_log="$2" grace="$3" available="$4"
              local pgid_file="${status_file}.pgid"
              shift 4
              rm -f -- "$status_file" "${status_file}.tmp" "$pgid_file"
              set +e
              LC_ALL=C timeout --verbose --signal=TERM --kill-after="${grace}s" "${available}s" \
                  bash -c '
                      status_file="$1"; shift
                      set -m
                      set +e
                      "$@" &
                      child=$!
                      printf "%s\n" "$child" > "${status_file}.pgid"
                      trap "kill -TERM -- -${child} 2>/dev/null" TERM
                      child_status=0
                      while kill -0 "$child" 2>/dev/null; do
                          wait "$child"; child_status=$?
                      done
                      printf "%s\n" "$child_status" > "${status_file}.tmp"
                      mv "${status_file}.tmp" "${status_file}"
                      exit "$child_status"
                  ' _ "$status_file" "$@" 2> "$timeout_log"
              TIMEOUT_WRAPPER_STATUS=$?
              set -e
              local pgid own_pgid
              own_pgid="$(ps -o pgid= -p $$ 2>/dev/null | tr -d ' ' || true)"
              if [[ -f "$pgid_file" ]]; then
                  pgid="$(cat -- "$pgid_file" 2>/dev/null || true)"
                  if [[ "$pgid" =~ ^[0-9]+$ ]] \
                     && [[ -n "$own_pgid" ]] && [[ "$pgid" != "$own_pgid" ]] \
                     && kill -0 -- "-${pgid}" 2>/dev/null; then
                      kill -KILL -- "-${pgid}" 2>/dev/null || true
                  fi
              fi
              return 0
          }

          # classify_result <status_file> <timeout_log>
          # An anchored timeout diagnostic has priority over a status file.
          classify_result() {
              local status_file="$1" timeout_log="$2" recorded
              if [[ -s "$timeout_log" ]] \
                 && LC_ALL=C grep -Eq '^timeout: sending signal (TERM|KILL)' "$timeout_log"; then
                  printf 'BUDGET_EXCEEDED\n'; return 0
              fi
              if [[ -f "$status_file" ]]; then
                  recorded="$(cat -- "$status_file")"
                  if [[ "$recorded" =~ ^[0-9]+$ ]]; then
                      if [[ "$recorded" == "0" ]]; then printf 'SUCCEEDED\n'
                      else printf 'FAILED_EXIT_%s\n' "$recorded"; fi
                      return 0
                  fi
              fi
              printf 'INFRASTRUCTURE_FAILURE\n'
          }
          EVIDENCE_LIB
          bash -n "$LIB"
          echo "bounded-runner library written to ${LIB}"
          sha256sum "$LIB"

      # ---------------------------------------------------------------------
      # 3. The bounded checkout. A checkout stop is never BUDGET_EXCEEDED.
      # ---------------------------------------------------------------------
      - name: Check out the repository
        id: checkout
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/checkout@v5

      - name: Record the checkout phase result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [[ "${{ steps.checkout.outcome }}" == "success" ]]; then
              echo "CHECKOUT_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
              echo "checkout phase: SUCCEEDED"
          else
              {
                echo "CHECKOUT_RESULT=INFRASTRUCTURE_FAILURE"
                echo "CHECKOUT_REASON=checkout outcome ${{ steps.checkout.outcome }}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "checkout phase: INFRASTRUCTURE_FAILURE (${{ steps.checkout.outcome }})" >&2
          fi

      # ---------------------------------------------------------------------
      # 4. The OpenFOAM baseline. The committed .openfoam-version file is the
      #    single active target of this workflow. This step runs after
      #    checkout, validates the exact target, and derives the package name
      #    and the environment file path from the validated value. A missing,
      #    unreadable, multi-line, or different baseline records an
      #    infrastructure failure and stops the run before installation,
      #    preparation, and the Orchestrator.
      # ---------------------------------------------------------------------
      - name: Resolve the OpenFOAM baseline
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          baseline_file="${GITHUB_WORKSPACE}/.openfoam-version"
          expected="v2512"

          # Every rejected baseline records the same four values, so no later
          # phase can start and the reason stays one environment-file line.
          baseline_fail() {
              {
                echo "BASELINE_RESULT=INFRASTRUCTURE_FAILURE"
                echo "BASELINE_REASON=$1"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "baseline phase: INFRASTRUCTURE_FAILURE, $1" >&2
              exit 0
          }

          if [[ ! -f "$baseline_file" || ! -r "$baseline_file" ]]; then
              baseline_fail "the baseline file .openfoam-version is missing or unreadable"
          fi

          # One literal X keeps the final newline byte significant, so this
          # one comparison rejects a missing line ending, a trailing byte, a
          # second line, and a different target.
          raw="$(cat -- "$baseline_file"; printf X)"
          if [[ "$raw" != "${expected}"$'\n'"X" ]]; then
              observed="$(printf '%s' "${raw%X}" | tr '\n' ' ' | cut -c1-120)"
              baseline_fail "the baseline must hold the exact bytes '${expected}' and one line ending; observed '${observed}'"
          fi

          # The release token, the package name, and the environment file path
          # all come from the validated baseline value.
          baseline="${raw%$'\n'X}"
          release="${baseline#v}"
          {
            echo "OPENFOAM_BASELINE=${baseline}"
            echo "OPENFOAM_RELEASE=${release}"
            echo "OPENFOAM_PACKAGE=openfoam${release}-default"
            echo "OPENFOAM_BASHRC=/usr/lib/openfoam/openfoam${release}/etc/bashrc"
            echo "BASELINE_RESULT=SUCCEEDED"
          } >> "$GITHUB_ENV"
          echo "baseline        : ${baseline}"
          echo "release token   : ${release}"
          echo "package         : openfoam${release}-default"
          echo "environment file: /usr/lib/openfoam/openfoam${release}/etc/bashrc"

      # ---------------------------------------------------------------------
      # 5. Installation. The derived package from the official openfoam.com
      #    method. The step starts only after a resolved baseline.
      # ---------------------------------------------------------------------
      - name: Install OpenFOAM v2512
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED' && env.BASELINE_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 30)"
          {
            echo "INSTALL_RAW_REMAINING=${raw}"
            echo "INSTALL_GRACE=${grace}"
            echo "INSTALL_CAPTURE_GUARD=${guard}"
            echo "INSTALL_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "install budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "install phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          run_bounded "${EVIDENCE_DIR}/install_status.txt" \
                      "${EVIDENCE_DIR}/install-timeout.log" \
                      "$grace" "$available" \
              bash -c '
                  set -euo pipefail
                  curl -fsSL https://dl.openfoam.com/add-debian-repo.sh | sudo bash
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends "$1"
              ' _ "$OPENFOAM_PACKAGE" > "${EVIDENCE_DIR}/install.log" 2>&1
          install_result="$(classify_result "${EVIDENCE_DIR}/install_status.txt" \
                                            "${EVIDENCE_DIR}/install-timeout.log")"
          echo "INSTALL_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$install_result" == "SUCCEEDED" ]]; then
              echo "INSTALL_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$install_result" == "BUDGET_EXCEEDED" ]]; then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "INSTALL_REASON=${install_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "install phase: ${install_result}"
          tail -n 40 "${EVIDENCE_DIR}/install.log" || true

      - name: Record the OpenFOAM version
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          # The OpenFOAM etc/bashrc sources a chain of scripts. An absent file
          # ends the step under set -e, and an unset variable in that chain
          # ends the step under set -u. Either stop would leave the phase
          # without a reason, so the environment load is guarded and every
          # failure records INFRASTRUCTURE_FAILURE with the exact reason.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The gate requires the exact validated baseline. A non-empty but
          # different version is a rejected environment, so the run can never
          # produce evidence under an unintended OpenFOAM release.
          version="${WM_PROJECT_VERSION:-}"
          if (( source_status != 0 )) || [[ "$version" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${version}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${version}'" >&2
              exit 0
          fi

          # The environment identity. Every value comes from the installed
          # system. The package version comes from the package database. A
          # value that cannot be obtained becomes the explicit UNAVAILABLE
          # token. No value is invented.
          package_version="$(dpkg-query -W -f='${Version}' "$OPENFOAM_PACKAGE" 2>/dev/null || true)"
          [[ -n "$package_version" ]] || package_version="UNAVAILABLE"
          os_identity="$( ( . /etc/os-release && printf '%s' "${PRETTY_NAME:-}" ) 2>/dev/null || true )"
          [[ -n "$os_identity" ]] || os_identity="UNAVAILABLE"
          architecture="$(uname -m 2>/dev/null || true)"
          [[ -n "$architecture" ]] || architecture="UNAVAILABLE"
          gcc_version="$(gcc -dumpfullversion 2>/dev/null || true)"
          [[ -n "$gcc_version" ]] || gcc_version="UNAVAILABLE"
          wm_options="${WM_OPTIONS:-}"
          [[ -n "$wm_options" ]] || wm_options="UNAVAILABLE"

          {
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE}"
            echo "OPENFOAM_PACKAGE_VERSION=${package_version}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC}"
            echo "WM_PROJECT_VERSION=${version}"
            echo "WM_OPTIONS=${wm_options}"
            echo "OS_IDENTITY=${os_identity}"
            echo "ARCHITECTURE=${architecture}"
            echo "GCC_VERSION=${gcc_version}"
            echo "simpleFoam: $(command -v simpleFoam || echo UNAVAILABLE)"
            echo "snappyHexMesh: $(command -v snappyHexMesh || echo UNAVAILABLE)"
            echo "surfaceTransformPoints: $(command -v surfaceTransformPoints || echo UNAVAILABLE)"
            echo "foamToVTK: $(command -v foamToVTK || echo UNAVAILABLE)"
          } | tee "${EVIDENCE_DIR}/openfoam-version.txt"
          # Only the accepted version reaches GITHUB_ENV. WM_PROJECT_VERSION
          # stays unpublished, because an inherited value would let a later
          # step pass its revalidation without a loaded environment.
          echo "OPENFOAM_VERSION=${version}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 6. Preparation. The repository already holds the base Case template
      #    src/master_batch/simpleFoam_files and the DOE Batch CSV
      #    src/output_batch_1.csv. The contract needs one Case, so the job
      #    builds a one-row DOE Batch CSV from the committed header and one
      #    committed data row. The job adds no file to the repository and
      #    changes no committed dictionary, no committed STL, and no
      #    committed default.
      # ---------------------------------------------------------------------
      - name: Prepare the one-Case DOE Batch CSV
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 15)"
          {
            echo "PREPARE_RAW_REMAINING=${raw}"
            echo "PREPARE_GRACE=${grace}"
            echo "PREPARE_CAPTURE_GUARD=${guard}"
            echo "PREPARE_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "prepare budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "prepare phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          # The preparation body is an inline script, so the job adds no
          # repository file. run_bounded wraps that script.
          run_bounded "${EVIDENCE_DIR}/prepare_status.txt" \
                      "${EVIDENCE_DIR}/prepare-timeout.log" \
                      "$grace" "$available" \
              bash -c '
          set -euo pipefail
          cd "$1"
          case_id="$2"
          source_csv="src/output_batch_1.csv"
          run_csv="src/output_batch_9.csv"
          base="src/master_batch/simpleFoam_files"

          # The committed base Case is read-only input. Confirm it, never
          # rewrite it.
          for required in \
              "${base}/system/blockMeshDict" \
              "${base}/system/snappyHexMeshDict" \
              "${base}/system/controlDict" \
              "${base}/system/decomposeParDict" \
              "${base}/constant/turbulenceProperties" \
              "${base}/constant/triSurface/f18p2_all.stl" \
              "${base}/0/U" "${base}/0/p" "${base}/0/k" \
              "${base}/0/epsilon" "${base}/0/nut" \
              "$source_csv"; do
              [[ -f "$required" ]] || { echo "missing committed input: $required" >&2; exit 1; }
          done

          # One header row and exactly one data row, selected by Case id.
          head -n 1 -- "$source_csv" > "$run_csv"
          selected="$(awk -F, -v want="$case_id" \
              "NR>1 && \$1==want { print; exit }" "$source_csv")"
          [[ -n "$selected" ]] || { echo "Case ${case_id} not found in ${source_csv}" >&2; exit 1; }
          printf "%s\n" "$selected" >> "$run_csv"

          echo "== the one-Case DOE Batch CSV =="
          cat -- "$run_csv"
          echo "== committed base Case inventory =="
          find "$base" -type f | sort | head -n 40
          echo "== base Case file count =="
          find "$base" -type f | wc -l
          ' _ "$GITHUB_WORKSPACE" "7" > "${EVIDENCE_DIR}/prepare.log" 2>&1
          prepare_result="$(classify_result "${EVIDENCE_DIR}/prepare_status.txt" \
                                            "${EVIDENCE_DIR}/prepare-timeout.log")"
          echo "PREPARE_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$prepare_result" == "SUCCEEDED" ]]; then
              echo "PREPARE_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$prepare_result" == "BUDGET_EXCEEDED" ]]; then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "PREPARE_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "PREPARE_REASON=${prepare_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "prepare phase: ${prepare_result}"
          cat "${EVIDENCE_DIR}/prepare.log" || true

      # ---------------------------------------------------------------------
      # 7. The bounded Orchestrator. Four Stages, one Case, -j 1, no tuning.
      # ---------------------------------------------------------------------
      - name: Run the Orchestrator
        if: always() && env.PREPARE_RESULT == 'SUCCEEDED'
        env:
          # The opt-in of specification Section 9.2. The runner has four cores
          # and the committed Case default is NP="8", so the mesh Stage needs
          # the explicit oversubscription policy. The value stays on this one
          # step, so no other step and no other phase inherits it.
          BATCH_STAGE_MPI_OVERSUBSCRIBE: "1"
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"

          # The same guarded environment load as the version step. The
          # Orchestrator never starts without a loaded OpenFOAM environment.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The Orchestrator revalidates the exact baseline after it sources
          # the environment file. A non-empty but different version stops the
          # run before the Orchestrator starts.
          if (( source_status != 0 )) || [[ "${WM_PROJECT_VERSION:-}" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'" >&2
              exit 0
          fi

          csv="${GITHUB_WORKSPACE}/src/output_batch_9.csv"

          read -r raw grace guard available <<< "$(budget_seconds 60)"
          {
            echo "ORCHESTRATOR_RAW_REMAINING=${raw}"
            echo "ORCHESTRATOR_GRACE=${grace}"
            echo "ORCHESTRATOR_CAPTURE_GUARD=${guard}"
            echo "ORCHESTRATOR_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "orchestrator budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "ORCHESTRATOR_STARTED=false" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "ORCHESTRATOR_STARTED=true" >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_START=$(date +%s)" >> "$GITHUB_ENV"
              cd "$GITHUB_WORKSPACE"
              run_bounded "${EVIDENCE_DIR}/orchestrator_status.txt" \
                          "${EVIDENCE_DIR}/orchestrator-timeout.log" \
                          "$grace" "$available" \
                  bash -c 'bash src/run_batch.sh --stage setup,mesh,flow,post-processing -j 1 "$1" \
                               > "$2" 2>&1' _ "$csv" "${EVIDENCE_DIR}/orchestrator.log"
              echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=$(classify_result "${EVIDENCE_DIR}/orchestrator_status.txt" \
                                                     "${EVIDENCE_DIR}/orchestrator-timeout.log")" \
                  >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_END=$(date +%s)" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------------------
      # 8. The capture sequence. This step is the next step after the bounded
      #    execution and records CAPTURE_START before any parsing.
      # ---------------------------------------------------------------------
      - name: Capture the evidence
        if: always()
        run: |
          set -euo pipefail
          capture_start="$(date +%s)"
          echo "CAPTURE_START=${capture_start}" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          deadline="${CAPTURE_DEADLINE:-0}"
          echo "CAPTURE_START=${capture_start}" | tee "${EVIDENCE_DIR}/capture-clock.txt"
          {
            echo "EVIDENCE_CLOCK_START=${EVIDENCE_CLOCK_START:-UNAVAILABLE}"
            echo "CAPTURE_DEADLINE=${deadline}"
            echo "CAPTURE_START_GUARD_SECONDS=${CAPTURE_START_GUARD_SECONDS:-UNAVAILABLE}"
            echo "CAPTURE_START_WITHIN_DEADLINE=$([[ "$capture_start" -le "$deadline" ]] \
                 && echo true || echo false)"
          } >> "${EVIDENCE_DIR}/capture-clock.txt"

          # Every extraction below is guarded, so a non-match or a missing
          # file never ends the step. The only grep in this workflow is the
          # anchored classifier match, which runs inside an if condition.
          for name in orchestrator.log orchestrator-timeout.log install.log prepare.log; do
              [[ -f "${EVIDENCE_DIR}/${name}" ]] || echo "UNAVAILABLE" > "${EVIDENCE_DIR}/${name}"
          done
          if [[ -f "${EVIDENCE_DIR}/orchestrator_status.txt" ]]; then
              cp -- "${EVIDENCE_DIR}/orchestrator_status.txt" \
                    "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          else
              echo "ABSENT" > "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          fi

          workspace_root="${GITHUB_WORKSPACE}/src"
          batch_dir="${workspace_root}/batch_9"
          {
            echo "== Batch Workspace tree =="
            if [[ -d "$batch_dir" ]]; then find "$batch_dir" -maxdepth 4 | sort; else echo "ABSENT"; fi
          } > "${EVIDENCE_DIR}/batch-workspace-tree.txt"

          # The corrected selective capture. Each selected file keeps its path
          # relative to the Batch Workspace, so a reviewer can see which Stage and
          # which Case produced it. The selection stays explicit: no VTU file, no
          # checkout copy, and no unfiltered Batch Workspace copy is collected.
          #
          # copy_relative <source-file> <destination-root>
          copy_relative() {
              local source_file="$1" destination_root="$2" relative target
              relative="${source_file#"${batch_dir}/"}"
              target="${destination_root}/${relative}"
              mkdir -p -- "$(dirname -- "$target")" 2>/dev/null || return 0
              cp -- "$source_file" "$target" 2>/dev/null || true
          }

          # collect_selected <destination-root> <find-expression>...
          collect_selected() {
              local destination_root="$1"
              shift
              local selected
              while IFS= read -r selected; do
                  [[ -n "$selected" ]] || continue
                  copy_relative "$selected" "$destination_root"
              done < <(find "$batch_dir" "$@" -type f 2>/dev/null || true)
          }

          mkdir -p "${EVIDENCE_DIR}/summaries" "${EVIDENCE_DIR}/stage-logs"
          if [[ -d "$batch_dir" ]]; then
              # Each Stage summary is a root-relative file, so its relative path is
              # its file name and the destination stays the same as before.
              collect_selected "${EVIDENCE_DIR}/summaries" \
                  -maxdepth 1 -name '*_summary.csv'

              # Fault 1. The five Failure Artifact names begin with a dot, so the
              # earlier FAILED_* pattern matched none of them.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -maxdepth 1 \
                  \( -name '.setup_cases_failed' \
                  -o -name '.run_mesh_cases_failed' \
                  -o -name '.run_flow_cases_failed' \
                  -o -name '.run_transport_cases_failed' \
                  -o -name '.run_post_processing_cases_failed' \)

              # The Case-level OpenFOAM command logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -name 'log.*'

              # Fault 2. Every per-Case Stage log directory, and the post-processing
              # conversion logs under <case>/vtk/logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" \
                  \( -path '*/_setup_logs/*' \
                  -o -path '*/_mesh_logs/*' \
                  -o -path '*/_flow_logs/*' \
                  -o -path '*/_transport_logs/*' \
                  -o -path '*/vtk/logs/*' \) -name '*.log'
          fi

          # Stage results from the summary files, when the summaries exist. The
          # summaries keep their Batch Workspace-relative path, and each Stage
          # summary is a root-relative file, so stage-summary-lines.txt keeps its
          # existing payload.
          stage_from_summary() {
              local file="${EVIDENCE_DIR}/summaries/$1"
              if [[ -f "$file" ]]; then
                  tail -n +2 -- "$file" | head -n 1 || true
              else
                  echo "ABSENT"
              fi
          }
          {
            echo "setup:  $(stage_from_summary setup_cases_summary.csv)"
            echo "mesh:   $(stage_from_summary run_mesh_cases_summary.csv)"
            echo "flow:   $(stage_from_summary run_flow_cases_summary.csv)"
            echo "post:   $(stage_from_summary run_post_processing_cases_summary.csv)"
          } > "${EVIDENCE_DIR}/stage-summary-lines.txt"

          # Change 7. The bounded VTU point-data manifest.
          #
          # The array names come from the file header only. A foamToVTK VTU file is a
          # VTK XML file whose binary payload starts at <AppendedData. The extraction
          # input ends exactly at the first byte of that marker, so the parser never
          # receives an appended-payload byte and needs no header size limit.
          #
          # The byte count and the SHA-256 describe the complete source file, and the
          # checksum streams that file. A checksum is file identity evidence. It is
          # not scientific validation.

          vtu_expected_fields() {
              case "${1##*/}" in
                  flow_0.vtu) echo "U p wallDistance" ;;
                  flow_latest_*.vtu) echo "U p" ;;
                  trd_*.vtu) echo "${SCALAR_FIELD:-T}" ;;
                  *) echo "UNKNOWN" ;;
              esac
          }

          vtu_header_point_data_names() {
              # One streaming pass that stops at the appended-payload marker.
              #
              # Each dd call issues one read, so it returns the bytes that are
              # available instead of waiting for a full block. The loop ends as soon
              # as the marker appears, and the text is then cut at the marker, so the
              # parser input holds no appended-payload byte and the extraction never
              # waits for payload that a producer has not released.
              #
              # Two earlier forms were wrong. A 65536-byte limit dropped a valid
              # PointData declaration past that byte. Making the awk record separator
              # the tag opening character ended the marker record only at the next
              # such byte, so the parser could wait for, and hold, the complete
              # payload.
              #
              # The scan is scoped to each PointData element, so a CellData element
              # that shares one line with a PointData end tag contributes no name.
              # The regular expressions use the string form, so no separator needs
              # escaping.
              local vtu_chunk vtu_header=""
              exec 3< "$1" || return 0
              while :; do
                  vtu_chunk="$(dd bs=512 count=1 status=none <&3)"
                  [[ -n "$vtu_chunk" ]] || break
                  vtu_header="${vtu_header}${vtu_chunk}"
                  case "$vtu_header" in *'<AppendedData'*) break ;; esac
              done
              exec 3<&-
              printf '%s' "${vtu_header%%<AppendedData*}" |
                  awk 'BEGIN { ORS = "" }
                      { header = header $0 "\n" }
                      END {
                          while (match(header, "<PointData[ />]")) {
                              header = substr(header, RSTART)
                              closing = match(header, "</PointData[ >]")
                              if (closing == 0) {
                                  segment = header
                                  header = ""
                              } else {
                                  segment = substr(header, 1, closing - 1)
                                  header = substr(header, closing + 1)
                              }
                              while (match(segment, "Name=\"[^\"]*\"")) {
                                  printf "%s%s", (count++ ? " " : ""), \
                                      substr(segment, RSTART + 6, RLENGTH - 7)
                                  segment = substr(segment, RSTART + RLENGTH)
                              }
                          }
                          printf "\n"
                      }' 2>/dev/null || true
          }

          vtk_dir_count=0
          if [[ -d "$batch_dir" ]]; then
              vtk_dir_count="$(find "$batch_dir" -type d -name vtk 2>/dev/null |
                               wc -l | tr -d ' ')"
          fi

          {
            echo "== VTU point-data manifest =="
            echo "EXPECTED_FIELD_SOURCE=run_post_processing_cases.sh FLOW_ZERO_FIELDS, FLOW_RESULT_FIELDS, TRD_FIELDS"
            echo "SCALAR_FIELD=${SCALAR_FIELD:-T}"
            echo "VTK_DIRECTORY_COUNT=${vtk_dir_count}"
            vtu_count=0
            while IFS= read -r vtu_file; do
                [[ -n "$vtu_file" ]] || continue
                vtu_count=$(( vtu_count + 1 ))
                echo
                echo "VTU_PATH=${vtu_file#"${batch_dir}/"}"
                echo "VTU_BYTES=$(wc -c < "$vtu_file" 2>/dev/null | tr -d ' ')"
                echo "VTU_SHA256=$(sha256sum -- "$vtu_file" 2>/dev/null | cut -d' ' -f1)"
                echo "VTU_EXPECTED_FIELDS=$(vtu_expected_fields "$vtu_file")"
                echo "VTU_OBSERVED_FIELDS=$(vtu_header_point_data_names "$vtu_file")"
            done < <(find "$batch_dir" -path '*/vtk/*' -name '*.vtu' -type f \
                         2>/dev/null | sort || true)
            echo
            echo "VTU_FILE_COUNT=${vtu_count}"
            if (( vtu_count == 0 )); then
                echo "VTU_EVIDENCE=UNAVAILABLE"
                if [[ ! -d "$batch_dir" ]]; then
                    echo "VTU_REASON=The Batch Workspace does not exist, so the post-processing Stage produced no VTU file."
                elif (( vtk_dir_count == 0 )); then
                    echo "VTU_REASON=No Case holds a vtk directory, so the post-processing Stage wrote no VTU file."
                else
                    echo "VTU_REASON=A vtk directory exists and holds no .vtu file."
                fi
            else
                echo "VTU_EVIDENCE=PRESENT"
            fi
          } > "${EVIDENCE_DIR}/vtu-point-data.txt"
          cat "${EVIDENCE_DIR}/vtu-point-data.txt"

          {
            echo "CHECKOUT_RESULT=${CHECKOUT_RESULT:-NOT_ATTEMPTED}"
            echo "INSTALL_RESULT=${INSTALL_RESULT:-NOT_ATTEMPTED}"
            echo "PREPARE_RESULT=${PREPARE_RESULT:-NOT_ATTEMPTED}"
            echo "ORCHESTRATOR_STARTED=${ORCHESTRATOR_STARTED:-false}"
            echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}"
            echo "OVERALL_RESULT=${OVERALL_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_VERSION=${OPENFOAM_VERSION:-UNAVAILABLE}"
            echo "BASELINE_RESULT=${BASELINE_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE:-UNAVAILABLE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE:-UNAVAILABLE}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC:-UNAVAILABLE}"
          } > "${EVIDENCE_DIR}/phase-results.txt"
          cat "${EVIDENCE_DIR}/phase-results.txt"

      - name: Write the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## OpenFOAM v2512 evidence run"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| OpenFOAM baseline | \`${OPENFOAM_BASELINE:-UNAVAILABLE}\` |"
            echo "| Baseline phase | \`${BASELINE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| OpenFOAM version | \`${OPENFOAM_VERSION:-UNAVAILABLE}\` |"
            echo "| Checkout phase | \`${CHECKOUT_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Installation phase | \`${INSTALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Preparation phase | \`${PREPARE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Orchestrator started | \`${ORCHESTRATOR_STARTED:-false}\` |"
            echo "| Wrapper status | \`${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}\` |"
            echo "| Overall result | \`${OVERALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Capture start | \`${CAPTURE_START:-UNAVAILABLE}\` |"
            echo "| Capture deadline | \`${CAPTURE_DEADLINE:-UNAVAILABLE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam-v2512-evidence
          # Only the selected evidence of the capture step. The directory holds
          # no checkout copy, no unfiltered Batch Workspace, and no VTU file.
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          # The five Failure Artifact names begin with a dot. The action default
          # is false, so a copied dot-prefixed file would not reach the artifact
          # without this input.
          include-hidden-files: true
          retention-days: 90
