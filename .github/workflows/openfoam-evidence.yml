name: openfoam-evidence

# Manual real-OpenFOAM evidence run for the A4-1a evidence Item.
#
# This workflow runs OpenCFD OpenFOAM v2512 through the Orchestrator for one
# DOE Batch CSV row and one Case, with the Stages setup, mesh, flow, and
# post-processing. The transport Stage never runs.
#
# The workflow starts only through workflow_dispatch. It is never a required
# check. GitHub registers the trigger only for a workflow file that exists on
# the default branch, so this file reaches main before any dispatch.
#
# The workflow tunes nothing. The run uses the committed setup defaults, and a
# real product failure stays a real product failure.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: OpenFOAM v2512 four-Stage evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # No OpenFOAM target is hard-coded here. The committed
      # .openfoam-version file is the single active target, and the
      # baseline step publishes the derived values through GITHUB_ENV for
      # every later step. These placeholders only give an explicit value
      # to a step that runs before or without a resolved baseline.
      OPENFOAM_PACKAGE: UNAVAILABLE
      OPENFOAM_BASHRC: UNAVAILABLE

    steps:
      # ---------------------------------------------------------------------
      # 1. The clock. This step is first, before checkout, installation, and
      #    preparation, so the absolute deadline covers every later phase.
      # ---------------------------------------------------------------------
      - name: Start the evidence clock
        run: |
          start="$(date +%s)"
          # The runner context is not available in job-level env, and the
          # evidence directory must stay outside the checkout, so this step
          # derives it from RUNNER_TEMP and publishes it. This step writes no
          # repository file and no evidence file, so the order is safe.
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_CLOCK_START=${start}" >> "$GITHUB_ENV"
          echo "CAPTURE_DEADLINE=$(( start + 6300 ))" >> "$GITHUB_ENV"
          echo "CAPTURE_START_GUARD_SECONDS=60" >> "$GITHUB_ENV"
          {
            echo "CHECKOUT_RESULT=NOT_ATTEMPTED"
            echo "INSTALL_RESULT=NOT_ATTEMPTED"
            echo "PREPARE_RESULT=NOT_ATTEMPTED"
            echo "BASELINE_RESULT=NOT_ATTEMPTED"
            echo "OPENFOAM_BASELINE=UNAVAILABLE"
            echo "ORCHESTRATOR_STARTED=false"
            echo "OVERALL_RESULT=NOT_ATTEMPTED"
            echo "STAGE_SETUP=NOT_ATTEMPTED"
            echo "STAGE_MESH=NOT_ATTEMPTED"
            echo "STAGE_FLOW=NOT_ATTEMPTED"
            echo "STAGE_POST=NOT_ATTEMPTED"
            echo "OPENFOAM_VERSION=UNAVAILABLE"
            echo "TIMEOUT_WRAPPER_STATUS=NOT_RECORDED"
          } >> "$GITHUB_ENV"
          echo "evidence clock start: ${start}"
          echo "capture deadline    : $(( start + 6300 ))"

      # ---------------------------------------------------------------------
      # 2. The single status mechanism. Production and every pre-merge status
      #    check call these same three functions.
      # ---------------------------------------------------------------------
      - name: Create the bounded-runner library
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env, so the step
          # derives the library path from RUNNER_TEMP and publishes it.
          LIB="${RUNNER_TEMP}/evidence_lib.sh"
          echo "LIB=${LIB}" >> "$GITHUB_ENV"
          mkdir -p "$(dirname -- "$LIB")"
          cat > "$LIB" <<'EVIDENCE_LIB'
          # budget_seconds <grace> - print raw, grace, guard, available.
          # available = raw_remaining - termination_grace - capture_start_guard.
          # Pass only available to timeout.
          budget_seconds() {
              local grace="$1" now raw guard available
              now="$(date +%s)"
              raw=$(( CAPTURE_DEADLINE - now ))
              guard="$CAPTURE_START_GUARD_SECONDS"
              available=$(( raw - grace - guard ))
              printf '%s %s %s %s\n' "$raw" "$grace" "$guard" "$available"
          }

          # run_bounded <status_file> <timeout_log> <grace> <available> <command> [args...]
          # Sets TIMEOUT_WRAPPER_STATUS. Writes the child status atomically to
          # <status_file>. Terminates every descendant before it returns.
          run_bounded() {
              local status_file="$1" timeout_log="$2" grace="$3" available="$4"
              local pgid_file="${status_file}.pgid"
              shift 4
              rm -f -- "$status_file" "${status_file}.tmp" "$pgid_file"
              set +e
              LC_ALL=C timeout --verbose --signal=TERM --kill-after="${grace}s" "${available}s" \
                  bash -c '
                      status_file="$1"; shift
                      set -m
                      set +e
                      "$@" &
                      child=$!
                      printf "%s\n" "$child" > "${status_file}.pgid"
                      trap "kill -TERM -- -${child} 2>/dev/null" TERM
                      child_status=0
                      while kill -0 "$child" 2>/dev/null; do
                          wait "$child"; child_status=$?
                      done
                      printf "%s\n" "$child_status" > "${status_file}.tmp"
                      mv "${status_file}.tmp" "${status_file}"
                      exit "$child_status"
                  ' _ "$status_file" "$@" 2> "$timeout_log"
              TIMEOUT_WRAPPER_STATUS=$?
              set -e
              local pgid own_pgid
              own_pgid="$(ps -o pgid= -p $$ 2>/dev/null | tr -d ' ' || true)"
              if [[ -f "$pgid_file" ]]; then
                  pgid="$(cat -- "$pgid_file" 2>/dev/null || true)"
                  if [[ "$pgid" =~ ^[0-9]+$ ]] \
                     && [[ -n "$own_pgid" ]] && [[ "$pgid" != "$own_pgid" ]] \
                     && kill -0 -- "-${pgid}" 2>/dev/null; then
                      kill -KILL -- "-${pgid}" 2>/dev/null || true
                  fi
              fi
              return 0
          }

          # classify_result <status_file> <timeout_log>
          # An anchored timeout diagnostic has priority over a status file.
          classify_result() {
              local status_file="$1" timeout_log="$2" recorded
              if [[ -s "$timeout_log" ]] \
                 && LC_ALL=C grep -Eq '^timeout: sending signal (TERM|KILL)' "$timeout_log"; then
                  printf 'BUDGET_EXCEEDED\n'; return 0
              fi
              if [[ -f "$status_file" ]]; then
                  recorded="$(cat -- "$status_file")"
                  if [[ "$recorded" =~ ^[0-9]+$ ]]; then
                      if [[ "$recorded" == "0" ]]; then printf 'SUCCEEDED\n'
                      else printf 'FAILED_EXIT_%s\n' "$recorded"; fi
                      return 0
                  fi
              fi
              printf 'INFRASTRUCTURE_FAILURE\n'
          }
          EVIDENCE_LIB
          bash -n "$LIB"
          echo "bounded-runner library written to ${LIB}"
          sha256sum "$LIB"

      # ---------------------------------------------------------------------
      # 3. The bounded checkout. A checkout stop is never BUDGET_EXCEEDED.
      # ---------------------------------------------------------------------
      - name: Check out the repository
        id: checkout
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/checkout@v5

      - name: Record the checkout phase result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [[ "${{ steps.checkout.outcome }}" == "success" ]]; then
              echo "CHECKOUT_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
              echo "checkout phase: SUCCEEDED"
          else
              {
                echo "CHECKOUT_RESULT=INFRASTRUCTURE_FAILURE"
                echo "CHECKOUT_REASON=checkout outcome ${{ steps.checkout.outcome }}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "checkout phase: INFRASTRUCTURE_FAILURE (${{ steps.checkout.outcome }})" >&2
          fi

      # ---------------------------------------------------------------------
      # 4. The OpenFOAM baseline. The committed .openfoam-version file is the
      #    single active target of this workflow. This step runs after
      #    checkout, validates the exact target, and derives the package name
      #    and the environment file path from the validated value. A missing,
      #    unreadable, multi-line, or different baseline records an
      #    infrastructure failure and stops the run before installation,
      #    preparation, and the Orchestrator.
      # ---------------------------------------------------------------------
      - name: Resolve the OpenFOAM baseline
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          baseline_file="${GITHUB_WORKSPACE}/.openfoam-version"
          expected="v2512"

          # Every rejected baseline records the same four values, so no later
          # phase can start and the reason stays one environment-file line.
          baseline_fail() {
              {
                echo "BASELINE_RESULT=INFRASTRUCTURE_FAILURE"
                echo "BASELINE_REASON=$1"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "baseline phase: INFRASTRUCTURE_FAILURE, $1" >&2
              exit 0
          }

          if [[ ! -f "$baseline_file" || ! -r "$baseline_file" ]]; then
              baseline_fail "the baseline file .openfoam-version is missing or unreadable"
          fi

          # One literal X keeps the final newline byte significant, so this
          # one comparison rejects a missing line ending, a trailing byte, a
          # second line, and a different target.
          raw="$(cat -- "$baseline_file"; printf X)"
          if [[ "$raw" != "${expected}"$'\n'"X" ]]; then
              observed="$(printf '%s' "${raw%X}" | tr '\n' ' ' | cut -c1-120)"
              baseline_fail "the baseline must hold the exact bytes '${expected}' and one line ending; observed '${observed}'"
          fi

          # The release token, the package name, and the environment file path
          # all come from the validated baseline value.
          baseline="${raw%$'\n'X}"
          release="${baseline#v}"
          {
            echo "OPENFOAM_BASELINE=${baseline}"
            echo "OPENFOAM_RELEASE=${release}"
            echo "OPENFOAM_PACKAGE=openfoam${release}-default"
            echo "OPENFOAM_BASHRC=/usr/lib/openfoam/openfoam${release}/etc/bashrc"
            echo "BASELINE_RESULT=SUCCEEDED"
          } >> "$GITHUB_ENV"
          echo "baseline        : ${baseline}"
          echo "release token   : ${release}"
          echo "package         : openfoam${release}-default"
          echo "environment file: /usr/lib/openfoam/openfoam${release}/etc/bashrc"

      # ---------------------------------------------------------------------
      # 5. Installation. The derived package from the official openfoam.com
      #    method. The step starts only after a resolved baseline.
      # ---------------------------------------------------------------------
      - name: Install OpenFOAM v2512
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED' && env.BASELINE_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 30)"
          {
            echo "INSTALL_RAW_REMAINING=${raw}"
            echo "INSTALL_GRACE=${grace}"
            echo "INSTALL_CAPTURE_GUARD=${guard}"
            echo "INSTALL_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "install budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "install phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          run_bounded "${EVIDENCE_DIR}/install_status.txt" \
                      "${EVIDENCE_DIR}/install-timeout.log" \
                      "$grace" "$available" \
              bash -c '
                  set -euo pipefail
                  curl -fsSL https://dl.openfoam.com/add-debian-repo.sh | sudo bash
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends "$1"
              ' _ "$OPENFOAM_PACKAGE" > "${EVIDENCE_DIR}/install.log" 2>&1
          install_result="$(classify_result "${EVIDENCE_DIR}/install_status.txt" \
                                            "${EVIDENCE_DIR}/install-timeout.log")"
          echo "INSTALL_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$install_result" == "SUCCEEDED" ]]; then
              echo "INSTALL_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$install_result" == "BUDGET_EXCEEDED" ]]; then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "INSTALL_REASON=${install_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "install phase: ${install_result}"
          tail -n 40 "${EVIDENCE_DIR}/install.log" || true

      - name: Record the OpenFOAM version
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          # The OpenFOAM etc/bashrc sources a chain of scripts. An absent file
          # ends the step under set -e, and an unset variable in that chain
          # ends the step under set -u. Either stop would leave the phase
          # without a reason, so the environment load is guarded and every
          # failure records INFRASTRUCTURE_FAILURE with the exact reason.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The gate requires the exact validated baseline. A non-empty but
          # different version is a rejected environment, so the run can never
          # produce evidence under an unintended OpenFOAM release.
          version="${WM_PROJECT_VERSION:-}"
          if (( source_status != 0 )) || [[ "$version" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${version}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${version}'" >&2
              exit 0
          fi

          # The environment identity. Every value comes from the installed
          # system. The package version comes from the package database. A
          # value that cannot be obtained becomes the explicit UNAVAILABLE
          # token. No value is invented.
          package_version="$(dpkg-query -W -f='${Version}' "$OPENFOAM_PACKAGE" 2>/dev/null || true)"
          [[ -n "$package_version" ]] || package_version="UNAVAILABLE"
          os_identity="$( ( . /etc/os-release && printf '%s' "${PRETTY_NAME:-}" ) 2>/dev/null || true )"
          [[ -n "$os_identity" ]] || os_identity="UNAVAILABLE"
          architecture="$(uname -m 2>/dev/null || true)"
          [[ -n "$architecture" ]] || architecture="UNAVAILABLE"
          gcc_version="$(gcc -dumpfullversion 2>/dev/null || true)"
          [[ -n "$gcc_version" ]] || gcc_version="UNAVAILABLE"
          wm_options="${WM_OPTIONS:-}"
          [[ -n "$wm_options" ]] || wm_options="UNAVAILABLE"

          {
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE}"
            echo "OPENFOAM_PACKAGE_VERSION=${package_version}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC}"
            echo "WM_PROJECT_VERSION=${version}"
            echo "WM_OPTIONS=${wm_options}"
            echo "OS_IDENTITY=${os_identity}"
            echo "ARCHITECTURE=${architecture}"
            echo "GCC_VERSION=${gcc_version}"
            echo "simpleFoam: $(command -v simpleFoam || echo UNAVAILABLE)"
            echo "snappyHexMesh: $(command -v snappyHexMesh || echo UNAVAILABLE)"
            echo "surfaceTransformPoints: $(command -v surfaceTransformPoints || echo UNAVAILABLE)"
            echo "foamToVTK: $(command -v foamToVTK || echo UNAVAILABLE)"
          } | tee "${EVIDENCE_DIR}/openfoam-version.txt"
          # Only the accepted version reaches GITHUB_ENV. WM_PROJECT_VERSION
          # stays unpublished, because an inherited value would let a later
          # step pass its revalidation without a loaded environment.
          echo "OPENFOAM_VERSION=${version}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 6. Preparation. The repository already holds the base Case template
      #    src/master_batch/simpleFoam_files and the DOE Batch CSV
      #    src/output_batch_1.csv. The contract needs one Case, so the job
      #    builds a one-row DOE Batch CSV from the committed header and one
      #    committed data row. The job adds no file to the repository and
      #    changes no committed dictionary, no committed STL, and no
      #    committed default.
      # ---------------------------------------------------------------------
      - name: Prepare the one-Case DOE Batch CSV
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 15)"
          {
            echo "PREPARE_RAW_REMAINING=${raw}"
            echo "PREPARE_GRACE=${grace}"
            echo "PREPARE_CAPTURE_GUARD=${guard}"
            echo "PREPARE_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "prepare budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "prepare phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          # The preparation body is an inline script, so the job adds no
          # repository file. run_bounded wraps that script.
          run_bounded "${EVIDENCE_DIR}/prepare_status.txt" \
                      "${EVIDENCE_DIR}/prepare-timeout.log" \
                      "$grace" "$available" \
              bash -c '
          set -euo pipefail
          cd "$1"
          case_id="$2"
          source_csv="src/output_batch_1.csv"
          run_csv="src/output_batch_9.csv"
          base="src/master_batch/simpleFoam_files"

          # The committed base Case is read-only input. Confirm it, never
          # rewrite it.
          for required in \
              "${base}/system/blockMeshDict" \
              "${base}/system/snappyHexMeshDict" \
              "${base}/system/controlDict" \
              "${base}/system/decomposeParDict" \
              "${base}/constant/turbulenceProperties" \
              "${base}/constant/triSurface/f18p2_all.stl" \
              "${base}/0/U" "${base}/0/p" "${base}/0/k" \
              "${base}/0/epsilon" "${base}/0/nut" \
              "$source_csv"; do
              [[ -f "$required" ]] || { echo "missing committed input: $required" >&2; exit 1; }
          done

          # One header row and exactly one data row, selected by Case id.
          head -n 1 -- "$source_csv" > "$run_csv"
          selected="$(awk -F, -v want="$case_id" \
              "NR>1 && \$1==want { print; exit }" "$source_csv")"
          [[ -n "$selected" ]] || { echo "Case ${case_id} not found in ${source_csv}" >&2; exit 1; }
          printf "%s\n" "$selected" >> "$run_csv"

          echo "== the one-Case DOE Batch CSV =="
          cat -- "$run_csv"
          echo "== committed base Case inventory =="
          find "$base" -type f | sort | head -n 40
          echo "== base Case file count =="
          find "$base" -type f | wc -l
          ' _ "$GITHUB_WORKSPACE" "7" > "${EVIDENCE_DIR}/prepare.log" 2>&1
          prepare_result="$(classify_result "${EVIDENCE_DIR}/prepare_status.txt" \
                                            "${EVIDENCE_DIR}/prepare-timeout.log")"
          echo "PREPARE_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$prepare_result" == "SUCCEEDED" ]]; then
              echo "PREPARE_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$prepare_result" == "BUDGET_EXCEEDED" ]]; then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "PREPARE_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "PREPARE_REASON=${prepare_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "prepare phase: ${prepare_result}"
          cat "${EVIDENCE_DIR}/prepare.log" || true

      # ---------------------------------------------------------------------
      # 7. The bounded Orchestrator. Four Stages, one Case, -j 1, no tuning.
      # ---------------------------------------------------------------------
      - name: Run the Orchestrator
        if: always() && env.PREPARE_RESULT == 'SUCCEEDED'
        env:
          # The opt-in of specification Section 9.2. The runner has four cores
          # and the committed Case default is NP="8", so the mesh Stage needs
          # the explicit oversubscription policy. The value stays on this one
          # step, so no other step and no other phase inherits it.
          BATCH_STAGE_MPI_OVERSUBSCRIBE: "1"
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"

          # The same guarded environment load as the version step. The
          # Orchestrator never starts without a loaded OpenFOAM environment.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The Orchestrator revalidates the exact baseline after it sources
          # the environment file. A non-empty but different version stops the
          # run before the Orchestrator starts.
          if (( source_status != 0 )) || [[ "${WM_PROJECT_VERSION:-}" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'" >&2
              exit 0
          fi

          csv="${GITHUB_WORKSPACE}/src/output_batch_9.csv"

          read -r raw grace guard available <<< "$(budget_seconds 60)"
          {
            echo "ORCHESTRATOR_RAW_REMAINING=${raw}"
            echo "ORCHESTRATOR_GRACE=${grace}"
            echo "ORCHESTRATOR_CAPTURE_GUARD=${guard}"
            echo "ORCHESTRATOR_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "orchestrator budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "ORCHESTRATOR_STARTED=false" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "ORCHESTRATOR_STARTED=true" >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_START=$(date +%s)" >> "$GITHUB_ENV"
              cd "$GITHUB_WORKSPACE"
              run_bounded "${EVIDENCE_DIR}/orchestrator_status.txt" \
                          "${EVIDENCE_DIR}/orchestrator-timeout.log" \
                          "$grace" "$available" \
                  bash -c 'bash src/run_batch.sh --stage setup,mesh,flow,post-processing -j 1 "$1" \
                               > "$2" 2>&1' _ "$csv" "${EVIDENCE_DIR}/orchestrator.log"
              echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=$(classify_result "${EVIDENCE_DIR}/orchestrator_status.txt" \
                                                     "${EVIDENCE_DIR}/orchestrator-timeout.log")" \
                  >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_END=$(date +%s)" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------------------
      # 8. The capture sequence. This step is the next step after the bounded
      #    execution and records CAPTURE_START before any parsing.
      #
      #    The step writes phase-results.txt first. The optional capture work
      #    then runs under one work limit: 480 seconds from capture start, and
      #    never later than 180 seconds before CAPTURE_DEADLINE. The earlier
      #    limit wins. A capture error, a timeout, or a missing budget gives a
      #    CAPTURE_RESULT and a CAPTURE_REASON, and the step then ends with
      #    status 0, so the summary and the upload steps still run. The step
      #    timeout is only a final guard.
      # ---------------------------------------------------------------------
      - name: Capture the evidence
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          capture_start="$(date +%s)"
          echo "CAPTURE_START=${capture_start}" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          deadline="${CAPTURE_DEADLINE:-0}"
          [[ "$deadline" =~ ^[0-9]+$ ]] || deadline=0

          # A step that does not reach its end keeps this result. The summary
          # step then reports it.
          capture_result_file="${EVIDENCE_DIR}/capture-result.txt"
          {
            echo "CAPTURE_RESULT=NOT_COMPLETED"
            echo "CAPTURE_REASON=the capture step did not reach its end"
          } | tee "$capture_result_file" >> "$GITHUB_ENV"

          # The capture work limit. The earlier limit wins.
          work_cap_seconds=480
          deadline_reserve_seconds=180
          work_end=$(( capture_start + work_cap_seconds ))
          work_limit_source=CAPTURE_WORK_CAP
          if (( deadline - deadline_reserve_seconds < work_end )); then
              work_end=$(( deadline - deadline_reserve_seconds ))
              work_limit_source=CAPTURE_DEADLINE_RESERVE
          fi
          work_budget=$(( work_end - capture_start ))

          echo "CAPTURE_START=${capture_start}" | tee "${EVIDENCE_DIR}/capture-clock.txt"
          {
            echo "EVIDENCE_CLOCK_START=${EVIDENCE_CLOCK_START:-UNAVAILABLE}"
            echo "CAPTURE_DEADLINE=${deadline}"
            echo "CAPTURE_START_GUARD_SECONDS=${CAPTURE_START_GUARD_SECONDS:-UNAVAILABLE}"
            echo "CAPTURE_START_WITHIN_DEADLINE=$([[ "$capture_start" -le "$deadline" ]] \
                 && echo true || echo false)"
            echo "CAPTURE_WORK_CAP_SECONDS=${work_cap_seconds}"
            echo "CAPTURE_DEADLINE_RESERVE_SECONDS=${deadline_reserve_seconds}"
            echo "CAPTURE_WORK_END=${work_end}"
            echo "CAPTURE_WORK_LIMIT_SOURCE=${work_limit_source}"
            echo "CAPTURE_WORK_BUDGET_SECONDS=${work_budget}"
          } >> "${EVIDENCE_DIR}/capture-clock.txt"

          # The phase results come first, before any file-tree scan, copy, VTU
          # parse, or checksum. OVERALL_RESULT is the product result. The
          # capture result is in capture-result.txt and never replaces it.
          {
            echo "CHECKOUT_RESULT=${CHECKOUT_RESULT:-NOT_ATTEMPTED}"
            echo "INSTALL_RESULT=${INSTALL_RESULT:-NOT_ATTEMPTED}"
            echo "PREPARE_RESULT=${PREPARE_RESULT:-NOT_ATTEMPTED}"
            echo "ORCHESTRATOR_STARTED=${ORCHESTRATOR_STARTED:-false}"
            echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}"
            echo "OVERALL_RESULT=${OVERALL_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_VERSION=${OPENFOAM_VERSION:-UNAVAILABLE}"
            echo "BASELINE_RESULT=${BASELINE_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE:-UNAVAILABLE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE:-UNAVAILABLE}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC:-UNAVAILABLE}"
          } > "${EVIDENCE_DIR}/phase-results.txt"
          cat "${EVIDENCE_DIR}/phase-results.txt"

          # The optional capture work. It is a script file, so run_bounded can
          # stop it and every descendant at the work limit.
          CAPTURE_WORK_SCRIPT="${RUNNER_TEMP:-${EVIDENCE_DIR%/*}}/capture_work.sh"
          cat > "$CAPTURE_WORK_SCRIPT" <<'CAPTURE_WORK'
          set -euo pipefail
          notes_file="${EVIDENCE_DIR}/capture-work-notes.txt"

          # capture_note <text> - record one incomplete capture item.
          capture_note() {
              printf '%s\n' "$1" >> "$notes_file"
          }

          # bounded <label> <command> [args...] - run one blocking operation
          # under the time that is left before the capture work limit, less a
          # margin. The operation ends before the outer limit, and timeout
          # stops the process group of the operation. A timeout or any other
          # non-zero status is a capture error, so it gives a note.
          bounded() {
              _bounded 1 "$@"
          }

          # bounded_timeout_note <label> <command> [args...] - bounded, but a
          # non-zero status other than a timeout gives no note, because the
          # caller records a more exact reason for it.
          bounded_timeout_note() {
              _bounded 0 "$@"
          }

          _bounded() {
              local note_failure="$1" label="$2" left status
              shift 2
              left=$(( CAPTURE_WORK_END - 10 - $(date +%s) ))
              (( left > 120 )) && left=120
              if (( left <= 0 )); then
                  capture_note "${label}: no capture work time was left"
                  return 124
              fi
              timeout --kill-after=2s "${left}s" "$@" && status=0 || status=$?
              if (( status == 124 || status == 137 )); then
                  capture_note "${label}: exceeded the capture work limit"
              elif (( status != 0 && note_failure )); then
                  capture_note "${label}: ended with status ${status}"
              fi
              return "$status"
          }

          # Change 7. The bounded VTU point-data manifest.
          #
          # The array names come from the file header only. A foamToVTK VTU file
          # with appended data is a VTK XML file whose binary payload starts at
          # <AppendedData. The parser input ends exactly at the first byte of that
          # marker, so the parser never receives an appended-payload byte and needs
          # no header size limit. A finite ASCII VTU file has no marker, so its
          # complete file is the parser input.
          #
          # The byte count and the SHA-256 describe the complete source file, and the
          # checksum streams that file. A checksum is file identity evidence. It is
          # not scientific validation.

          vtu_expected_fields() {
              case "${1##*/}" in
                  flow_0.vtu) echo "U p wallDistance" ;;
                  flow_latest_*.vtu) echo "U p" ;;
                  trd_*.vtu) echo "${SCALAR_FIELD:-T}" ;;
                  *) echo "UNKNOWN" ;;
              esac
          }

          # ---- VTU header reader: begin ----
          # vtu_read_header <source-file> <work-dir> - copy the header bytes of one
          # VTU file to <work-dir>. Sets VTU_PARSE_INPUT and VTU_MARKER_FOUND.
          #
          # One linear streaming pass that stops at the appended-payload marker.
          # Each dd call issues one read, so it returns the bytes that are available
          # instead of waiting for a full block. Each chunk goes to a file, and only
          # the new chunk and the last 12 bytes before it are searched for the
          # marker, so the work for each chunk is constant. The loop ends as soon as
          # the marker appears, and the text is then cut at the marker, so the parser
          # input holds no appended-payload byte and the extraction never waits for
          # payload that a producer has not released. Without a marker, the loop
          # ends at end of file, and the complete finite file is the parser input.
          #
          # Three earlier forms were wrong. A 65536-byte limit dropped a valid
          # PointData declaration past that byte. Making the awk record separator
          # the tag opening character ended the marker record only at the next such
          # byte, so the parser could wait for, and hold, the complete payload.
          # Appending each chunk to one shell string and searching the complete
          # string again after each chunk made a file without a marker take time
          # that grows with the square of its size.
          #
          # Status 0: the header is ready. Status 1: the file cannot be read.
          # Status 2: the marker position cannot be found.
          vtu_read_header() {
              local source_file="$1" work_dir="$2" read_failed=0 marker_offset
              VTU_MARKER_FOUND=0
              VTU_PARSE_INPUT="${work_dir}/header"
              [[ -e "$source_file" && -r "$source_file" && ! -d "$source_file" ]] || return 1
              : > "${work_dir}/header"
              : > "${work_dir}/tail"
              exec 3< "$source_file" || return 1
              while :; do
                  if ! dd bs=65536 count=1 status=none <&3 > "${work_dir}/chunk" 2>/dev/null; then
                      read_failed=1
                      break
                  fi
                  [[ -s "${work_dir}/chunk" ]] || break
                  cat -- "${work_dir}/chunk" >> "${work_dir}/header"
                  cat -- "${work_dir}/tail" "${work_dir}/chunk" > "${work_dir}/window"
                  if LC_ALL=C grep -aqF '<AppendedData' -- "${work_dir}/window"; then
                      VTU_MARKER_FOUND=1
                      break
                  fi
                  tail -c 12 -- "${work_dir}/window" > "${work_dir}/tail"
              done
              exec 3<&-
              (( read_failed == 0 )) || return 1
              if (( VTU_MARKER_FOUND )); then
                  marker_offset="$(LC_ALL=C grep -abo -m 1 -F '<AppendedData' -- \
                                   "${work_dir}/header" | head -n 1 | cut -d: -f1 || true)"
                  [[ "$marker_offset" =~ ^[0-9]+$ ]] || return 2
                  head -c "$marker_offset" -- "${work_dir}/header" > "${work_dir}/parse"
                  VTU_PARSE_INPUT="${work_dir}/parse"
              fi
              return 0
          }

          # vtu_scan_header <source-file> <tag-file> <limit> - scan the header of one
          # VTU file. After a complete scan (status 0) only, prints one record for
          # each line:
          #   POINT<TAB>name  CELL<TAB>name  UNNAMED<TAB>PointData|CellData
          #   POINTDATA_SEEN<TAB>0|1  CELLDATA_SEEN<TAB>0|1  OUTPUT_LIMIT<TAB>0|1
          # and appends each PointData, CellData, and enclosed DataArray start tag,
          # and each PointData and CellData end tag, to <tag-file> as original bytes:
          #   TAG offset=<zero-based byte offset> bytes=<n> element=<name> context=<name>
          #   <the n original tag bytes>
          # A record that does not fit in <limit> bytes is not written, and
          # OUTPUT_LIMIT is then 1, so no tag is cut. <limit> 0 means no limit, and
          # a negative <limit> writes no record. An empty <tag-file> writes nothing.
          #
          # The scan keeps quoted attribute values intact, so a '>' inside a value
          # does not end a tag. A name counts only from a Name attribute with a
          # single- or double-quoted value in a DataArray start tag that is a
          # direct child of a complete PointData or CellData element. The scan
          # keeps a stack of open elements: each end tag must close the element
          # that is open on top, and a tag without a valid element name is not
          # well formed. Either fault makes the header malformed. Without an
          # appended-data marker, every element must be closed at the end of the
          # file. With a marker, the elements that contain the marker, such as
          # VTKFile, can stay open, but PointData and CellData must be closed.
          # Each start and end tag must have complete XML tag syntax, or the header
          # is malformed. A start tag holds a valid element name, then attributes
          # that each follow white space, each with a valid name, '=', and a
          # single- or double-quoted value, and then an optional space and '>' or
          # '/>'. A value holds no '<', each '&' in it starts a reference, and no
          # attribute name repeats. An end tag holds only the name and optional
          # white space. The attributes are read in order, so Name text inside the
          # quoted value of another attribute is not a Name attribute. References
          # are not expanded. The original bytes of a PointData, CellData, or
          # DataArray tag are kept, also when the tag is rejected.
          # An XML comment, a CDATA section, or a processing instruction is
          # skipped as one unit up to its own end ("-->", "]]>", or "?>"), so a
          # '>' or an apparent tag inside it is not markup. If one of them does
          # not end, the header is incomplete. Any other "<!" declaration, such as
          # a document type declaration, is not read, and the header is then
          # malformed. No element body and no appended-payload byte is kept.
          #
          # Status 0: a complete scan. Status 1: the file cannot be read. Status 2:
          # the header is incomplete or malformed, so the names are not evidence.
          vtu_scan_header() {
              local source_file="$1" tag_file="$2" limit="$3" work_dir status=0
              work_dir="$(mktemp -d "${TMPDIR:-/tmp}/vtu-header.XXXXXX")" || return 1
              vtu_read_header "$source_file" "$work_dir" || status=$?
              if (( status != 0 )); then
                  rm -rf -- "$work_dir"
                  return "$status"
              fi
              LC_ALL=C awk -v vtu_scan=1 -v sq="'" -v tag_file="$tag_file" -v limit="$limit" \
                           -v require_end="$(( 1 - VTU_MARKER_FOUND ))" '
                  BEGIN {
                      off = 0; intag = 0; tag = ""; taglen = 0; tagoff = 0; quote = ""; skip = ""
                      pd = 0; cd = 0; seen_pd = 0; seen_cd = 0; saw_end = 0; bad = 0; depth = 0
                      used = 0; limit_hit = 0
                  }
                  function tag_name(s) {
                      if (match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) return substr(s, 1, RLENGTH)
                      return ""
                  }
                  # tag_syntax_ok(t, kind) - 1 when t is a complete, well-formed start
                  # or end tag. For a start tag, it also fills tag_attr with the
                  # attribute values.
                  function tag_syntax_ok(t, kind,    s, sep, an, q, j, v) {
                      split("", tag_attr)
                      if (kind == "end") return (t ~ /^<\/[A-Za-z_:][-A-Za-z0-9_:.]*[ \t\r\n]*>$/)
                      s = substr(t, 2)
                      if (!match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) return 0
                      s = substr(s, RLENGTH + 1)
                      while (1) {
                          sep = match(s, /^[ \t\r\n]+/)
                          if (sep) s = substr(s, RLENGTH + 1)
                          if (s == ">" || s == "/>") return 1
                          if (!sep || !match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) return 0
                          an = substr(s, 1, RLENGTH); s = substr(s, RLENGTH + 1)
                          if (an in tag_attr) return 0
                          if (!match(s, /^[ \t\r\n]*=[ \t\r\n]*/)) return 0
                          s = substr(s, RLENGTH + 1)
                          q = substr(s, 1, 1)
                          if (q != "\"" && q != sq) return 0
                          s = substr(s, 2); j = index(s, q)
                          if (j == 0) return 0
                          v = substr(s, 1, j - 1); s = substr(s, j + 1)
                          if (index(v, "<") || !references_ok(v)) return 0
                          tag_attr[an] = v
                      }
                  }
                  # references_ok(v) - 1 when each ampersand in v starts a reference.
                  function references_ok(v) {
                      gsub(/&([A-Za-z_:][-A-Za-z0-9_:.]*|#[0-9]+|#x[0-9A-Fa-f]+);/, "", v)
                      return (index(v, "&") == 0)
                  }
                  function record(t, o, element, context,    header, size) {
                      header = "TAG offset=" o " bytes=" length(t) " element=" element \
                               " context=" context "\n"
                      size = length(header) + length(t) + 1
                      if (limit < 0 || (limit > 0 && used + size > limit)) { limit_hit = 1; return }
                      if (tag_file == "") return
                      printf "%s%s\n", header, t > tag_file
                      used += size
                  }
                  function handle(t, o,    second, kind, name, selfclose, parent, evidence) {
                      second = substr(t, 2, 1)
                      if (second == "/") {
                          kind = "end"; name = tag_name(substr(t, 3))
                      } else {
                          kind = "start"; name = tag_name(substr(t, 2))
                      }
                      if (name == "") { bad = 1; return }
                      parent = (depth > 0 ? open_element[depth] : "")
                      evidence = (kind == "start" && name == "DataArray" &&
                                  (parent == "PointData" || parent == "CellData"))
                      if (name == "PointData" || name == "CellData") record(t, o, name, "-")
                      else if (evidence) record(t, o, "DataArray", parent)
                      if (!tag_syntax_ok(t, kind)) { bad = 1; return }
                      selfclose = (kind == "start" && t ~ /\/>$/)
                      if (kind == "end") {
                          if (parent != name) { bad = 1; return }
                          depth--
                      } else if (!selfclose) {
                          open_element[++depth] = name
                      }
                      if (name == "VTKFile" && kind == "end") saw_end = 1
                      if (name == "PointData" || name == "CellData") {
                          if (kind == "start") {
                              if (pd || cd) bad = 1
                              if (name == "PointData") seen_pd = 1; else seen_cd = 1
                              if (!selfclose) { if (name == "PointData") pd = 1; else cd = 1 }
                          } else {
                              pd = 0; cd = 0
                          }
                      } else if (evidence) {
                          if ("Name" in tag_attr) {
                              names = names (parent == "PointData" ? "POINT" : "CELL") "\t" tag_attr["Name"] "\n"
                          } else {
                              names = names "UNNAMED\t" parent "\n"
                          }
                      }
                  }
                  {
                      line = $0 "\n"; n = length(line); i = 1
                      while (i <= n) {
                          if (skip != "") {
                              j = index(substr(line, i), skip)
                              if (j == 0) break
                              i += j - 1 + length(skip); skip = ""
                              continue
                          }
                          if (!intag) {
                              j = index(substr(line, i), "<")
                              if (j == 0) break
                              i += j - 1
                              if (substr(line, i, 4) == "<!--") { skip = "-->"; i += 4; continue }
                              if (substr(line, i, 9) == "<![CDATA[") { skip = "]]>"; i += 9; continue }
                              if (substr(line, i, 2) == "<?") { skip = "?>"; i += 2; continue }
                              if (substr(line, i, 2) == "<!") { bad = 1; exit }
                              intag = 1; tag = ""; taglen = 0; quote = ""
                              tagoff = off + i - 1
                          }
                          while (i <= n) {
                              c = substr(line, i, 1); i++
                              tag = tag c; taglen++
                              if (taglen > 1048576) { bad = 1; exit }
                              if (quote != "") { if (c == quote) quote = "" }
                              else if (c == "\"" || c == sq) quote = c
                              else if (c == ">") { intag = 0; handle(tag, tagoff); break }
                          }
                      }
                      off += n
                  }
                  END {
                      if (intag || skip != "" || pd || cd || bad) exit 2
                      if (require_end && (!saw_end || depth > 0)) exit 2
                      printf "%s", names
                      print "POINTDATA_SEEN\t" seen_pd
                      print "CELLDATA_SEEN\t" seen_cd
                      print "OUTPUT_LIMIT\t" limit_hit
                  }' "$VTU_PARSE_INPUT" 2>/dev/null || status=$?
              rm -rf -- "$work_dir"
              case "$status" in
                  0) return 0 ;;
                  2) return 2 ;;
                  *) return 1 ;;
              esac
          }

          # vtu_header_point_data_names <source-file> - the PointData names of one
          # VTU file, in source order, on one line. Status 0: a complete parse, and
          # an empty line is a valid empty PointData result. Status 1: the file
          # cannot be read. Status 2: the header is incomplete, so no name is
          # reported.
          vtu_header_point_data_names() {
              local records status=0 kind value names=""
              records="$(vtu_scan_header "$1" "" 0)" || status=$?
              (( status == 0 )) || return "$status"
              while IFS=$'\t' read -r kind value; do
                  if [[ "$kind" == POINT ]]; then
                      names="${names:+${names} }${value}"
                  fi
              done <<< "$records"
              printf '%s\n' "$names"
          }
          # ---- VTU header reader: end ----

          # The capture script calls itself for one VTU scan, so the scan runs as
          # one bounded process.
          if [[ "${1:-}" == "--vtu-scan" ]]; then
              vtu_scan_header "$2" "$3" "$4"
              exit $?
          fi

          for name in orchestrator.log orchestrator-timeout.log install.log prepare.log; do
              [[ -f "${EVIDENCE_DIR}/${name}" ]] || echo "UNAVAILABLE" > "${EVIDENCE_DIR}/${name}"
          done
          if [[ -f "${EVIDENCE_DIR}/orchestrator_status.txt" ]]; then
              cp -- "${EVIDENCE_DIR}/orchestrator_status.txt" \
                    "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          else
              echo "ABSENT" > "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          fi

          workspace_root="${GITHUB_WORKSPACE}/src"
          batch_dir="${workspace_root}/batch_9"

          # The corrected selective capture. Each selected file keeps its path
          # relative to the Batch Workspace, so a reviewer can see which Stage and
          # which Case produced it. The selection stays explicit: no VTU file, no
          # checkout copy, and no unfiltered Batch Workspace copy is collected.
          #
          # A failed search or copy is a capture error. The note names the
          # item, and the files already copied stay in the evidence.
          #
          # copy_relative <source-file> <destination-root>
          copy_relative() {
              local source_file="$1" destination_root="$2" relative target
              relative="${source_file#"${batch_dir}/"}"
              target="${destination_root}/${relative}"
              if ! mkdir -p -- "$(dirname -- "$target")" 2>/dev/null; then
                  capture_note "Stage evidence copy ${relative}: the target directory cannot be created"
                  return 0
              fi
              if ! cp -- "$source_file" "$target" 2>/dev/null; then
                  capture_note "Stage evidence copy ${relative}: the copy failed"
              fi
              return 0
          }

          # collect_selected <destination-root> <find-expression>...
          collect_selected() {
              local destination_root="$1"
              shift
              local selected
              while IFS= read -r selected; do
                  [[ -n "$selected" ]] || continue
                  copy_relative "$selected" "$destination_root"
              done < <(bounded "Stage evidence search" \
                           find "$batch_dir" "$@" -type f 2>/dev/null || true)
          }

          # The Stage evidence comes before the tree and the VTU manifest, so a
          # later timeout keeps it.
          mkdir -p "${EVIDENCE_DIR}/summaries" "${EVIDENCE_DIR}/stage-logs"
          if [[ -d "$batch_dir" ]]; then
              # Each Stage summary is a root-relative file, so its relative path is
              # its file name and the destination stays the same as before.
              collect_selected "${EVIDENCE_DIR}/summaries" \
                  -maxdepth 1 -name '*_summary.csv'

              # Fault 1. The five Failure Artifact names begin with a dot, so the
              # earlier FAILED_* pattern matched none of them.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -maxdepth 1 \
                  \( -name '.setup_cases_failed' \
                  -o -name '.run_mesh_cases_failed' \
                  -o -name '.run_flow_cases_failed' \
                  -o -name '.run_transport_cases_failed' \
                  -o -name '.run_post_processing_cases_failed' \)

              # The Case-level OpenFOAM command logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -name 'log.*'

              # Fault 2. Every per-Case Stage log directory, and the post-processing
              # conversion logs under <case>/vtk/logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" \
                  \( -path '*/_setup_logs/*' \
                  -o -path '*/_mesh_logs/*' \
                  -o -path '*/_flow_logs/*' \
                  -o -path '*/_transport_logs/*' \
                  -o -path '*/vtk/logs/*' \) -name '*.log'
          fi

          # Stage results from the summary files, when the summaries exist. The
          # summaries keep their Batch Workspace-relative path, and each Stage
          # summary is a root-relative file, so stage-summary-lines.txt keeps its
          # existing payload.
          stage_from_summary() {
              local file="${EVIDENCE_DIR}/summaries/$1"
              if [[ -f "$file" ]]; then
                  tail -n +2 -- "$file" | head -n 1 || true
              else
                  echo "ABSENT"
              fi
          }
          {
            echo "setup:  $(stage_from_summary setup_cases_summary.csv)"
            echo "mesh:   $(stage_from_summary run_mesh_cases_summary.csv)"
            echo "flow:   $(stage_from_summary run_flow_cases_summary.csv)"
            echo "post:   $(stage_from_summary run_post_processing_cases_summary.csv)"
          } > "${EVIDENCE_DIR}/stage-summary-lines.txt"

          {
            echo "== Batch Workspace tree =="
            if [[ -d "$batch_dir" ]]; then
                bounded "Batch Workspace tree" find "$batch_dir" -maxdepth 4 | sort || true
            else
                echo "ABSENT"
            fi
          } > "${EVIDENCE_DIR}/batch-workspace-tree.txt"

          vtk_dir_count=0
          if [[ -d "$batch_dir" ]]; then
              vtk_dir_count="$(bounded "vtk directory search" \
                               find "$batch_dir" -type d -name vtk 2>/dev/null |
                               wc -l | tr -d ' ' || true)"
          fi

          # Mesh-quality evidence from the checkMesh log text. The verdict is
          # separate from the Stage status: a checkMesh command that returns 0
          # can still report failed mesh checks. No tolerance and no waiver.
          mesh_file="${EVIDENCE_DIR}/mesh-quality.txt"
          mesh_list="${EVIDENCE_DIR%/*}/checkmesh-log-list.txt"
          : > "$mesh_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "checkMesh log search" \
                  find "$batch_dir" -name log.checkMesh -type f 2>/dev/null |
                  sort > "$mesh_list" || true
          fi
          {
            echo "== Mesh quality evidence =="
            echo "MESH_QUALITY_SOURCE=checkMesh log text; the Stage status is separate"
          } > "$mesh_file"
          mesh_logs=0
          mesh_review=0
          mesh_unavailable=0
          while IFS= read -r mesh_log; do
              [[ -n "$mesh_log" ]] || continue
              mesh_logs=$(( mesh_logs + 1 ))
              mesh_rel="${mesh_log#"${batch_dir}/"}"
              if mesh_out="$(bounded "checkMesh parse ${mesh_rel}" awk '
                      /^Failed [0-9]+ mesh checks\./ { failed = $2; saw_failed = 1 }
                      /^Mesh OK\./ { ok = 1 }
                      /Concave cells \(using face planes\) found, number of cells: [0-9]+/ {
                          concave = $NF; saw_concave = 1
                      }
                      END {
                          if (saw_failed) f = failed; else if (ok) f = 0; else f = "UNAVAILABLE"
                          if (saw_concave) c = concave
                          else if (ok) c = 0
                          else if (saw_failed) c = "NOT_REPORTED"
                          else c = "UNAVAILABLE"
                          print f " " c
                      }' "$mesh_log")"; then
                  mesh_failed="${mesh_out%% *}"
                  mesh_concave="${mesh_out##* }"
              else
                  mesh_failed=UNAVAILABLE
                  mesh_concave=UNAVAILABLE
              fi
              if [[ "$mesh_failed" == UNAVAILABLE ]]; then
                  mesh_verdict=UNAVAILABLE
                  mesh_reason="the checkMesh log has no 'Mesh OK.' line and no 'Failed N mesh checks.' line"
                  mesh_unavailable=$(( mesh_unavailable + 1 ))
              elif (( mesh_failed > 0 )); then
                  mesh_verdict=MESH_QUALITY_REVIEW_REQUIRED
                  mesh_reason="checkMesh reports ${mesh_failed} failed mesh checks; Stage success is not mesh acceptance"
                  mesh_review=$(( mesh_review + 1 ))
              else
                  mesh_verdict=MESH_QUALITY_CHECKS_PASSED
                  mesh_reason="checkMesh reports Mesh OK."
              fi
              {
                echo
                echo "MESH_LOG=${mesh_rel}"
                echo "MESH_FAILED_CHECKS=${mesh_failed}"
                echo "MESH_CONCAVE_CELLS=${mesh_concave}"
                echo "MESH_LOG_VERDICT=${mesh_verdict}"
                echo "MESH_LOG_REASON=${mesh_reason}"
              } >> "$mesh_file"
          done < "$mesh_list"
          {
            echo
            echo "MESH_QUALITY_LOG_COUNT=${mesh_logs}"
            if (( mesh_logs == 0 )); then
                echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                echo "MESH_QUALITY_REASON=no checkMesh log exists in the Batch Workspace"
            elif (( mesh_review > 0 )); then
                echo "MESH_QUALITY_VERDICT=MESH_QUALITY_REVIEW_REQUIRED"
                echo "MESH_QUALITY_REASON=${mesh_review} checkMesh logs report failed mesh checks"
            elif (( mesh_unavailable > 0 )); then
                echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                echo "MESH_QUALITY_REASON=${mesh_unavailable} checkMesh logs have no summary line"
            else
                echo "MESH_QUALITY_VERDICT=MESH_QUALITY_CHECKS_PASSED"
                echo "MESH_QUALITY_REASON=every checkMesh log reports Mesh OK."
            fi
          } >> "$mesh_file"

          # Flow convergence evidence. CONVERGED needs the explicit solver marker
          # under the actual residualControl values of the Case. Reaching the end
          # time or low final residuals is not convergence. The M3 reference is
          # the committed 1e-4 for U, p, and each configured turbulence field.
          #
          # The verdict fails closed. Actual controls that do not match the M3
          # reference give UNAVAILABLE, because the marker then describes another
          # criterion. The marker describes the final solver state only when no
          # Time line comes after it and it names the final time; a marker before
          # the final Time block gives NOT_CONVERGED. A marker with a missing
          # final record gives UNAVAILABLE. The final records are the Time line,
          # the first initial residual of Ux, Uy, Uz, and p, of each turbulence
          # field that a residualControl key other than U and p matches (at least
          # one for each key), and the continuity line, all from the final Time
          # block.
          conv_file="${EVIDENCE_DIR}/convergence.txt"
          conv_list="${EVIDENCE_DIR%/*}/solver-log-list.txt"
          : > "$conv_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "solver log search" \
                  find "$batch_dir" -name log.simpleFoam -type f 2>/dev/null |
                  sort > "$conv_list" || true
          fi
          {
            echo "== Flow convergence evidence =="
            echo "M3_REFERENCE_CRITERION=the solver convergence marker under residualControl U 1e-4, p 1e-4, and 1e-4 for each configured turbulence field"
          } > "$conv_file"
          conv_logs=0
          conv_not=0
          conv_unavailable=0
          while IFS= read -r conv_log; do
              [[ -n "$conv_log" ]] || continue
              conv_logs=$(( conv_logs + 1 ))
              conv_rel="${conv_log#"${batch_dir}/"}"
              conv_controls="$(dirname -- "$conv_log")/system/fvSolution"
              conv_controls_rel="${conv_controls#"${batch_dir}/"}"
              conv_control="UNAVAILABLE"
              conv_match="UNAVAILABLE"
              conv_entries=""
              if [[ -f "$conv_controls" ]]; then
                  copy_relative "$conv_controls" "${EVIDENCE_DIR}/case-config"
                  if conv_entries="$(bounded "residualControl parse ${conv_controls_rel}" awk '
                          { line = $0; sub(/\/\/.*/, "", line) }
                          !inrc && !done && line ~ /(^|[ \t])residualControl([ \t]|$)/ {
                              inrc = 1; depth = 0; opened = 0
                          }
                          inrc {
                              n_open = gsub(/\{/, "{", line); n_close = gsub(/\}/, "}", line)
                              if (opened && depth == 1 &&
                                  match(line, /^[ \t]*("[^"]*"|[A-Za-z_][A-Za-z0-9_.]*)[ \t]+[^ \t;]+[ \t]*;/)) {
                                  entry = line
                                  sub(/^[ \t]+/, "", entry); sub(/[ \t]*;.*$/, "", entry)
                                  gsub(/[ \t]+/, " ", entry)
                                  print entry
                              }
                              depth += n_open - n_close
                              if (n_open) opened = 1
                              if (opened && depth <= 0) { inrc = 0; done = 1 }
                          }
                          END { if (!done) exit 3 }' "$conv_controls")" && [[ -n "$conv_entries" ]]; then
                      conv_control="$(printf '%s\n' "$conv_entries" | paste -sd ';' - | sed -e 's/;/; /g')"
                      conv_match="$(printf '%s\n' "$conv_entries" | awk '
                          { key = $1; value = $2 + 0; n++
                            if (value != 0.0001) bad = 1
                            if (key == "U") u = 1; else if (key == "p") p = 1; else other = 1 }
                          END { print ((n && u && p && other && !bad) ? "true" : "false") }')"
                  fi
              fi
              conv_time=UNAVAILABLE
              conv_marker=UNAVAILABLE
              conv_position=UNAVAILABLE
              conv_marker_time=UNAVAILABLE
              conv_end=UNAVAILABLE
              conv_continuity=UNAVAILABLE
              conv_missing=UNAVAILABLE
              conv_residuals=""
              conv_log_ok=0
              if conv_out="$(bounded "solver log parse ${conv_rel}" \
                      env CONV_CONTROL_ENTRIES="$conv_entries" awk '
                      BEGIN {
                          nk = split(ENVIRON["CONV_CONTROL_ENTRIES"], entry, "\n")
                          for (i = 1; i <= nk; i++) {
                              key = entry[i]; sub(/[ \t].*$/, "", key)
                              if (key == "" || key == "U" || key == "p") continue
                              nt++; tkey[nt] = key; tre[nt] = ""
                              if (key ~ /^".*"$/) tre[nt] = "^(" substr(key, 2, length(key) - 2) ")$"
                          }
                      }
                      # turbulence_key(f, j) - 1 when residualControl key j names field f.
                      function turbulence_key(f, j) {
                          if (tre[j] != "") return (f ~ tre[j])
                          return (f == tkey[j])
                      }
                      /^Time = / {
                          time = $3; split("", seen); order = ""; count = 0; cont = ""; after = 0
                      }
                      /Solving for [A-Za-z0-9_.]+, Initial residual = / {
                          s = $0; sub(/.*Solving for /, "", s)
                          field = s; sub(/,.*/, "", field)
                          value = s; sub(/.*Initial residual = /, "", value); sub(/,.*/, "", value)
                          if (!(field in seen)) {
                              seen[field] = value; order = order (count++ ? " " : "") field
                          }
                          if (!(field in solved)) { solved[field] = 1; solved_order = solved_order " " field }
                      }
                      /time step continuity errors/ { cont = $0; sub(/^[ \t]+/, "", cont) }
                      /SIMPLE solution converged/ { marker = $0; sub(/^[ \t]+/, "", marker); after = 1 }
                      /^End[ \t]*$/ { end_seen = 1 }
                      END {
                          position = "ABSENT"
                          if (marker != "") position = (after ? "AFTER_FINAL_TIME" : "BEFORE_FINAL_TIME")
                          marker_time = marker
                          if (!(sub(/^SIMPLE solution converged in /, "", marker_time) &&
                                sub(/ iterations[ \t]*$/, "", marker_time) &&
                                marker_time ~ /^[^ \t]+$/)) marker_time = "UNAVAILABLE"
                          missing = ""
                          nb = split("Ux Uy Uz p", base, " ")
                          for (i = 1; i <= nb; i++) if (!(base[i] in seen)) missing = missing " " base[i]
                          ns = split(solved_order, sf, " ")
                          for (i = 1; i <= ns; i++) {
                              for (j = 1; j <= nt; j++) {
                                  if (turbulence_key(sf[i], j) && !(sf[i] in seen)) {
                                      missing = missing " " sf[i]; break
                                  }
                              }
                          }
                          for (j = 1; j <= nt; j++) {
                              hit = 0
                              for (fld in seen) if (turbulence_key(fld, j)) hit = 1
                              if (!hit) missing = missing " " tkey[j]
                          }
                          if (cont == "") missing = missing " continuity"
                          sub(/^ /, "", missing)
                          print "TIME\t" (time == "" ? "UNAVAILABLE" : time)
                          print "MARKER\t" (marker == "" ? "ABSENT" : marker)
                          print "POSITION\t" position
                          print "MARKER_TIME\t" marker_time
                          print "END\t" (end_seen ? "true" : "false")
                          print "CONTINUITY\t" (cont == "" ? "UNAVAILABLE" : cont)
                          print "MISSING\t" (missing == "" ? "NONE" : missing)
                          n = split(order, f, " ")
                          for (i = 1; i <= n; i++) print "RES\t" f[i] "\t" seen[f[i]]
                      }' "$conv_log")"; then
                  conv_log_ok=1
                  while IFS=$'\t' read -r conv_kind conv_a conv_b; do
                      case "$conv_kind" in
                          TIME) conv_time="$conv_a" ;;
                          MARKER) conv_marker="$conv_a" ;;
                          POSITION) conv_position="$conv_a" ;;
                          MARKER_TIME) conv_marker_time="$conv_a" ;;
                          END) conv_end="$conv_a" ;;
                          CONTINUITY) conv_continuity="$conv_a" ;;
                          MISSING) conv_missing="$conv_a" ;;
                          RES) conv_residuals="${conv_residuals}FINAL_INITIAL_RESIDUAL_${conv_a}=${conv_b}"$'\n' ;;
                      esac
                  done <<< "$conv_out"
              fi
              if (( conv_log_ok == 0 )); then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the solver log cannot be parsed"
              elif [[ "$conv_control" == UNAVAILABLE ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the residualControl configuration is not available at ${conv_controls_rel}"
              elif [[ "$conv_match" != true ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the actual residualControl values do not match the M3 reference, so the solver log is not evidence under that reference"
              elif [[ "$conv_time" == UNAVAILABLE ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the solver log has no Time line"
              elif [[ "$conv_position" == AFTER_FINAL_TIME ]]; then
                  if [[ "$conv_missing" != NONE ]]; then
                      conv_verdict=UNAVAILABLE
                      conv_reason="the final Time = ${conv_time} block has no record for: ${conv_missing}"
                  elif [[ "$conv_marker_time" != "$conv_time" ]]; then
                      conv_verdict=UNAVAILABLE
                      conv_reason="the solver marker '${conv_marker}' does not name the final Time = ${conv_time}"
                  else
                      conv_verdict=CONVERGED
                      conv_reason="the solver reports '${conv_marker}' after the final Time = ${conv_time} block"
                  fi
              elif [[ "$conv_position" == BEFORE_FINAL_TIME ]]; then
                  conv_verdict=NOT_CONVERGED
                  conv_reason="the solver marker '${conv_marker}' comes before the final Time = ${conv_time} block, so it does not describe the final solver state"
              else
                  conv_verdict=NOT_CONVERGED
                  conv_reason="the solver log reaches Time = ${conv_time} with no 'SIMPLE solution converged' marker"
              fi
              case "$conv_verdict" in
                  UNAVAILABLE) conv_unavailable=$(( conv_unavailable + 1 )) ;;
                  NOT_CONVERGED) conv_not=$(( conv_not + 1 )) ;;
              esac
              {
                echo
                echo "CONVERGENCE_LOG=${conv_rel}"
                echo "CONVERGENCE_CONTROLS_SOURCE=${conv_controls_rel}"
                echo "RESIDUAL_CONTROL=${conv_control}"
                echo "RESIDUAL_CONTROL_REFERENCE_MATCH=${conv_match}"
                echo "SOLVER_CONVERGENCE_MARKER=${conv_marker}"
                echo "SOLVER_CONVERGENCE_MARKER_POSITION=${conv_position}"
                echo "FINAL_TIME=${conv_time}"
                echo "SOLVER_END_REACHED=${conv_end}"
                printf '%s' "$conv_residuals"
                echo "FINAL_CONTINUITY=${conv_continuity}"
                echo "CONVERGENCE_REQUIRED_RECORDS_MISSING=${conv_missing}"
                echo "CONVERGENCE_LOG_VERDICT=${conv_verdict}"
                echo "CONVERGENCE_LOG_REASON=${conv_reason}"
              } >> "$conv_file"
          done < "$conv_list"
          {
            echo
            echo "CONVERGENCE_LOG_COUNT=${conv_logs}"
            if (( conv_logs == 0 )); then
                echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                echo "CONVERGENCE_REASON=no simpleFoam log exists in the Batch Workspace"
            elif (( conv_unavailable > 0 )); then
                echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                echo "CONVERGENCE_REASON=${conv_unavailable} solver logs have no complete convergence evidence"
            elif (( conv_not > 0 )); then
                echo "CONVERGENCE_VERDICT=NOT_CONVERGED"
                echo "CONVERGENCE_REASON=${conv_not} solver logs have no solver convergence marker"
            else
                echo "CONVERGENCE_VERDICT=CONVERGED"
                echo "CONVERGENCE_REASON=every solver log reports convergence"
            fi
          } >> "$conv_file"

          # The VTU manifest. Each manifest line is written when it is known, so a
          # later timeout keeps the lines of the files that came before it.
          #
          # For each selected VTU file, the capture compares the required names
          # with the observed PointData names by set inclusion, and keeps the
          # original PointData, CellData, and DataArray tags in vtu-tags.txt with
          # their byte offsets and the source checksum. A tag section holds at most
          # 16384 bytes, and vtu-tags.txt holds at most 65536 bytes. A limit never
          # cuts a tag; it gives OUTPUT_LIMIT.
          vtu_manifest="${EVIDENCE_DIR}/vtu-point-data.txt"
          vtu_tags="${EVIDENCE_DIR}/vtu-tags.txt"
          vtu_tag_file_limit=16384
          vtu_tag_total_limit=65536
          vtu_tag_used=0
          : > "$vtu_tags"
          {
            echo "== VTU point-data manifest =="
            echo "EXPECTED_FIELD_SOURCE=run_post_processing_cases.sh FLOW_ZERO_FIELDS, FLOW_RESULT_FIELDS, TRD_FIELDS"
            echo "SCALAR_FIELD=${SCALAR_FIELD:-T}"
            echo "VTK_DIRECTORY_COUNT=${vtk_dir_count}"
            echo "VTU_TAG_EVIDENCE_FILE=vtu-tags.txt"
            echo "VTU_TAG_EVIDENCE_LIMITS=${vtu_tag_file_limit} bytes for each VTU file; ${vtu_tag_total_limit} bytes in total"
          } > "$vtu_manifest"
          vtu_count=0
          vtu_unavailable=0
          vtu_not_matched=0
          vtu_list="${EVIDENCE_DIR%/*}/vtu-file-list.txt"
          vtu_part="${EVIDENCE_DIR%/*}/vtu-tags.part"
          : > "$vtu_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "VTU file search" \
                  find "$batch_dir" -path '*/vtk/*' -name '*.vtu' -type f 2>/dev/null |
                  sort > "$vtu_list" || true
          fi
          while IFS= read -r vtu_file; do
              [[ -n "$vtu_file" ]] || continue
              vtu_count=$(( vtu_count + 1 ))
              vtu_path="${vtu_file#"${batch_dir}/"}"
              vtu_required="$(vtu_expected_fields "$vtu_file")"
              {
                echo
                echo "VTU_PATH=${vtu_path}"
              } >> "$vtu_manifest"

              # A selected file that does not exist is source content, not a
              # capture error.
              if [[ ! -e "$vtu_file" ]]; then
                  {
                    echo "VTU_BYTES=UNAVAILABLE"
                    echo "VTU_SHA256=UNAVAILABLE"
                    echo "VTU_EXPECTED_FIELDS=${vtu_required}"
                    echo "VTU_OBSERVED_FIELDS=UNAVAILABLE"
                    echo "VTU_OBSERVED_FIELDS_REASON=the selected VTU file does not exist"
                    echo "VTU_REQUIRED_FIELDS_RESULT=MISSING_FILE"
                    echo "VTU_TAG_EVIDENCE=UNAVAILABLE"
                    echo "VTU_TAG_EVIDENCE_REASON=MISSING_FILE"
                  } >> "$vtu_manifest"
                  vtu_not_matched=$(( vtu_not_matched + 1 ))
                  continue
              fi

              if observed="$(bounded "VTU byte count ${vtu_path}" wc -c -- "$vtu_file")"; then
                  echo "VTU_BYTES=${observed%% *}" >> "$vtu_manifest"
              else
                  echo "VTU_BYTES=UNAVAILABLE" >> "$vtu_manifest"
                  vtu_unavailable=$(( vtu_unavailable + 1 ))
              fi
              vtu_sha=UNAVAILABLE
              if observed="$(bounded "VTU checksum ${vtu_path}" sha256sum -- "$vtu_file")"; then
                  vtu_sha="${observed%% *}"
                  echo "VTU_SHA256=${vtu_sha}" >> "$vtu_manifest"
              else
                  {
                    echo "VTU_SHA256=UNAVAILABLE"
                    echo "VTU_SHA256_REASON=the checksum did not complete; see capture-work-notes.txt"
                  } >> "$vtu_manifest"
                  vtu_unavailable=$(( vtu_unavailable + 1 ))
              fi
              echo "VTU_EXPECTED_FIELDS=${vtu_required}" >> "$vtu_manifest"

              # The tag section budget: the smaller of the per-file limit and the
              # rest of the total limit, less the section header and the longest
              # section end line.
              vtu_section_head="== VTU_TAGS path=${vtu_path} sha256=${vtu_sha}"
              vtu_section_end_max="== VTU_TAGS_END path=${vtu_path} tag_evidence=PARSER_FAILURE"
              vtu_cap=$(( vtu_tag_total_limit - vtu_tag_used ))
              (( vtu_cap > vtu_tag_file_limit )) && vtu_cap=$vtu_tag_file_limit
              vtu_frame=$(( ${#vtu_section_head} + ${#vtu_section_end_max} + 2 ))
              vtu_write_section=1
              vtu_scan_limit=$(( vtu_cap - vtu_frame ))
              if (( vtu_scan_limit <= 0 )); then
                  vtu_scan_limit=-1
                  (( vtu_cap >= vtu_frame )) || vtu_write_section=0
              fi
              : > "$vtu_part"

              scan_status=0
              scan_out="$(bounded_timeout_note "VTU PointData parse ${vtu_path}" \
                          bash "$0" --vtu-scan "$vtu_file" "$vtu_part" "$vtu_scan_limit")" \
                  || scan_status=$?

              vtu_point="" vtu_cell="" vtu_pd_seen=0 vtu_limit_hit=0
              if (( scan_status == 0 || scan_status == 2 )); then
                  while IFS=$'\t' read -r scan_kind scan_value; do
                      case "$scan_kind" in
                          POINT) vtu_point="${vtu_point:+${vtu_point} }${scan_value}" ;;
                          CELL) vtu_cell="${vtu_cell:+${vtu_cell} }${scan_value}" ;;
                          POINTDATA_SEEN) vtu_pd_seen="$scan_value" ;;
                          OUTPUT_LIMIT) vtu_limit_hit="$scan_value" ;;
                      esac
                  done <<< "$scan_out"
              fi

              vtu_missing=""
              case "$scan_status" in
                  0)
                      for vtu_name in $vtu_required; do
                          case " ${vtu_point} " in
                              *" ${vtu_name} "*) ;;
                              *) vtu_missing="${vtu_missing:+${vtu_missing} }${vtu_name}" ;;
                          esac
                      done
                      if (( vtu_limit_hit )); then
                          vtu_result=OUTPUT_LIMIT
                          vtu_tag_state=OUTPUT_LIMIT
                      else
                          vtu_tag_state=COMPLETE
                          if [[ "$vtu_required" == UNKNOWN ]]; then
                              vtu_result=REQUIRED_FIELDS_UNKNOWN
                          elif (( vtu_pd_seen == 0 )); then
                              vtu_result=SOURCE_POINTDATA_ABSENT
                          elif [[ -n "$vtu_missing" ]]; then
                              vtu_result=MISSING_REQUIRED_FIELDS
                          else
                              vtu_result=MATCH
                          fi
                      fi
                      {
                        echo "VTU_OBSERVED_FIELDS=${vtu_point}"
                        echo "VTU_OBSERVED_CELL_FIELDS=${vtu_cell}"
                        echo "VTU_MISSING_REQUIRED_FIELDS=${vtu_missing}"
                      } >> "$vtu_manifest"
                      ;;
                  *)
                      case "$scan_status" in
                          1)
                              if [[ ! -e "$vtu_file" ]]; then
                                  vtu_result=MISSING_FILE
                                  reason="the selected VTU file does not exist"
                              else
                                  vtu_result=PARSER_FAILURE
                                  reason="the VTU file cannot be read"
                              fi
                              ;;
                          2) vtu_result=PARSER_FAILURE; reason="the VTU header is incomplete or malformed" ;;
                          124|137)
                              vtu_result=TIMEOUT
                              reason="the PointData parse did not complete within the capture work limit"
                              ;;
                          *)
                              vtu_result=PARSER_FAILURE
                              reason="the PointData parse ended with status ${scan_status}"
                              ;;
                      esac
                      vtu_tag_state="$vtu_result"
                      {
                        echo "VTU_OBSERVED_FIELDS=UNAVAILABLE"
                        echo "VTU_OBSERVED_FIELDS_REASON=${reason}"
                      } >> "$vtu_manifest"
                      # A parse failure is a capture error. A timeout already has
                      # a note from bounded_timeout_note. A missing file is source
                      # content.
                      case "$vtu_result" in
                          PARSER_FAILURE)
                              capture_note "VTU PointData parse ${vtu_path}: ${reason}"
                              vtu_unavailable=$(( vtu_unavailable + 1 ))
                              ;;
                          TIMEOUT)
                              vtu_unavailable=$(( vtu_unavailable + 1 ))
                              ;;
                      esac
                      # A stopped scan can leave a partial record, so its records
                      # are not kept.
                      if [[ "$vtu_result" != PARSER_FAILURE ]]; then
                          : > "$vtu_part"
                      fi
                      ;;
              esac

              if (( vtu_write_section )); then
                  {
                    printf '%s\n' "$vtu_section_head"
                    cat -- "$vtu_part"
                    printf '== VTU_TAGS_END path=%s tag_evidence=%s\n' "$vtu_path" "$vtu_tag_state"
                  } >> "$vtu_tags"
                  vtu_tag_used="$(wc -c < "$vtu_tags" | tr -d ' ')"
              fi
              {
                echo "VTU_REQUIRED_FIELDS_RESULT=${vtu_result}"
                if [[ "$vtu_tag_state" == COMPLETE ]]; then
                    echo "VTU_TAG_EVIDENCE=COMPLETE"
                else
                    echo "VTU_TAG_EVIDENCE=UNAVAILABLE"
                    echo "VTU_TAG_EVIDENCE_REASON=${vtu_tag_state}"
                fi
              } >> "$vtu_manifest"
              [[ "$vtu_result" == MATCH ]] || vtu_not_matched=$(( vtu_not_matched + 1 ))
          done < "$vtu_list"

          {
            echo
            echo "VTU_FILE_COUNT=${vtu_count}"
            if (( vtu_count == 0 )); then
                echo "VTU_EVIDENCE=UNAVAILABLE"
                if [[ ! -d "$batch_dir" ]]; then
                    echo "VTU_REASON=The Batch Workspace does not exist, so the post-processing Stage produced no VTU file."
                elif (( vtk_dir_count == 0 )); then
                    echo "VTU_REASON=No Case holds a vtk directory, so the post-processing Stage wrote no VTU file."
                else
                    echo "VTU_REASON=A vtk directory exists and holds no .vtu file."
                fi
                echo "VTU_REQUIRED_FIELDS_VERDICT=UNAVAILABLE"
            elif (( vtu_unavailable > 0 )); then
                echo "VTU_EVIDENCE=PARTIAL"
                echo "VTU_REASON=${vtu_unavailable} VTU field values are UNAVAILABLE."
                echo "VTU_REQUIRED_FIELDS_VERDICT=INCOMPLETE"
            elif (( vtu_not_matched > 0 )); then
                echo "VTU_EVIDENCE=INCOMPLETE"
                echo "VTU_REASON=${vtu_not_matched} of ${vtu_count} selected VTU files do not have complete required PointData evidence."
                echo "VTU_REQUIRED_FIELDS_VERDICT=INCOMPLETE"
            else
                echo "VTU_EVIDENCE=PRESENT"
                echo "VTU_REQUIRED_FIELDS_VERDICT=COMPLETE"
            fi
          } >> "$vtu_manifest"

          # ---- M3 mean speed: begin ----
          # The M3 mean-speed collection (Issue #80, admission 6064804618 of approved
          # proposal 6064220318). After a successful product run, the collector selects
          # the latest reconstructed time of the Case 7 flow result, copies the exact
          # inputs into one unique task directory under RUNNER_TEMP, and runs the
          # fixture-proven command on that copy. The value is the cell-volume-weighted
          # mean speed sum(V_i * |U_i|) / sum(V_i) in m/s, from volAverage(m3MagU).
          #
          # Only two OpenFOAM vectors run, each once: foamListTimes for the selection and
          # simpleFoam -postProcess for the calculation. After the clock starts, each
          # external command is one bounded operation with an absolute deadline: SIGTERM
          # 6 seconds before it, SIGKILL to the process group 1 second before it, and an
          # empty group at it, or the work fails. The only other external command is the
          # 0.1-second pause of the stop loop, which checks the deadline first. Each
          # operation also has a kernel file-size limit (RLIMIT_FSIZE) and no core dump.
          # The total work, cleanup included, ends by the earlier of 180 seconds after
          # its start and 10 seconds before the capture work limit. The selection has 10
          # seconds, the calculation 60, the inputs, copy, checks, and evidence 90
          # together, and the cleanup 20. The cleanup time stays free before each other
          # operation.
          #
          # MEAN_SPEED_VERDICT=AVAILABLE needs valid output, unchanged inputs, retained
          # evidence, and a completed cleanup. Every other end gives UNAVAILABLE, no
          # value, and one reason code. The value is not convergence, mesh, PointData, or
          # M3 acceptance, and no scientific range applies.
          #
          # Corrected contract 6084196797: the task directory is measured at five
          # checkpoints, and each file of the copy and the calculation is limited to the
          # measured task bytes left (Section 3). The cleanup reads /proc as root only
          # through one exact sudo -n vector of a fixed read-only source, with its own
          # root monitor, inside the cleanup reserve (Section 4). The removal and all
          # evidence stay unprivileged.

          METRIC_TOTAL_MS=180000
          METRIC_SELECT_MS=10000
          METRIC_CALC_MS=60000
          METRIC_WORK_MS=90000
          METRIC_CLEANUP_MS=20000
          METRIC_KILL_GRACE_MS=5000
          METRIC_STOP_RESERVE_MS=1000
          METRIC_MAX_FILES=256
          METRIC_MAX_INPUT_BYTES=2147483648
          METRIC_MAX_TASK_BYTES=4294967296
          METRIC_LOG_LIMIT=1048576
          METRIC_LOGS_LIMIT=8388608
          METRIC_EVIDENCE_LIMIT=10485760
          # The file-size limit of each operation except the copy and the calculation:
          # one byte above the log limit, so a larger log is stopped and then excluded.
          METRIC_OP_FILE_LIMIT=1048577
          # The post-processing time record: at most 64 bytes.
          METRIC_RECORD_LIMIT=64
          # The cleanup has one absolute end. Its first part, at most 12000 ms, is for
          # the process-check launch, scan, stop, and stop verification; the rest, at
          # least 8000 ms, is for the unprivileged path recheck and the removal.
          METRIC_CHECK_MS=12000
          METRIC_REMOVE_MS=8000
          # The installed executables of the process check: the outer vector, then the
          # fixed source. Each must resolve to a regular root-owned file that is not
          # group- or world-writable, in a directory of the same kind.
          METRIC_CHECK_TOOLS=(/usr/bin/sudo /usr/bin/env /usr/bin/bash /usr/bin/prlimit /usr/bin/timeout /usr/bin/getconf /usr/bin/find /usr/bin/grep /usr/bin/sleep)
          # The OS record of the hosted-runner gate.
          METRIC_OS_RELEASE=/etc/os-release
          METRIC_DICTIONARY_SHA256=ca8014349e58428377f5fa6d0b890e5850c2b13af42527a05e8ddb5146d137ef
          METRIC_NUMBER_RE='^[-+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?$'
          METRIC_TIME_RE='^[0-9]+([.][0-9]+)?$'
          METRIC_NAME_RE='^[A-Za-z0-9][A-Za-z0-9_.()-]*$'

          # The approved 636-byte dictionary: the FoamFile header and the ordered
          # m3MagU and m3MeanSpeed functions of the merged metric-validation workflow.
          METRIC_DICTIONARY='FoamFile
          {
              version     2.0;
              format      ascii;
              class       dictionary;
              object      metric-functions;
          }

          functions
          {
              m3MagU
              {
                  type    mag;
                  libs    (fieldFunctionObjects);
                  field   U;
                  result  m3MagU;
              }

              m3MeanSpeed
              {
                  type            volFieldValue;
                  libs            (fieldFunctionObjects);
                  fields           (m3MagU);
                  operation        volAverage;
                  regionType       all;
                  region           region0;
                  writeToFile      true;
                  writeFields      false;
                  writePrecision   17;
                  log              true;
              }
          }
          '

          # The environment load for one OpenFOAM vector: the derived bashrc, then the
          # exact vector.
          METRIC_ENV_SHIM='set +eu; source "$1" > /dev/null 2>&1 || exit 90; shift; exec "$@"'

          # The runtime identity: package versions, machine, compiler, the loaded
          # environment, and the two command paths.
          METRIC_IDENTITY_SCRIPT='
          value() { if [[ -n "$1" ]]; then printf "%s" "$1"; else printf UNAVAILABLE; fi; }
          printf "PACKAGE=%s\n" "$1"
          printf "PACKAGE_VERSION=%s\n" "$(value "$(dpkg-query -W -f="\${Version}" "$1" 2>/dev/null)")"
          printf "CORE_PACKAGE_VERSION=%s\n" "$(value "$(dpkg-query -W -f="\${Version}" "${1%-default}" 2>/dev/null)")"
          printf "ARCHITECTURE=%s\n" "$(value "$(uname -m 2>/dev/null)")"
          printf "OS_IDENTITY=%s\n" "$(value "$( ( . /etc/os-release && printf "%s" "${PRETTY_NAME:-}" ) 2>/dev/null)")"
          printf "GCC_VERSION=%s\n" "$(value "$(gcc -dumpfullversion 2>/dev/null)")"
          set +eu
          source "$2" > /dev/null 2>&1
          printf "SOURCE_STATUS=%s\n" "$?"
          printf "WM_PROJECT_VERSION=%s\n" "$(value "${WM_PROJECT_VERSION:-}")"
          printf "WM_OPTIONS=%s\n" "$(value "${WM_OPTIONS:-}")"
          printf "WM_COMPILER=%s\n" "$(value "${WM_COMPILER:-}")"
          printf "PATH_foamListTimes=%s\n" "$(value "$(command -v foamListTimes)")"
          printf "PATH_simpleFoam=%s\n" "$(value "$(command -v simpleFoam)")"
          '

          # One manifest row for each file: the path, the byte count, and the SHA-256.
          METRIC_MANIFEST_SCRIPT='
          cd -- "$1" || exit 1
          shift
          printf "path\tbytes\tsha256\n"
          for file in "$@"; do
              [[ -f "$file" && ! -L "$file" ]] || exit 3
              bytes="$(stat -c %s -- "$file")" || exit 4
              sum="$(sha256sum -- "$file")" || exit 5
              printf "%s\t%s\t%s\n" "$file" "$bytes" "${sum%% *}"
          done
          '

          # The evidence inventory: one row for each file except the inventory and the
          # result, then the total byte count. A failed listing fails the inventory.
          METRIC_INVENTORY_SCRIPT='
          set -o pipefail
          shopt -s lastpipe
          cd -- "$1" || exit 1
          total=0
          printf "kind\tbytes\tsha256\tpath\n"
          find . -type f ! -path ./inventory.txt ! -path ./result.env -print0 | LC_ALL=C sort -z |
          while IFS= read -r -d "" file; do
              file="${file#./}"
              bytes="$(stat -c %s -- "$file")" || exit 4
              sum="$(sha256sum -- "$file")" || exit 5
              total=$(( total + bytes ))
              printf "FILE\t%s\t%s\t%s\n" "$bytes" "${sum%% *}" "$file"
          done || exit 6
          printf "TOTAL\t%s\n" "$total"
          '

          # The unique task directory under RUNNER_TEMP and its three subdirectories. The
          # name is printed first, so the cleanup can remove a partly made directory.
          METRIC_TASK_SCRIPT='
          dir="$(mktemp -d "$1/m3-metric-collection.XXXXXXXX")" || exit 1
          printf "%s\n" "$dir"
          mkdir -- "$dir/case" "$dir/config" "$dir/logs" || exit 2
          '

          # The fixed read-only process check of the cleanup (contract 6084196797,
          # Section 4). The cleanup runs it as root through the one admitted sudo -n
          # vector, with a clean environment and no caller command. $0 selects the part:
          # m3-process-check is the launch, and m3-process-guard is the guard under the
          # root monitor, which runs this same fixed text again (FIXED_GUARD_SOURCE).
          # Arguments: the task directory, RUNNER_TEMP, the original runner UID, the
          # boot time of the metric start and the absolute check end, both in
          # centiseconds, and the correlation token. Both parts check the arguments.
          #
          # The launch reads the boot clock and takes the scan interval: the time to the
          # absolute end less 500 centiseconds for the TERM grace and 100 for the stop
          # verification, at most 600. It refuses when the interval is not positive. It
          # writes the LAUNCH record and runs the monitor chain: prlimit, then timeout,
          # which sends SIGTERM to its own private process group at the interval and
          # SIGKILL 5 seconds later, then the guard. The guard records the monitor and
          # starts the scan in the monitor group. On SIGTERM it starts no new work. It
          # ends only when every other process of the group has stopped, so a check
          # child that ignores SIGTERM keeps the guard until the monitor SIGKILL, and no
          # check child outlives the monitor. The guard signals nothing. Then it reads
          # the boot clock for its terminal record; a failed read gives the status
          # CLOCK_UNAVAILABLE and status 1, never COMPLETE.
          #
          # The scan is the strict check of the continuation head 2902e9ab. A relevant
          # process is a live process with the runner UID as its real, effective, saved,
          # or file-system UID. For each one, the scan reads the working directory and
          # the open files of each thread, and the mapped files. A relevant process that
          # cannot be read completely is UNCERTAIN, also when it started before the
          # metric; such an older process is also counted (OLDER_UNREADABLE), for the
          # evidence only. A thread that ends, or an open file that closes, during the
          # check is not an error. A process with another error gets two more checks,
          # after 0.05 and 0.25 seconds; after the first UNCERTAIN line, the checks have
          # no pause. The check reads only /proc identity, state, UID, and start-time
          # metadata, the thread cwd and fd links, and the mapped files, and it keeps no
          # unmatched data. The frame: LAUNCH, FRAME, and MONITOR; MATCH, UNCERTAIN, and
          # OLDER_UNREADABLE lines; then SCAN_END, CHILD, and END.
          METRIC_ROOT_CHECK_SOURCE='
          set -u
          shopt -s nullglob
          cd / || exit 2
          m3_refuse() {
              printf "m3 process check: %s\n" "$1" >&2
              exit 2
          }
          m3_valid() {
              local part rest
              (( $# == 6 )) || m3_refuse "$# arguments, not 6"
              task="$1" runner="$2" uid="$3" since="$4" end="$5" token="$6"
              [[ "$runner" =~ ^(/[A-Za-z0-9_.-]+)+$ ]] || m3_refuse "RUNNER_TEMP is not a safe absolute path"
              rest="${runner#/}"
              while :; do
                  part="${rest%%/*}"
                  [[ "$part" != . && "$part" != .. && "$part" != -* ]] || m3_refuse "RUNNER_TEMP has an unsafe component"
                  [[ "$rest" == */* ]] || break
                  rest="${rest#*/}"
              done
              [[ "${task%/*}" == "$runner" && "${task##*/}" =~ ^m3-metric-collection[.][A-Za-z0-9]{8}$ ]] ||
                  m3_refuse "the task directory is not the unique metric directory under RUNNER_TEMP"
              [[ "$uid" =~ ^[1-9][0-9]{0,9}$ ]] && (( uid <= 4294967294 )) || m3_refuse "the runner UID is not a positive UID"
              [[ "$since" =~ ^(0|[1-9][0-9]{0,11})$ && "$end" =~ ^[1-9][0-9]{0,11}$ ]] && (( since < end )) ||
                  m3_refuse "the boot-clock values are not valid"
              [[ "$token" =~ ^[A-Za-z0-9]{8,64}$ ]] || m3_refuse "the token is not 8 to 64 letters and digits"
              [[ -d "$task" && ! -L "$task" ]] || m3_refuse "the task directory is not a directory"
              cd -P -- "$runner" 2> /dev/null && [[ "$PWD" == "$runner" ]] || m3_refuse "RUNNER_TEMP is not a canonical path"
              cd / || m3_refuse "the root directory cannot be entered"
          }
          m3_now() {
              local up rest
              { read -r up rest < /proc/uptime; } 2> /dev/null || return 1
              [[ "$up" =~ ^[0-9]{1,10}[.][0-9]{2}$ ]] || return 1
              now=$(( 10#${up/./} ))
          }
          m3_launch() {
              local scan duration FIXED_GUARD_SOURCE="$BASH_EXECUTION_STRING"
              m3_valid "$@"
              m3_now || m3_refuse "the boot clock cannot be read"
              scan=$(( end - now - 600 ))
              (( scan > 0 )) || m3_refuse "no scan time is left: the check end ${end} is not 600 centiseconds after ${now}"
              (( scan <= 600 )) || scan=600
              duration="$(( scan / 100 )).$(( scan % 100 / 10 ))$(( scan % 10 ))"
              printf "LAUNCH 1 %s %s %s\n" "$token" "$now" "$scan"
              exec /usr/bin/prlimit --core=1 --fsize=1048577 -- \
                  /usr/bin/timeout --signal=TERM --kill-after=5s "$duration" \
                  /usr/bin/bash --noprofile --norc -p -c "$FIXED_GUARD_SOURCE" m3-process-guard "$@"
          }
          m3_stat() {
              local line
              local -a fields=()
              st_state="" st_group="" st_start="" st_name=""
              { read -r line < "/proc/$1/stat"; } 2> /dev/null || return 1
              st_name="${line#*(}"
              st_name="${st_name%)*}"
              read -r -a fields <<< "${line##*") "}"
              st_state="${fields[0]:-}" st_group="${fields[2]:-}" st_start="${fields[19]:-}"
              [[ "$st_group" =~ ^[0-9]+$ && "$st_start" =~ ^[0-9]+$ ]]
          }
          m3_others() {
              local file pid
              others=""
              for file in /proc/[0-9]*/stat; do
                  pid="${file:6:-5}"
                  [[ "$pid" == "$1" || "$pid" == "$$" ]] && continue
                  if ! m3_stat "$pid"; then
                      [[ -e "$file" ]] && others="${others} ${pid}?"
                      continue
                  fi
                  [[ "$st_group" == "$1" && "$st_state" != Z && "$st_state" != X ]] && others="${others} ${pid}"
              done
          }
          status_of() {
              local item
              local -a lines=()
              uids="" state=""
              { mapfile -t lines < "$1/status"; } 2>/dev/null || return 1
              for item in "${lines[@]}"; do
                  case "$item" in
                      State:*)
                          state="${item#State:}"
                          state="${state#"${state%%[![:space:]]*}"}"
                          state="${state%%[[:space:]]*}" ;;
                      Uid:*)
                          uids=" ${item#Uid:} "
                          uids="${uids//[[:space:]]/ }"
                          break ;;
                  esac
              done
              return 0
          }
          ended() {
              [[ -e "$1" ]] || return 0
              if ! status_of "$1"; then
                  [[ -e "$1" ]] && return 1
                  return 0
              fi
              [[ "$state" == Z || "$state" == X || ! -e "$1" ]]
          }
          check() {
              local proc="$1" errors rc line explained=0
              local -a paths=("$1"/task/*/cwd "$1"/task/*/fd)
              problem=""
              if (( ${#paths[@]} == 0 )); then
                  ended "$proc" || problem="${proc}: no thread entries"
                  return 0
              fi
              errors="$( { LC_ALL=C /usr/bin/find "${paths[@]}" -maxdepth 1 \( -lname "$dir" -o -lname "$dir/*" \) \
                           -printf "MATCH %p\n" >&3; } 2>&1 )"
              rc=$?
              if (( rc != 0 )); then
                  while IFS= read -r line; do
                      [[ -n "$line" ]] || continue
                      if [[ "$line" =~ $gone_re ]] && { [[ "${BASH_REMATCH[3]}" == /fd/* ]] || ended "${BASH_REMATCH[2]}"; }; then
                          explained=1
                          continue
                      fi
                      problem="$line"
                      return 0
                  done <<< "$errors"
                  if (( explained == 0 )); then
                      problem="${proc}: find ended with status ${rc} without an ended entry"
                      return 0
                  fi
              fi
              /usr/bin/grep -F -q -e "${dir}/" -- "${proc}/maps" 2>/dev/null
              rc=$?
              if (( rc == 0 )); then
                  printf "MATCH %s/maps\n" "$proc"
              elif (( rc != 1 )) && ! ended "$proc"; then
                  problem="${proc}/maps: grep status ${rc}"
              fi
              return 0
          }
          examine() {
              local proc="$1" line="" start
              local -a fields=()
              problem="" relevant=0 new=1
              status_of "$proc"
              if [[ -z "$uids" ]]; then
                  ended "$proc" && return 0
                  relevant=1
                  problem="${proc}: the status cannot be read"
                  return 0
              fi
              [[ "$uids" == *" ${uid} "* ]] || return 0
              [[ "$state" == Z || "$state" == X ]] && return 0
              relevant=1
              { read -r line < "${proc}/stat"; } 2>/dev/null
              read -r -a fields <<< "${line##*") "}"
              start="${fields[19]:-}"
              if [[ ! "$start" =~ ^[0-9]+$ ]]; then
                  if ended "$proc"; then
                      relevant=0
                      return 0
                  fi
                  problem="${proc}: the start time cannot be read"
                  return 0
              fi
              if (( start * 100 / clk + 1 < since )); then
                  new=0
              fi
              check "$proc"
          }
          m3_scan() {
              local status proc pause refused=0
              dir="$task"
              exec 3>&1
              clk="$(/usr/bin/getconf CLK_TCK)" || exit 1
              [[ "$clk" =~ ^[1-9][0-9]*$ ]] || exit 1
              gone_re="^([^:]*/)?find: .(/proc/[0-9]+/task/[0-9]+)(/cwd|/fd|/fd/[0-9]+).: (No such file or directory|No such process)$"
              for status in /proc/[0-9]*/status; do
                  proc="${status%/status}"
                  examine "$proc"
                  if [[ -n "$problem" ]]; then
                      for pause in 0.05 0.25; do
                          (( refused )) || /usr/bin/sleep "$pause"
                          examine "$proc"
                          [[ -z "$problem" ]] && break
                      done
                  fi
                  (( relevant )) || continue
                  if [[ -n "$problem" ]]; then
                      refused=1
                      printf "UNCERTAIN %s\n" "$problem"
                      (( new )) || printf "OLDER_UNREADABLE %s\n" "$proc"
                  fi
              done
              printf "SCAN_END\n"
          }
          m3_guard() {
              local monitor="$PPID" mstart euid="" scan_pid scan_start="" scan_rc=1 status line
              local -a lines=()
              m3_valid "$@"
              m3_stat "$monitor" && [[ "$st_name" == timeout && "$st_group" == "$monitor" ]] ||
                  m3_refuse "the guard does not run under its timeout monitor"
              mstart="$st_start"
              m3_stat "$$" && [[ "$st_group" == "$monitor" ]] || m3_refuse "the guard is not in the monitor process group"
              { mapfile -t lines < /proc/self/status; } 2> /dev/null
              for line in "${lines[@]}"; do
                  if [[ "$line" == Uid:* ]]; then
                      read -r _ _ euid _ <<< "$line"
                      break
                  fi
              done
              term=0
              trap "term=1" TERM
              printf "FRAME 1 %s %s %s %s\n" "$token" "$task" "$uid" "$end"
              printf "MONITOR %s %s %s %s\n" "$monitor" "$monitor" "$mstart" "${euid:-UNAVAILABLE}"
              m3_scan &
              scan_pid=$!
              m3_stat "$scan_pid" && scan_start="$st_start"
              while :; do
                  wait "$scan_pid" && scan_rc=0 || scan_rc=$?
                  m3_stat "$scan_pid" && [[ "$st_start" == "$scan_start" ]] || break
              done
              printf "CHILD %s %s\n" "$scan_pid" "$scan_start"
              while :; do
                  m3_others "$monitor"
                  [[ -z "$others" ]] && break
                  /usr/bin/sleep 0.1
              done
              status=COMPLETE
              if (( term )); then
                  status=TERMINATED
              elif (( scan_rc != 0 )); then
                  status="SCAN_STATUS_${scan_rc}"
              fi
              if ! m3_now; then
                  [[ "$status" == COMPLETE ]] && status=CLOCK_UNAVAILABLE
                  now=0
                  printf "m3 process check: the boot clock cannot be read at the end\n" >&2
              fi
              printf "END 1 %s %s %s\n" "$token" "$status" "$now"
              [[ "$status" == COMPLETE ]]
          }
          case "$0" in
              m3-process-check) m3_launch "$@" ;;
              m3-process-guard) m3_guard "$@" ;;
              *) m3_refuse "the part is not known" ;;
          esac
          '
          readonly METRIC_ROOT_CHECK_SOURCE

          # The unprivileged check of the process-check executables before any
          # elevation, and the SHA-256 of the fixed source. Arguments: the source, then
          # the executables. One TOOL row for each: the path, the resolved target, its
          # owner, mode, and type, the owner and mode of its directory, and whether it
          # is executable; MISSING when it does not resolve.
          METRIC_TOOLS_SCRIPT='
          set -o pipefail
          sum="$(printf "%s" "$1" | sha256sum)" || exit 4
          printf "SOURCE_SHA256\t%s\n" "${sum%% *}"
          shift
          clk="$(getconf CLK_TCK)" || exit 5
          printf "CLK_TCK\t%s\n" "$clk"
          for tool; do
              if ! target="$(readlink -e -- "$tool")"; then
                  printf "TOOL\t%s\tMISSING\n" "$tool"
                  continue
              fi
              meta="$(stat -L -c "%u %a %F" -- "$target")" || exit 6
              dir="$(stat -L -c "%u %a" -- "${target%/*}")" || exit 6
              flag=NOEXEC
              [[ -x "$target" ]] && flag=X
              printf "TOOL\t%s\t%s\t%s\t%s\t%s\n" "$tool" "$target" "$meta" "$dir" "$flag"
          done
          '

          # The double-precision conversion of the speed and volume tokens: the speed
          # must be finite, and the volume finite and above zero.
          METRIC_NUMBERS_AWK='
          BEGIN {
              max = 1.7976931348623157e308
              speed = ARGV[1] + 0
              volume = ARGV[2] + 0
              print "SPEED_FINITE=" ((speed <= max && speed >= -max) ? "YES" : "NO")
              print "VOLUME_FINITE_POSITIVE=" ((volume > 0 && volume <= max) ? "YES" : "NO")
          }'

          # The controls of the copied Case: application and startFrom from controlDict,
          # and simulationType and the RAS model from turbulenceProperties.
          METRIC_CONTROLS_AWK='
          function word(s) { sub(/^[ \t]*[A-Za-z]+[ \t]+/, "", s); sub(/[ \t]*;[ \t]*$/, "", s); return s }
          FNR == 1 { file++ }
          { line = $0; sub(/\/\/.*/, "", line) }
          file == 1 && line ~ /^[ \t]*application[ \t]/ { n_app++; app = word(line) }
          file == 1 && line ~ /^[ \t]*startFrom[ \t]/ { n_start++; start = word(line) }
          file == 2 && line ~ /^[ \t]*simulationType[ \t]/ { n_sim++; sim = word(line) }
          file == 2 && line ~ /^[ \t]*(RASModel|model)[ \t]/ { n_model++; model = word(line) }
          END {
              print "APPLICATION=" (n_app == 1 ? app : "COUNT_" n_app + 0)
              print "START_FROM=" (n_start == 1 ? start : "COUNT_" n_start + 0)
              print "SIMULATION_TYPE=" (n_sim == 1 ? sim : "COUNT_" n_sim + 0)
              print "RAS_MODEL=" (n_model == 1 ? model : "COUNT_" n_model + 0)
          }'

          # The v2512 volFieldValue file: "# Region : all region0", "# Cells : N",
          # "# Volume : V", "# Time <tab> volAverage(m3MagU)", and one row of time and
          # value (the merged validation parser).
          METRIC_OUTPUT_AWK='
          function trim(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); return s }
          function after_colon(s) { sub(/^[^:]*:/, "", s); return trim(s) }
          /^#/ {
              if ($0 ~ /^#[ \t]*Region[ \t]*:/) { region_lines++; region = after_colon($0) }
              else if ($0 ~ /^#[ \t]*Cells[ \t]*:/) { cells_lines++; cells = after_colon($0) }
              else if ($0 ~ /^#[ \t]*Volume[ \t]*:/) { volume_lines++; volume = after_colon($0) }
              else if ($0 ~ /^#[ \t]*Time([ \t]|$)/) {
                  time_lines++
                  columns = $0
                  sub(/^#[ \t]*Time/, "", columns)
                  columns = trim(columns)
                  gsub(/[ \t]+/, " ", columns)
              }
              next
          }
          /^[ \t]*$/ { next }
          { rows++; row_fields = NF; row_time = $1; row_value = $2 }
          END {
              print "REGION_LINES=" region_lines + 0
              print "REGION=" region
              print "CELLS_LINES=" cells_lines + 0
              print "CELLS=" cells
              print "VOLUME_LINES=" volume_lines + 0
              print "VOLUME=" volume
              print "TIME_LINES=" time_lines + 0
              print "COLUMNS=" columns
              print "ROWS=" rows + 0
              print "ROW_FIELDS=" row_fields + 0
              print "ROW_TIME=" row_time
              print "ROW_VALUE=" row_value
          }'

          metric_now_ms() {
              local t="${EPOCHREALTIME//[!0-9]/}"
              printf '%s\n' "$(( 10#$t / 1000 ))"
          }

          # metric_seconds <milliseconds> - a timeout duration in seconds.
          metric_seconds() {
              printf '%d.%03d\n' "$(( $1 / 1000 ))" "$(( $1 % 1000 ))"
          }

          # metric_text <text> - one line of at most 300 characters, with no table bar.
          metric_text() {
              local text="${1//$'\n'/ }"
              text="${text//|//}"
              printf '%s\n' "${text:0:300}"
          }

          # metric_group_members <group> - print the PID of each live process in one
          # process group. Every /proc/<pid>/stat file is readable for every user, so the
          # check does not depend on the permission to signal. A zombie has stopped and
          # is not listed. Returns 1 when the stat file of a listed process cannot be
          # read, because the check is then not complete.
          metric_group_members() {
              local file line rest state
              for file in /proc/[0-9]*/stat; do
                  if ! { read -r line < "$file"; } 2>/dev/null; then
                      [[ -e "$file" ]] && return 1
                      continue
                  fi
                  # After the command name: the state, the parent PID, the group ID.
                  [[ "$line" == *" $1 "* ]] || continue
                  rest="${line##*") "}"
                  state="${rest%% *}"
                  rest="${rest#* }"
                  rest="${rest#* }"
                  if [[ "${rest%% *}" == "$1" && "$state" != Z ]]; then
                      printf '%s\n' "${file:6:-5}"
                  fi
              done
              return 0
          }

          # metric_group_empty <group> - status 0 only when the check is complete and the
          # group has no live process.
          metric_group_empty() {
              local members
              members="$(metric_group_members "$1")" || return 1
              [[ -z "$members" ]]
          }

          # metric_stop_group <group> <label> <deadline> - stop each process that is still
          # in the process group of one operation after timeout returns. <deadline> is the
          # absolute end of the operation in milliseconds. The remaining processes get
          # SIGTERM, and SIGKILL at the deadline less METRIC_STOP_RESERVE_MS, or
          # METRIC_KILL_GRACE_MS after an early return. The stop and its check end by the
          # deadline, and no step starts a new limit. A group ID below 2 is refused. Sets
          # M_STOP to EMPTY, STOPPED, or NOT_STOPPED, and returns 1 for NOT_STOPPED.
          metric_stop_group() {
              local group="$1" label="$2" end="$3" kill_at now members=""
              M_STOP=EMPTY
              if [[ ! "$group" =~ ^[0-9]+$ ]] || (( 10#$group < 2 )); then
                  M_STOP=NOT_STOPPED
                  echo "m3 mean speed ${label}: refused to signal process group '${group}'"
                  return 1
              fi
              metric_group_empty "$group" && return 0
              M_STOP=STOPPED
              now="$(metric_now_ms)"
              kill_at=$(( end - METRIC_STOP_RESERVE_MS ))
              if (( kill_at > now + METRIC_KILL_GRACE_MS )); then
                  kill_at=$(( now + METRIC_KILL_GRACE_MS ))
                  end=$(( kill_at + METRIC_STOP_RESERVE_MS ))
              fi
              if (( now < kill_at )); then
                  kill -s TERM -- "-${group}" 2>/dev/null || true
                  while (( $(metric_now_ms) < kill_at )); do
                      metric_group_empty "$group" && return 0
                      sleep 0.1
                  done
              fi
              kill -s KILL -- "-${group}" 2>/dev/null || true
              # The last check starts at least 150 milliseconds before the end.
              while :; do
                  if members="$(metric_group_members "$group")" && [[ -z "$members" ]]; then
                      return 0
                  fi
                  (( $(metric_now_ms) + 150 < end )) || break
                  sleep 0.1
              done
              M_STOP=NOT_STOPPED
              echo "m3 mean speed ${label}: process group ${group} did not stop by its deadline: ${members//$'\n'/ }"
              return 1
          }

          # metric_fail <code> <reason> - record the first failure. A later failure keeps
          # the first code and reason.
          metric_fail() {
              if [[ -z "$M_CODE" ]]; then
                  M_CODE="$1"
                  M_REASON="$(metric_text "$2")"
                  M_FAIL_POINT="${M_POINT:-UNKNOWN}"
              fi
              echo "m3 mean speed: $1: $2"
              return 0
          }

          # metric_op <label> <class> <command> [args...] - one bounded operation with
          # standard input from /dev/null and its two logs in M_LOG_DIR, or in M_OUT_FILE
          # and M_ERR_FILE. The limit is the smallest of the class time left and the time
          # left before the metric end; each class except CLEANUP and FINAL also keeps the
          # cleanup time free. timeout makes a new process group, and its PID is the
          # group ID. The command gets SIGTERM 6 seconds before the limit, and SIGKILL 1
          # second before it. A limit at or below 6 seconds starts nothing. prlimit sets
          # the kernel file-size limit of the command and its children: M_FSIZE, or
          # METRIC_OP_FILE_LIMIT. A write past it gives SIGXFSZ (status 153). The core
          # limit of 1 byte stops each core dump, also through a core pipe. Sets M_OUT,
          # M_ERR, M_STATUS, M_OUTCOME (COMPLETED, FAILED, FILE_LIMIT, TIMEOUT,
          # NOT_STOPPED, or NOT_STARTED), M_LIMIT, M_FILE_LIMIT, M_GROUP, and M_ELAPSED,
          # and writes one row to commands.tsv. M_OP_END, when set, is an earlier
          # absolute end for this operation, so a cleanup step never restarts a limit.
          metric_op() {
              local label="$1" class="$2" start limit left term argument quoted
              shift 2
              M_FILE_LIMIT="${M_FSIZE:-$METRIC_OP_FILE_LIMIT}"
              M_SEQ=$(( M_SEQ + 1 ))
              M_OUT="${M_OUT_FILE:-${M_LOG_DIR}/$(printf '%02d' "$M_SEQ")-${label}.out}"
              M_ERR="${M_ERR_FILE:-${M_LOG_DIR}/$(printf '%02d' "$M_SEQ")-${label}.err}"
              if [[ -z "$M_RECORD" ]]; then
                  # Each argument shell-quoted; the fixed check source as its SHA-256.
                  for argument in "$@"; do
                      if [[ "$argument" == "$METRIC_ROOT_CHECK_SOURCE" ]]; then
                          quoted="<METRIC_ROOT_CHECK_SOURCE sha256 ${M_CHECK_SOURCE_SHA}>"
                      else
                          printf -v quoted '%q' "$argument"
                      fi
                      M_RECORD+="${quoted} "
                  done
                  M_RECORD="${M_RECORD% }"
              fi
              start="$(metric_now_ms)"
              case "$class" in
                  SELECT) limit=$(( METRIC_SELECT_MS - M_SELECT_USED )) ;;
                  CALC) limit=$(( METRIC_CALC_MS - M_CALC_USED )) ;;
                  WORK|FINAL) limit=$(( METRIC_WORK_MS - M_WORK_USED )) ;;
                  CLEANUP) limit=$(( METRIC_CLEANUP_MS - M_CLEANUP_USED )) ;;
                  *) limit=0 ;;
              esac
              case "$class" in
                  CLEANUP|FINAL) left=$(( M_END_MS - start )) ;;
                  *) left=$(( M_END_MS - METRIC_CLEANUP_MS - start )) ;;
              esac
              if [[ -n "$M_OP_END" ]] && (( M_OP_END - start < left )); then
                  left=$(( M_OP_END - start ))
              fi
              if (( left < limit )); then
                  limit="$left"
              fi
              M_LIMIT="$limit"
              M_STATUS=124
              M_GROUP=-
              M_STOP=EMPTY
              M_OUTCOME=NOT_STARTED
              term=$(( limit - METRIC_KILL_GRACE_MS - METRIC_STOP_RESERVE_MS ))
              if (( term > 0 )); then
                  timeout --kill-after="$(metric_seconds "$METRIC_KILL_GRACE_MS")" "$(metric_seconds "$term")" \
                      prlimit --core=1 --fsize="$M_FILE_LIMIT" -- "$@" > "$M_OUT" 2> "$M_ERR" < /dev/null &
                  M_GROUP=$!
                  M_GROUPS+=("$M_GROUP")
                  wait "$M_GROUP" && M_STATUS=0 || M_STATUS=$?
                  metric_stop_group "$M_GROUP" "$label" "$(( start + limit ))" || true
                  case "$M_STATUS" in
                      0) M_OUTCOME=COMPLETED ;;
                      124|137) M_OUTCOME=TIMEOUT ;;
                      153) M_OUTCOME=FILE_LIMIT ;;
                      *) M_OUTCOME=FAILED ;;
                  esac
                  if [[ "$M_STOP" == NOT_STOPPED ]]; then
                      M_OUTCOME=NOT_STOPPED
                  fi
              fi
              M_ELAPSED=$(( $(metric_now_ms) - start ))
              case "$class" in
                  SELECT) M_SELECT_USED=$(( M_SELECT_USED + M_ELAPSED )) ;;
                  CALC) M_CALC_USED=$(( M_CALC_USED + M_ELAPSED )) ;;
                  WORK|FINAL) M_WORK_USED=$(( M_WORK_USED + M_ELAPSED )) ;;
                  CLEANUP) M_CLEANUP_USED=$(( M_CLEANUP_USED + M_ELAPSED )) ;;
              esac
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$M_SEQ" "$label" "$class" "$limit" \
                  "$M_FILE_LIMIT" "$start" "$(( start + M_ELAPSED ))" "$M_STATUS" "$M_OUTCOME" "$M_GROUP" "${M_OUT##*/}" \
                  "$M_RECORD" >> "${M_DIR}/commands.tsv"
              M_RECORD=""
              M_FSIZE=""
              M_OP_END=""
              return 0
          }

          # metric_foam_op <label> <class> <openfoam-vector...> - metric_op of one exact
          # OpenFOAM vector in the loaded environment. The record keeps the exact vector.
          metric_foam_op() {
              local label="$1" class="$2"
              shift 2
              M_RECORD="$(printf '%q ' "$@")"
              M_RECORD="${M_RECORD% }"
              M_FOAM_RECORD="$M_RECORD"
              metric_op "$label" "$class" bash -c "$METRIC_ENV_SHIM" openfoam-env "$OPENFOAM_BASHRC" "$@"
          }

          # metric_require <label> <code> - status 1 unless the last operation completed
          # with status 0. A status other than 0 gives <code>.
          metric_require() {
              case "$M_OUTCOME" in
                  COMPLETED) return 0 ;;
                  NOT_STOPPED)
                      metric_fail PROCESS_STOP_FAILURE \
                          "process group ${M_GROUP} of the $1 operation still had a process, or could not be checked, at the end of its ${M_LIMIT} ms limit" ;;
                  FILE_LIMIT)
                      metric_fail RESOURCE_LIMIT "the $1 operation ended with status 153 (SIGXFSZ): a file reached its ${M_FILE_LIMIT}-byte file limit" ;;
                  TIMEOUT) metric_fail TIMEOUT "the $1 operation did not complete within its ${M_LIMIT} ms limit" ;;
                  NOT_STARTED) metric_fail TIMEOUT "no time was left for the $1 operation (limit ${M_LIMIT} ms)" ;;
                  *) metric_fail "$2" "the $1 operation ended with status ${M_STATUS}" ;;
              esac
              return 1
          }

          # metric_values <file> <prefix> - set <prefix><KEY> for each KEY=value line.
          metric_values() {
              local line key
              while IFS= read -r line; do
                  key="${line%%=*}"
                  [[ "$line" == *=* && "$key" =~ ^[A-Za-z_]+$ ]] || continue
                  printf -v "${2}${key}" '%s' "${line#*=}"
              done < "$1"
          }

          # metric_compare <label> <file> <file> - status 0 when the two files have the
          # same bytes, 1 when they differ, and 2 when the comparison did not complete,
          # with the failure recorded.
          metric_compare() {
              metric_op "$1" WORK cmp -s -- "$2" "$3"
              [[ "$M_OUTCOME" == COMPLETED ]] && return 0
              [[ "$M_OUTCOME" == FAILED && "$M_STATUS" == 1 ]] && return 1
              metric_require "$1" COMMAND_FAILURE
              return 2
          }

          metric_is_zero() {
              local mantissa="${1#[-+]}"
              mantissa="${mantissa%%[eE]*}"
              [[ "$mantissa" =~ ^0*([.]0*)?$ ]]
          }

          metric_non_finite() {
              local value="${1,,}"
              [[ "$value" =~ ^[-+]?(nan|inf|infinity)([(].*[)])?$ ]]
          }

          # metric_write_result <verdict> <code> <reason> - the result record.
          metric_write_result() {
              local value=UNAVAILABLE
              if [[ "$1" == AVAILABLE ]]; then
                  value="$M_VALUE"
              fi
              {
                echo "MEAN_SPEED_VERDICT=$1"
                echo "MEAN_SPEED_REASON_CODE=$2"
                echo "MEAN_SPEED_REASON=$(metric_text "$3")"
                echo "MEAN_SPEED_VALUE=${value}"
                echo "MEAN_SPEED_UNIT=m/s"
                echo "MEAN_SPEED_FORMULA=sum(V_i * |U_i|) / sum(V_i), volAverage(m3MagU) of mag(U)"
                echo "MEAN_SPEED_SCOPE=collection only; not convergence, mesh, PointData, or M3 acceptance; no scientific range"
                echo "MEAN_SPEED_STOP_POINT=${M_FAIL_POINT}"
                echo "MAIN_SHA=${GITHUB_SHA:-UNAVAILABLE}"
                echo "RUN_ID=${GITHUB_RUN_ID:-UNAVAILABLE}"
                echo "SOURCE_FLOW_CASE=src/batch_9/case_7/flow"
                echo "POST_PROCESSING_TIME=${M_POST_TIME}"
                echo "SELECTED_TIME=${SELECTED_TIME}"
                echo "SELECTION_VECTOR=${M_SELECTION_VECTOR}"
                echo "METRIC_VECTOR=${M_METRIC_VECTOR}"
                echo "DICTIONARY_BYTES=${M_DICT_BYTES}"
                echo "DICTIONARY_SHA256=${M_DICT_SHA}"
                echo "INPUT_FILES=${M_INPUT_FILES}"
                echo "INPUT_BYTES=${M_INPUT_BYTES}"
                echo "INPUTS_UNCHANGED=${M_INPUTS_UNCHANGED}"
                echo "TASK_MEASURED_LIMIT_BYTES=${METRIC_MAX_TASK_BYTES}"
                echo "TASK_MEASURED_MAX_BYTES=${M_TASK_BYTES}"
                echo "TASK_COPY_FILE_LIMIT_BYTES=${M_COPY_FSIZE}"
                echo "TASK_CALCULATION_FILE_LIMIT_BYTES=${M_CALC_FSIZE}"
                echo "TASK_BYTES_CONTROL=TASK_MEASURED_MAX_BYTES is the largest of five apparent-byte measurements (before and after the copy, before and after the calculation, and final), not a continuous peak; a measured total above TASK_MEASURED_LIMIT_BYTES fails; the kernel limits each file of the copy and of the calculation to the measured task bytes left at its start (RLIMIT_FSIZE, a limit for each file, not for the sum); files that exist only between two measurements are not measured, so the apparent and the allocated task bytes are not continuously bounded, and a full disk can stop the collection or the capture; no quota"
                echo "OUTPUT_PATH=${M_OUTPUT_PATH}"
                echo "OUTPUT_SHA256=${M_OUTPUT_SHA}"
                echo "OUTPUT_TIME=${M_O_ROW_TIME}"
                echo "OUTPUT_REGION=${M_O_REGION}"
                echo "OUTPUT_FIELD=${M_O_COLUMNS}"
                echo "OUTPUT_CELLS=${M_O_CELLS}"
                echo "OUTPUT_VOLUME=${M_O_VOLUME}"
                echo "OUTPUT_VALUE=${M_O_ROW_VALUE}"
                echo "CLEANUP_RESULT=${M_CLEANUP}"
                echo "CLEANUP_OLDER_UNREADABLE=${M_OLDER_UNREADABLE}"
                echo "CLEANUP_START_MS=${M_CLEANUP_START}"
                echo "PROCESS_CHECK_END_MS=${M_CHECK_END}"
                echo "CLEANUP_END_MS=${M_CLEANUP_END}"
                echo "ORIGINAL_RUNNER_UID=${ORIGINAL_RUNNER_UID}"
                echo "PROCESS_CHECK_RESULT=${M_CHECK_RESULT}"
                echo "PROCESS_CHECK_SOURCE_SHA256=${M_CHECK_SOURCE_SHA}"
                echo "PROCESS_CHECK_TOKEN=${M_CHECK_TOKEN}"
                echo "PROCESS_CHECK_LAUNCH_BOOT_CS=${M_CHECK_LAUNCH_CS}"
                echo "PROCESS_CHECK_END_BOOT_CS=${CHECK_END_BOOT_CS}"
                echo "PROCESS_CHECK_ENTRY_BOOT_CS=${M_CHECK_ENTRY}"
                echo "PROCESS_CHECK_SCAN_CS=${M_CHECK_SCAN}"
                echo "PROCESS_CHECK_MONITOR=${M_CHECK_MONITOR}"
                echo "PROCESS_CHECK_CHILD=${M_CHECK_CHILD}"
                echo "PROCESS_CHECK_STOPPED=${M_CHECK_STOPPED}"
                echo "LOGS_RETAINED=${M_LOGS_RETAINED}"
                echo "LOG_BYTES=${M_LOG_BYTES}"
                echo "EVIDENCE_BYTES=${M_EVIDENCE_BYTES}"
                echo "INVENTORY=${M_INVENTORY}"
                echo "METRIC_START_MS=${M_START_MS}"
                echo "METRIC_END_MS=${M_END_MS}"
                echo "METRIC_FINISH_MS=$(metric_now_ms)"
                echo "SELECTION_USED_MS=${M_SELECT_USED}"
                echo "CALCULATION_USED_MS=${M_CALC_USED}"
                echo "WORK_USED_MS=${M_WORK_USED}"
                echo "CLEANUP_USED_MS=${M_CLEANUP_USED}"
                echo "LIMITS=total ${METRIC_TOTAL_MS} ms; selection ${METRIC_SELECT_MS} ms; calculation ${METRIC_CALC_MS} ms; inputs, copy, checks, and evidence ${METRIC_WORK_MS} ms; cleanup ${METRIC_CLEANUP_MS} ms, with at most ${METRIC_CHECK_MS} ms for the process check and at least ${METRIC_REMOVE_MS} ms for the removal; ${METRIC_MAX_FILES} input files; ${METRIC_MAX_INPUT_BYTES} input bytes; ${METRIC_MAX_TASK_BYTES} task bytes; ${METRIC_LOG_LIMIT} bytes for each log; ${METRIC_LOGS_LIMIT} log bytes; ${METRIC_EVIDENCE_LIMIT} evidence bytes; file limit ${METRIC_OP_FILE_LIMIT} bytes for each operation except the copy and the calculation; ${METRIC_RECORD_LIMIT} bytes for the time record"
              } > "${M_DIR}/result.env"
          }

          # metric_identity - the environment gate. The values come from the installed
          # system after the derived bashrc is loaded. No package is installed.
          metric_identity() {
              local tree line
              if [[ "${BASELINE_RESULT:-}" != SUCCEEDED || "${OPENFOAM_BASELINE:-}" != v2512 ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the resolved baseline is '${OPENFOAM_BASELINE:-UNAVAILABLE}' (${BASELINE_RESULT:-NOT_ATTEMPTED}), not v2512"
                  return 1
              fi
              if [[ "${OPENFOAM_PACKAGE:-}" != openfoam2512-default ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the derived package is '${OPENFOAM_PACKAGE:-UNAVAILABLE}', not openfoam2512-default"
                  return 1
              fi
              if [[ "${OPENFOAM_BASHRC:-}" != */openfoam2512/etc/bashrc || ! -f "${OPENFOAM_BASHRC:-}" ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the derived environment file '${OPENFOAM_BASHRC:-UNAVAILABLE}' is not an openfoam2512 etc/bashrc file"
                  return 1
              fi
              tree="${OPENFOAM_BASHRC%/etc/bashrc}"
              metric_op identity WORK bash -c "$METRIC_IDENTITY_SCRIPT" identity "$OPENFOAM_PACKAGE" "$OPENFOAM_BASHRC"
              metric_require identity ENVIRONMENT_MISMATCH || return 1
              metric_values "$M_OUT" M_ID_
              {
                while IFS= read -r line || [[ -n "$line" ]]; do
                    printf '%s\n' "$line"
                done < "$M_OUT"
                echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC}"
                echo "OPENFOAM_TREE=${tree}"
              } > "${M_DIR}/identity.txt"
              if [[ "${M_ID_PACKAGE_VERSION:-}" != 2512.0-2 ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the installed openfoam2512-default version is '${M_ID_PACKAGE_VERSION:-UNAVAILABLE}', not 2512.0-2"
                  return 1
              fi
              if [[ "${M_ID_ARCHITECTURE:-}" != x86_64 ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the machine architecture is '${M_ID_ARCHITECTURE:-UNAVAILABLE}', not x86_64"
                  return 1
              fi
              if [[ "${M_ID_SOURCE_STATUS:-}" != 0 || "${M_ID_WM_PROJECT_VERSION:-}" != v2512 ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the loaded environment is not v2512: source status ${M_ID_SOURCE_STATUS:-UNAVAILABLE}, WM_PROJECT_VERSION '${M_ID_WM_PROJECT_VERSION:-UNAVAILABLE}'"
                  return 1
              fi
              if [[ "${M_ID_WM_COMPILER:-}" != Gcc* ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "the OpenFOAM compiler is '${M_ID_WM_COMPILER:-UNAVAILABLE}', not GCC"
                  return 1
              fi
              if [[ "${M_ID_PATH_foamListTimes:-}" != "${tree}/"* || "${M_ID_PATH_simpleFoam:-}" != "${tree}/"* ]]; then
                  metric_fail ENVIRONMENT_MISMATCH "a command is outside the installed openfoam2512 tree: foamListTimes '${M_ID_PATH_foamListTimes:-}', simpleFoam '${M_ID_PATH_simpleFoam:-}'"
                  return 1
              fi
              return 0
          }

          # metric_source - the completed Case 7 flow result and the post-processing
          # time record. The record is read by one bounded operation of at most
          # METRIC_RECORD_LIMIT + 1 bytes.
          metric_source() {
              local batch="${GITHUB_WORKSPACE}/src/batch_9" path raw token
              for path in "$batch" "${batch}/case_7" "$SOURCE_FLOW_CASE" "${batch}/case_7/vtk"; do
                  if [[ ! -d "$path" || -L "$path" ]]; then
                      metric_fail SOURCE_MISMATCH "${path#"${GITHUB_WORKSPACE}/"} is not a directory, or it is a link"
                      return 1
                  fi
              done
              for path in "${SOURCE_FLOW_CASE}/flow.marker" "${batch}/case_7/vtk/post_processing.complete" \
                          "${batch}/case_7/vtk/flow_latest_time.txt"; do
                  if [[ ! -f "$path" || -L "$path" ]]; then
                      metric_fail SOURCE_MISMATCH "the record ${path#"${GITHUB_WORKSPACE}/"} is missing, or it is a link"
                      return 1
                  fi
              done
              metric_op time-record WORK head -c "$(( METRIC_RECORD_LIMIT + 1 ))" -- "${batch}/case_7/vtk/flow_latest_time.txt"
              metric_require time-record COMMAND_FAILURE || return 1
              raw=""
              if IFS= read -r -d '' raw < "$M_OUT"; then
                  metric_fail SOURCE_MISMATCH "the post-processing time record has a NUL byte"
                  return 1
              fi
              if (( ${#raw} > METRIC_RECORD_LIMIT )); then
                  metric_fail SOURCE_MISMATCH "the post-processing time record has more than ${METRIC_RECORD_LIMIT} bytes"
                  return 1
              fi
              token="${raw%$'\n'}"
              if [[ "$raw" != *$'\n' || "$token" == *$'\n'* || ! "$token" =~ $METRIC_TIME_RE ]]; then
                  metric_fail SOURCE_MISMATCH "the post-processing time record is not one numeric time and one line end: '$(metric_text "$raw")'"
                  return 1
              fi
              M_POST_TIME="$token"
              return 0
          }

          # metric_selection - the exact latest-time vector. One nonzero numeric time that
          # equals the post-processing record, and a time directory at the Case root.
          metric_selection() {
              local -a lines=()
              metric_foam_op foamListTimes SELECT foamListTimes -case "$SOURCE_FLOW_CASE" -latestTime
              M_SELECTION_VECTOR="$M_FOAM_RECORD"
              metric_require foamListTimes COMMAND_FAILURE || return 1
              mapfile -t lines < "$M_OUT"
              if (( ${#lines[@]} != 1 )); then
                  metric_fail SOURCE_MISMATCH "foamListTimes printed ${#lines[@]} lines, not one time"
                  return 1
              fi
              if [[ ! "${lines[0]}" =~ $METRIC_TIME_RE ]]; then
                  metric_fail SOURCE_MISMATCH "the latest time '$(metric_text "${lines[0]}")' is not a numeric time"
                  return 1
              fi
              if metric_is_zero "${lines[0]}"; then
                  metric_fail SOURCE_MISMATCH "the latest time is ${lines[0]}, which is not a result time"
                  return 1
              fi
              if [[ "${lines[0]}" != "$M_POST_TIME" ]]; then
                  metric_fail SOURCE_MISMATCH "the latest time ${lines[0]} differs from the post-processing record ${M_POST_TIME}"
                  return 1
              fi
              SELECTED_TIME="${lines[0]}"
              if [[ ! -d "${SOURCE_FLOW_CASE}/${SELECTED_TIME}" || -L "${SOURCE_FLOW_CASE}/${SELECTED_TIME}" ]]; then
                  metric_fail SOURCE_MISMATCH "the reconstructed time directory ${SELECTED_TIME} is not a directory at the Case root, or it is a link"
                  return 1
              fi
              return 0
          }

          # metric_inputs - the exact input list: the regular files directly in
          # constant/polyMesh, the five dictionaries, and the regular files directly in
          # the selected time directory. A link, a hard link, a device, a FIFO, an unsafe
          # name, a mesh in the time directory, or another subdirectory than
          # polyMesh/sets and <time>/uniform stops the work. Sets M_FILES.
          metric_inputs() {
              local rel type links size path name dir count=0 bytes=0 required
              local -A seen=()
              M_FILES=()
              for rel in constant constant/polyMesh system "$SELECTED_TIME"; do
                  if [[ ! -d "${SOURCE_FLOW_CASE}/${rel}" || -L "${SOURCE_FLOW_CASE}/${rel}" ]]; then
                      metric_fail SOURCE_MISMATCH "the source directory ${rel} is missing, or it is a link"
                      return 1
                  fi
              done
              if [[ -e "${SOURCE_FLOW_CASE}/${SELECTED_TIME}/polyMesh" || -L "${SOURCE_FLOW_CASE}/${SELECTED_TIME}/polyMesh" ]]; then
                  metric_fail SOURCE_MISMATCH "the mesh in ${SELECTED_TIME}/polyMesh would override constant/polyMesh"
                  return 1
              fi
              for rel in constant/transportProperties constant/turbulenceProperties system/controlDict system/fvSchemes \
                         system/fvSolution; do
                  if [[ ! -f "${SOURCE_FLOW_CASE}/${rel}" || -L "${SOURCE_FLOW_CASE}/${rel}" ]]; then
                      metric_fail SOURCE_MISMATCH "the required input ${rel} is missing, or it is a link"
                      return 1
                  fi
              done
              M_RECORD="find <polyMesh> <time> <five dictionaries> -maxdepth 1 -printf <type, links, bytes, path> | sort"
              metric_op inventory WORK bash -c 'set -o pipefail; find "$@" -maxdepth 1 -printf "%y\t%n\t%s\t%p\n" | LC_ALL=C sort -t "$(printf "\t")" -k 4,4' \
                  inventory "${SOURCE_FLOW_CASE}/constant/polyMesh" "${SOURCE_FLOW_CASE}/${SELECTED_TIME}" \
                  "${SOURCE_FLOW_CASE}/constant/transportProperties" "${SOURCE_FLOW_CASE}/constant/turbulenceProperties" \
                  "${SOURCE_FLOW_CASE}/system/controlDict" "${SOURCE_FLOW_CASE}/system/fvSchemes" \
                  "${SOURCE_FLOW_CASE}/system/fvSolution"
              metric_require inventory SOURCE_MISMATCH || return 1
              while IFS=$'\t' read -r type links size path; do
                  rel="${path#"${SOURCE_FLOW_CASE}/"}"
                  name="${rel##*/}"
                  dir="${rel%/*}"
                  [[ "$rel" == constant/polyMesh || "$rel" == "$SELECTED_TIME" ]] && continue
                  if [[ "$path" != "${SOURCE_FLOW_CASE}/"* || ! "$name" =~ $METRIC_NAME_RE ]]; then
                      metric_fail SOURCE_MISMATCH "the source entry '$(metric_text "$rel")' has an unsafe name"
                      return 1
                  fi
                  case "$type" in
                      f) ;;
                      d)
                          if [[ "$rel" == constant/polyMesh/sets || "$rel" == "${SELECTED_TIME}/uniform" ]]; then
                              continue
                          fi
                          metric_fail SOURCE_MISMATCH "the source directory ${rel} is not a supported layout"
                          return 1 ;;
                      l)
                          metric_fail SOURCE_MISMATCH "the source entry ${rel} is a link"
                          return 1 ;;
                      *)
                          metric_fail SOURCE_MISMATCH "the source entry ${rel} is not a regular file (type ${type})"
                          return 1 ;;
                  esac
                  if [[ "$links" != 1 ]]; then
                      metric_fail SOURCE_MISMATCH "the source file ${rel} has ${links} hard links"
                      return 1
                  fi
                  if [[ "$dir" != constant/polyMesh && "$dir" != "$SELECTED_TIME" && "$dir" != constant && "$dir" != system ]]; then
                      metric_fail SOURCE_MISMATCH "the source file ${rel} is outside the approved input set"
                      return 1
                  fi
                  count=$(( count + 1 ))
                  bytes=$(( bytes + size ))
                  seen[$rel]=1
                  M_FILES+=("$rel")
              done < "$M_OUT"
              M_INPUT_FILES="$count"
              M_INPUT_BYTES="$bytes"
              for required in constant/polyMesh/points constant/polyMesh/faces constant/polyMesh/owner \
                              constant/polyMesh/neighbour constant/polyMesh/boundary constant/transportProperties \
                              constant/turbulenceProperties system/controlDict system/fvSchemes system/fvSolution \
                              "${SELECTED_TIME}/U" "${SELECTED_TIME}/p" "${SELECTED_TIME}/k" "${SELECTED_TIME}/epsilon" \
                              "${SELECTED_TIME}/nut"; do
                  if [[ -z "${seen[$required]:-}" ]]; then
                      metric_fail SOURCE_MISMATCH "the required input ${required} is missing"
                      return 1
                  fi
              done
              if (( count > METRIC_MAX_FILES )); then
                  metric_fail RESOURCE_LIMIT "the input has ${count} files, above ${METRIC_MAX_FILES}"
                  return 1
              fi
              if (( bytes > METRIC_MAX_INPUT_BYTES )); then
                  metric_fail RESOURCE_LIMIT "the input has ${bytes} bytes, above ${METRIC_MAX_INPUT_BYTES}"
                  return 1
              fi
              return 0
          }

          # metric_manifest <label> <root> <output-file> - the manifest of M_FILES under
          # <root>, as one bounded operation.
          metric_manifest() {
              M_RECORD="bash -c <manifest: path, bytes, sha256> ${2} <${#M_FILES[@]} input files>"
              M_OUT_FILE="$3"
              metric_op "$1" WORK bash -c "$METRIC_MANIFEST_SCRIPT" manifest "$2" "${M_FILES[@]}"
              M_OUT_FILE=""
              metric_require "$1" INPUT_CHANGED || return 1
              return 0
          }

          # metric_task_bytes <label> - the apparent size of the task directory. The two
          # logs go to the evidence directory, so the task directory does not change
          # between the measurement and the next operation. Each measurement goes to
          # task-bytes.tsv with its time, also a failed one (UNAVAILABLE). Sets
          # M_TASK_LAST, and M_TASK_BYTES to the largest measured size.
          metric_task_bytes() {
              local bytes="" path="" count=0 line
              M_OUT_FILE="${M_DIR}/${1}.out"
              M_ERR_FILE="${M_DIR}/${1}.err"
              metric_op "$1" WORK du -sb -- "$TASK_TEMP"
              M_OUT_FILE=""
              M_ERR_FILE=""
              if [[ "$M_OUTCOME" == COMPLETED ]]; then
                  while IFS= read -r line; do
                      count=$(( count + 1 ))
                      bytes="${line%%$'\t'*}"
                      path="${line#*$'\t'}"
                  done < "$M_OUT"
                  if (( count != 1 )) || [[ ! "$bytes" =~ ^[0-9]+$ || "$path" != "$TASK_TEMP" ]]; then
                      bytes=""
                  fi
              fi
              printf '%s\t%s\t%s\n' "$1" "${bytes:-UNAVAILABLE}" "$(metric_now_ms)" >> "${M_DIR}/task-bytes.tsv"
              metric_require "$1" COMMAND_FAILURE || return 1
              if [[ -z "$bytes" ]]; then
                  metric_fail COMMAND_FAILURE "the $1 measurement is not one byte count of the task directory"
                  return 1
              fi
              M_TASK_LAST="$bytes"
              if [[ "$M_TASK_BYTES" == UNAVAILABLE ]] || (( bytes > M_TASK_BYTES )); then
                  M_TASK_BYTES="$bytes"
              fi
              if (( bytes > METRIC_MAX_TASK_BYTES )); then
                  metric_fail RESOURCE_LIMIT "the task directory has ${bytes} bytes, above ${METRIC_MAX_TASK_BYTES}"
                  return 1
              fi
              return 0
          }

          # metric_output - the one accepted output file, its copy and checksum, and its
          # values.
          metric_output() {
              local pp="${CASE_DIR}/postProcessing" want="m3MeanSpeed/${SELECTED_TIME}/volFieldValue.dat"
              local type size rel found=0 others="" sum_a sum_b output_bytes=0
              if [[ ! -d "$pp" || -L "$pp" ]]; then
                  metric_fail MISSING_OUTPUT "the calculation wrote no postProcessing directory"
                  return 1
              fi
              metric_op list-output WORK find "$pp" -mindepth 1 -printf '%y\t%s\t%P\n'
              metric_require list-output COMMAND_FAILURE || return 1
              while IFS=$'\t' read -r type size rel; do
                  if [[ "$rel" == "$want" && "$type" == f ]]; then
                      found=1
                      output_bytes="$size"
                  elif [[ "$type" == d && ( "$rel" == m3MeanSpeed || "$rel" == "m3MeanSpeed/${SELECTED_TIME}" ) ]]; then
                      continue
                  else
                      others="${others} ${type}:${rel}"
                  fi
              done < "$M_OUT"
              if (( found == 0 )); then
                  metric_fail MISSING_OUTPUT "no regular file at postProcessing/${want}; other entries:${others:- none}"
                  return 1
              fi
              if [[ -n "$others" ]]; then
                  metric_fail DUPLICATE_OUTPUT "postProcessing has other entries besides ${want}:${others}"
                  return 1
              fi
              M_OUTPUT_PATH="postProcessing/${want}"
              if [[ ! "$output_bytes" =~ ^[0-9]+$ ]] || (( output_bytes > METRIC_LOG_LIMIT )); then
                  metric_fail RESOURCE_LIMIT "the output file has ${output_bytes} bytes, above ${METRIC_LOG_LIMIT}"
                  return 1
              fi
              metric_op copy-output WORK cp -- "${pp}/${want}" "${M_DIR}/output/volFieldValue.dat"
              metric_require copy-output COMMAND_FAILURE || return 1
              metric_op hash-output WORK sha256sum -- "${pp}/${want}" "${M_DIR}/output/volFieldValue.dat"
              metric_require hash-output COMMAND_FAILURE || return 1
              { read -r sum_a _; read -r sum_b _; } < "$M_OUT"
              if [[ ! "$sum_a" =~ ^[0-9a-f]{64}$ || "$sum_a" != "$sum_b" ]]; then
                  metric_fail COMMAND_FAILURE "the output copy does not have the bytes of the output file"
                  return 1
              fi
              M_OUTPUT_SHA="$sum_a"
              metric_op parse-output WORK awk "$METRIC_OUTPUT_AWK" "${M_DIR}/output/volFieldValue.dat"
              metric_require parse-output PARSE_FAILURE || return 1
              metric_values "$M_OUT" M_O_
              if (( M_O_REGION_LINES > 1 || M_O_CELLS_LINES > 1 || M_O_VOLUME_LINES > 1 || M_O_TIME_LINES > 1 )); then
                  metric_fail DUPLICATE_OUTPUT "the output has a duplicate header line"
                  return 1
              fi
              if (( M_O_ROWS > 1 )); then
                  metric_fail DUPLICATE_OUTPUT "the output has ${M_O_ROWS} data rows, not one"
                  return 1
              fi
              if (( M_O_REGION_LINES == 0 || M_O_CELLS_LINES == 0 || M_O_VOLUME_LINES == 0 || M_O_TIME_LINES == 0 || M_O_ROWS == 0 )); then
                  metric_fail PARSE_FAILURE "the output has no complete header or no data row"
                  return 1
              fi
              if [[ "$M_O_REGION" != "all region0" ]]; then
                  metric_fail PARSE_FAILURE "the output region is '${M_O_REGION}', not 'all region0'"
                  return 1
              fi
              if [[ "$M_O_COLUMNS" != "volAverage(m3MagU)" ]]; then
                  metric_fail PARSE_FAILURE "the output field is '${M_O_COLUMNS}', not 'volAverage(m3MagU)'"
                  return 1
              fi
              if [[ "$M_O_ROW_FIELDS" != 2 || "$M_O_ROW_TIME" != "$SELECTED_TIME" ]]; then
                  metric_fail PARSE_FAILURE "the output row is not time ${SELECTED_TIME} and one value: time '${M_O_ROW_TIME}', ${M_O_ROW_FIELDS} fields"
                  return 1
              fi
              if [[ ! "$M_O_CELLS" =~ ^[1-9][0-9]*$ ]]; then
                  metric_fail PARSE_FAILURE "the output cell count '${M_O_CELLS}' is not a positive integer"
                  return 1
              fi
              if metric_non_finite "$M_O_VOLUME" || [[ ! "$M_O_VOLUME" =~ $METRIC_NUMBER_RE || "$M_O_VOLUME" == -* ]] \
                 || metric_is_zero "$M_O_VOLUME"; then
                  metric_fail INVALID_VOLUME "the output total volume '${M_O_VOLUME}' is not a finite positive number"
                  return 1
              fi
              if metric_non_finite "$M_O_ROW_VALUE"; then
                  metric_fail NON_FINITE_VALUE "the output mean speed '${M_O_ROW_VALUE}' is not finite"
                  return 1
              fi
              if [[ ! "$M_O_ROW_VALUE" =~ $METRIC_NUMBER_RE ]]; then
                  metric_fail PARSE_FAILURE "the output mean speed '${M_O_ROW_VALUE}' is not a number"
                  return 1
              fi
              if [[ "$M_O_ROW_VALUE" == -* ]] && ! metric_is_zero "$M_O_ROW_VALUE"; then
                  metric_fail NEGATIVE_VALUE "the output mean speed '${M_O_ROW_VALUE}' is negative"
                  return 1
              fi
              metric_op numbers WORK awk "$METRIC_NUMBERS_AWK" "$M_O_ROW_VALUE" "$M_O_VOLUME"
              metric_require numbers PARSE_FAILURE || return 1
              metric_values "$M_OUT" M_N_
              if [[ "${M_N_VOLUME_FINITE_POSITIVE:-}" != YES ]]; then
                  metric_fail INVALID_VOLUME "the output total volume '${M_O_VOLUME}' does not convert to a finite positive double"
                  return 1
              fi
              if [[ "${M_N_SPEED_FINITE:-}" != YES ]]; then
                  metric_fail NON_FINITE_VALUE "the output mean speed '${M_O_ROW_VALUE}' does not convert to a finite double"
                  return 1
              fi
              return 0
          }

          # metric_work - the source, environment, selection, snapshot, calculation,
          # output, and input checks, in order. The first failure ends the work.
          metric_work() {
              local line="" same
              M_POINT=admission
              if (( M_END_MS - METRIC_CLEANUP_MS - $(metric_now_ms) <= METRIC_KILL_GRACE_MS + METRIC_STOP_RESERVE_MS )); then
                  metric_fail TIMEOUT "no time was left for the metric collection, which must end by ${M_END_MS} ms with ${METRIC_CLEANUP_MS} ms kept for the cleanup"
                  return 1
              fi
              M_POINT=source
              metric_source || return 1
              M_RECORD="bash -c <mktemp -d ${RUNNER_TEMP}/m3-metric-collection.XXXXXXXX; mkdir case config logs>"
              metric_op task-directory WORK bash -c "$METRIC_TASK_SCRIPT" task-directory "$RUNNER_TEMP"
              { IFS= read -r line < "$M_OUT"; } 2>/dev/null || true
              if [[ "$line" == "${RUNNER_TEMP}/m3-metric-collection."* ]]; then
                  TASK_TEMP="$line"
              fi
              metric_require task-directory COMMAND_FAILURE || return 1
              if [[ -z "$TASK_TEMP" ]]; then
                  metric_fail COMMAND_FAILURE "the unique task directory under RUNNER_TEMP cannot be created"
                  return 1
              fi
              CASE_DIR="${TASK_TEMP}/case"
              M_LOG_DIR="${TASK_TEMP}/logs"
              M_POINT=environment
              metric_identity || return 1
              M_POINT=selection
              metric_selection || return 1
              M_POINT=snapshot
              metric_inputs || return 1
              metric_manifest manifest-source "$SOURCE_FLOW_CASE" "${M_DIR}/source-before.tsv" || return 1
              metric_task_bytes task-bytes-before-copy || return 1
              # The file allowance of the copy must be positive, or no copy starts.
              if (( METRIC_MAX_TASK_BYTES - M_TASK_LAST <= 0 )); then
                  metric_fail RESOURCE_LIMIT "the task directory has ${M_TASK_LAST} bytes before the copy, so no file allowance is left below ${METRIC_MAX_TASK_BYTES}"
                  return 1
              fi
              M_FSIZE=$(( METRIC_MAX_TASK_BYTES - M_TASK_LAST ))
              M_COPY_FSIZE="$M_FSIZE"
              M_RECORD="cp --parents -- <${#M_FILES[@]} input files> ${CASE_DIR}"
              metric_op copy WORK bash -c 'cd -- "$1" || exit 1; target="$2"; shift 2; exec cp --parents -- "$@" "$target"' \
                  copy "$SOURCE_FLOW_CASE" "$CASE_DIR" "${M_FILES[@]}"
              metric_require copy COMMAND_FAILURE || return 1
              metric_task_bytes task-bytes-after-copy || return 1
              metric_manifest manifest-snapshot "$CASE_DIR" "${M_DIR}/snapshot-before.tsv" || return 1
              metric_compare compare-snapshot "${M_DIR}/source-before.tsv" "${M_DIR}/snapshot-before.tsv" && same=0 || same=$?
              if (( same == 1 )); then
                  metric_fail INPUT_CHANGED "the snapshot bytes differ from the source bytes before the calculation"
                  return 1
              fi
              (( same == 0 )) || return 1
              metric_op controls WORK awk "$METRIC_CONTROLS_AWK" "${CASE_DIR}/system/controlDict" "${CASE_DIR}/constant/turbulenceProperties"
              metric_require controls PARSE_FAILURE || return 1
              metric_values "$M_OUT" M_C_
              if [[ "${M_C_APPLICATION:-}" != simpleFoam || "${M_C_START_FROM:-}" != latestTime ]]; then
                  metric_fail SOURCE_MISMATCH "the copied controls are application '${M_C_APPLICATION:-}' and startFrom '${M_C_START_FROM:-}', not simpleFoam and latestTime"
                  return 1
              fi
              if [[ "${M_C_SIMULATION_TYPE:-}" != RAS || "${M_C_RAS_MODEL:-}" != kEpsilon ]]; then
                  metric_fail SOURCE_MISMATCH "the copied model is '${M_C_SIMULATION_TYPE:-}' '${M_C_RAS_MODEL:-}', not RAS kEpsilon; another model needs a new contract"
                  return 1
              fi
              printf '%s' "$METRIC_DICTIONARY" > "${TASK_TEMP}/config/metric-functions"
              metric_op dictionary WORK bash -c 'stat -c %s -- "$1" && sha256sum -- "$1"' dictionary "${TASK_TEMP}/config/metric-functions"
              metric_require dictionary COMMAND_FAILURE || return 1
              { read -r M_DICT_BYTES; read -r M_DICT_SHA _; } < "$M_OUT"
              printf '%s' "$METRIC_DICTIONARY" > "${M_DIR}/metric-functions"
              if [[ "$M_DICT_BYTES" != 636 || "$M_DICT_SHA" != "$METRIC_DICTIONARY_SHA256" ]]; then
                  metric_fail COMMAND_FAILURE "the metric dictionary is not the approved 636-byte dictionary"
                  return 1
              fi
              metric_task_bytes task-bytes-before-calculation || return 1
              if [[ -e "${CASE_DIR}/postProcessing" || -L "${CASE_DIR}/postProcessing" ]]; then
                  metric_fail SOURCE_MISMATCH "the snapshot has a postProcessing entry before the calculation"
                  return 1
              fi
              M_POINT=calculation
              # The file allowance of the calculation must be positive, or no
              # calculation starts.
              if (( METRIC_MAX_TASK_BYTES - M_TASK_LAST <= 0 )); then
                  metric_fail RESOURCE_LIMIT "the task directory has ${M_TASK_LAST} bytes before the calculation, so no file allowance is left below ${METRIC_MAX_TASK_BYTES}"
                  return 1
              fi
              M_FSIZE=$(( METRIC_MAX_TASK_BYTES - M_TASK_LAST ))
              M_CALC_FSIZE="$M_FSIZE"
              metric_foam_op metric CALC simpleFoam -case "$CASE_DIR" -postProcess -time "$SELECTED_TIME" -fields '(U)' -dict "$TASK_TEMP/config/metric-functions"
              M_METRIC_VECTOR="$M_FOAM_RECORD"
              metric_require metric COMMAND_FAILURE || return 1
              metric_task_bytes task-bytes-after-calculation || return 1
              M_POINT=output
              metric_output || return 1
              M_POINT=inputs
              metric_manifest manifest-source-after "$SOURCE_FLOW_CASE" "${M_DIR}/source-after.tsv" || return 1
              metric_manifest manifest-snapshot-after "$CASE_DIR" "${M_DIR}/snapshot-after.tsv" || return 1
              metric_compare compare-source "${M_DIR}/source-before.tsv" "${M_DIR}/source-after.tsv" && same=0 || same=$?
              if (( same == 1 )); then
                  M_INPUTS_UNCHANGED=NO
                  metric_fail INPUT_CHANGED "a source input changed during the calculation"
                  return 1
              fi
              (( same == 0 )) || return 1
              metric_compare compare-snapshot-after "${M_DIR}/snapshot-before.tsv" "${M_DIR}/snapshot-after.tsv" && same=0 || same=$?
              if (( same == 1 )); then
                  M_INPUTS_UNCHANGED=NO
                  metric_fail INPUT_CHANGED "a snapshot input changed during the calculation"
                  return 1
              fi
              (( same == 0 )) || return 1
              M_INPUTS_UNCHANGED=YES
              metric_task_bytes task-bytes-final || return 1
              M_VALUE="$M_O_ROW_VALUE"
              return 0
          }

          # metric_retain_logs - copy the bounded logs of the task directory into the
          # evidence. A log above METRIC_LOG_LIMIT, or every log after the kept logs reach
          # METRIC_LOGS_LIMIT, stays out with its size and checksum, and the result fails.
          # A failed log inventory, log copy, or checksum of an excluded log also fails
          # the result; the logs that were copied stay in the evidence.
          metric_retain_logs() {
              local size name line total=0
              local -a keep=() drop=()
              [[ -n "$TASK_TEMP" && -d "${TASK_TEMP}/logs" ]] || return 0
              printf 'log\tbytes\tsha256\treason\n' > "${M_DIR}/excluded.tsv"
              metric_op log-sizes FINAL bash -c 'set -o pipefail; find "$1" -type f -printf "%s\t%f\n" | LC_ALL=C sort -t "$(printf "\t")" -k 2,2' \
                  log-sizes "${TASK_TEMP}/logs"
              if ! metric_require log-sizes COMMAND_FAILURE; then
                  M_LOGS_RETAINED="NO_${M_OUTCOME}"
                  return 0
              fi
              while IFS=$'\t' read -r size name; do
                  if (( size > METRIC_LOG_LIMIT )); then
                      drop+=("$name")
                      metric_fail RESOURCE_LIMIT "the log ${name} has ${size} bytes, above ${METRIC_LOG_LIMIT}"
                  elif (( total + size > METRIC_LOGS_LIMIT )); then
                      drop+=("$name")
                      metric_fail RESOURCE_LIMIT "the kept logs are above ${METRIC_LOGS_LIMIT} bytes together"
                  else
                      total=$(( total + size ))
                      keep+=("${TASK_TEMP}/logs/${name}")
                  fi
              done < "$M_OUT"
              M_LOG_BYTES="$total"
              if (( ${#keep[@]} > 0 )); then
                  metric_op copy-logs FINAL cp -- "${keep[@]}" "${M_DIR}/logs/"
                  if ! metric_require copy-logs COMMAND_FAILURE; then
                      M_LOGS_RETAINED="NO_${M_OUTCOME}"
                      return 0
                  fi
              fi
              if (( ${#drop[@]} > 0 )); then
                  metric_op hash-excluded FINAL bash -c '
                      cd -- "$1" || exit 1
                      shift
                      for f; do
                          size="$(stat -c %s -- "$f")" || exit 4
                          sum="$(sha256sum -- "$f")" || exit 5
                          printf "%s\t%s\t%s\tthe log is above a log limit\n" "$f" "$size" "${sum%% *}"
                      done' hash-excluded "${TASK_TEMP}/logs" "${drop[@]}"
                  if ! metric_require hash-excluded COMMAND_FAILURE; then
                      M_LOGS_RETAINED="PARTIAL_${M_OUTCOME}"
                      return 0
                  fi
                  while IFS= read -r line || [[ -n "$line" ]]; do
                      printf '%s\n' "$line"
                  done < "$M_OUT" >> "${M_DIR}/excluded.tsv"
                  M_LOGS_RETAINED=PARTIAL
                  return 0
              fi
              M_LOGS_RETAINED=YES
              return 0
          }

          # metric_check_refuse <reason> - keep the task directory for an incomplete or
          # refused process check.
          metric_check_refuse() {
              M_CLEANUP=REFUSED_PROCESS_CHECK
              metric_fail CLEANUP_FAILURE "$1, so the task directory stays"
              return 0
          }

          # metric_safe_path <path> - status 0 for an absolute path of slash-separated
          # [A-Za-z0-9_.-] components, none of them ".", "..", or option-like.
          metric_safe_path() {
              local part rest
              [[ "$1" =~ ^(/[A-Za-z0-9_.-]+)+$ ]] || return 1
              rest="${1#/}"
              while :; do
                  part="${rest%%/*}"
                  [[ "$part" != . && "$part" != .. && "$part" != -* ]] || return 1
                  [[ "$rest" == */* ]] || return 0
                  rest="${rest#*/}"
              done
          }

          # metric_hosted_runner - status 0 only on the approved ephemeral GitHub-hosted
          # ubuntu-24.04 runner: the runner identity of the job and the OS record. Real
          # elevation is refused everywhere else. Sets M_CHECK_REASON.
          metric_hosted_runner() {
              local item id="" version=""
              local -a lines=()
              { mapfile -t lines < "$METRIC_OS_RELEASE"; } 2> /dev/null || lines=()
              for item in "${lines[@]}"; do
                  case "$item" in
                      ID=*) id="${item#ID=}" ;;
                      VERSION_ID=*) version="${item#VERSION_ID=}" ;;
                  esac
              done
              id="${id//\"/}"
              version="${version//\"/}"
              if [[ "${GITHUB_ACTIONS:-}" == true && "${RUNNER_ENVIRONMENT:-}" == github-hosted && "${RUNNER_OS:-}" == Linux \
                    && "${ImageOS:-}" == ubuntu24 && "$id" == ubuntu && "$version" == 24.04 ]]; then
                  return 0
              fi
              M_CHECK_REASON="real elevation is limited to the GitHub-hosted ubuntu-24.04 runner: GITHUB_ACTIONS '${GITHUB_ACTIONS:-}', RUNNER_ENVIRONMENT '${RUNNER_ENVIRONMENT:-}', RUNNER_OS '${RUNNER_OS:-}', ImageOS '${ImageOS:-}', OS '${id} ${version}'"
              return 1
          }

          # metric_check_tools - the records of the executable check: one TOOL row for
          # each process-check executable, resolved to a regular root-owned executable
          # file that is not group- or world-writable, in a root-owned directory that is
          # not group- or world-writable; the source hash; and the clock tick rate. Sets
          # M_CHECK_SOURCE_SHA, M_CHECK_CLK, and M_CHECK_REASON (the first problem).
          metric_check_tools() {
              local kind tool target meta dir flag owner mode type dir_owner dir_mode
              local -A seen=()
              M_CHECK_REASON="" M_CHECK_CLK=""
              while IFS=$'\t' read -r kind tool target meta dir flag; do
                  case "$kind" in
                      SOURCE_SHA256) [[ "$tool" =~ ^[0-9a-f]{64}$ ]] && M_CHECK_SOURCE_SHA="$tool" ;;
                      CLK_TCK) [[ "$tool" =~ ^[1-9][0-9]{0,5}$ ]] && M_CHECK_CLK="$tool" ;;
                      TOOL)
                          seen[$tool]=$(( ${seen[$tool]:-0} + 1 ))
                          [[ -z "$M_CHECK_REASON" ]] || continue
                          if [[ "$target" == MISSING ]]; then
                              M_CHECK_REASON="the check executable is missing: ${tool}"
                              continue
                          fi
                          read -r owner mode type <<< "$meta"
                          read -r dir_owner dir_mode <<< "$dir"
                          if [[ "$target" != /* || "$type" != "regular file" ]]; then
                              M_CHECK_REASON="the check executable is not a regular file: ${tool} (${target})"
                          elif [[ "$owner" != 0 ]]; then
                              M_CHECK_REASON="the check executable is not owned by root: ${tool} (${target})"
                          elif [[ ! "$mode" =~ ^[0-7]{3,4}$ ]] || (( (8#$mode & 8#22) != 0 )); then
                              M_CHECK_REASON="the check executable is group- or world-writable: ${tool} (${target})"
                          elif [[ "$flag" != X ]]; then
                              M_CHECK_REASON="the check executable is not executable: ${tool} (${target})"
                          elif [[ "$dir_owner" != 0 || ! "$dir_mode" =~ ^[0-7]{3,4}$ ]] || (( (8#$dir_mode & 8#22) != 0 )); then
                              M_CHECK_REASON="the directory of the check executable is not root-owned, or it is group- or world-writable: ${tool} (${target})"
                          fi ;;
                  esac
              done < "${M_DIR}/process-check-tools.tsv"
              for tool in "${METRIC_CHECK_TOOLS[@]}"; do
                  if [[ -z "$M_CHECK_REASON" && "${seen[$tool]:-0}" != 1 ]]; then
                      M_CHECK_REASON="the executable check has no single record: ${tool}"
                  fi
              done
              if [[ -z "$M_CHECK_REASON" && "$M_CHECK_SOURCE_SHA" == UNAVAILABLE ]]; then
                  M_CHECK_REASON="the executable check has no SHA-256 of the fixed source"
              fi
              if [[ -z "$M_CHECK_REASON" && -z "$M_CHECK_CLK" ]]; then
                  M_CHECK_REASON="the executable check has no clock tick rate"
              fi
              [[ -z "$M_CHECK_REASON" ]]
          }

          # metric_proc_live <pid> <start> - status 0 when /proc/<pid> is a live process
          # with that start time, or when its stat file exists and cannot be read.
          metric_proc_live() {
              local line
              local -a fields=()
              [[ "$1" =~ ^[0-9]+$ ]] || return 1
              if ! { read -r line < "/proc/$1/stat"; } 2> /dev/null; then
                  [[ -e "/proc/$1/stat" ]]
                  return
              fi
              read -r -a fields <<< "${line##*") "}"
              [[ "${fields[19]:-}" == "$2" && "${fields[0]:-}" != Z && "${fields[0]:-}" != X ]]
          }

          # metric_check_frame <file> <return-cs> - validate the result frame of the
          # process check against the request, the launch and return times on the boot
          # clock, and the recorded operation groups. Each number is a decimal without a
          # leading zero, so no arithmetic reads it as octal. The terminal time is from
          # the launch time to the earlier of the return time and the absolute end; a
          # return time that is not known refuses the frame. Sets C_ENTRY, C_SCAN,
          # C_MPID, C_MSTART, C_EUID, C_CPID, C_CSTART, C_USERS, C_UNCERTAIN, C_OLDER,
          # and C_PROBLEM (empty for one complete valid frame). C_MPID is set for a valid
          # monitor record also in a frame with another problem.
          metric_check_frame() {
              local file="$1" back="$2" content="" line index=3 count expect group status ended
              local -a lines=()
              C_ENTRY="" C_SCAN="" C_MPID="" C_MSTART="" C_EUID="" C_CPID="" C_CSTART="" C_OLDER=0 C_PROBLEM=""
              C_USERS=() C_UNCERTAIN=()
              if IFS= read -r -d '' content < "$file"; then
                  C_PROBLEM="the frame has a NUL byte"
              elif [[ "$content" != *$'\n' ]]; then
                  C_PROBLEM="the frame is empty, or it does not end with a line end"
              fi
              if [[ ! "$back" =~ ^(0|[1-9][0-9]{0,11})$ ]]; then
                  C_PROBLEM="${C_PROBLEM:-the return time on the boot clock is not known}"
                  back=0
              fi
              { mapfile -t lines < "$file"; } 2> /dev/null || lines=()
              count="${#lines[@]}"
              if [[ "${lines[0]:-}" =~ ^LAUNCH\ 1\ ([A-Za-z0-9]+)\ (0|[1-9][0-9]{0,11})\ ([1-9][0-9]{0,2})$ \
                    && "${BASH_REMATCH[1]}" == "$CHECK_TOKEN" ]]; then
                  C_ENTRY="${BASH_REMATCH[2]}" C_SCAN="${BASH_REMATCH[3]}"
                  expect=$(( CHECK_END_BOOT_CS - C_ENTRY - 600 ))
                  (( expect <= 600 )) || expect=600
                  if (( C_ENTRY < M_CHECK_LAUNCH_CS || C_ENTRY > back || C_SCAN < 1 || C_SCAN != expect )); then
                      C_PROBLEM="${C_PROBLEM:-the launch time ${C_ENTRY} or the scan time ${C_SCAN} does not match the absolute end ${CHECK_END_BOOT_CS}}"
                  fi
              else
                  C_PROBLEM="${C_PROBLEM:-the launch record is missing, or it does not match the request}"
              fi
              if [[ "${lines[1]:-}" != "FRAME 1 ${CHECK_TOKEN} ${TASK_TEMP} ${ORIGINAL_RUNNER_UID} ${CHECK_END_BOOT_CS}" ]]; then
                  C_PROBLEM="${C_PROBLEM:-the frame record does not match the request: '$(metric_text "${lines[1]:-}")'}"
              fi
              if [[ "${lines[2]:-}" =~ ^MONITOR\ ([1-9][0-9]{0,9})\ ([1-9][0-9]{0,9})\ (0|[1-9][0-9]{0,19})\ (0|[1-9][0-9]{0,9})$ \
                    && "${BASH_REMATCH[1]}" == "${BASH_REMATCH[2]}" ]] && (( BASH_REMATCH[1] >= 2 )); then
                  C_MPID="${BASH_REMATCH[1]}" C_MSTART="${BASH_REMATCH[3]}" C_EUID="${BASH_REMATCH[4]}"
                  for group in "${M_GROUPS[@]}"; do
                      [[ "$group" == "$C_MPID" ]] && C_PROBLEM="${C_PROBLEM:-the monitor is a recorded operation group}"
                  done
                  if (( C_MSTART * 100 / M_CHECK_CLK + 1 < M_CHECK_LAUNCH_CS || C_MSTART * 100 / M_CHECK_CLK > back + 1 )); then
                      C_PROBLEM="${C_PROBLEM:-the monitor did not start during the check operation}"
                  fi
              else
                  C_PROBLEM="${C_PROBLEM:-the monitor record is missing, or it is not the leader of its own process group}"
              fi
              while (( index < count )); do
                  line="${lines[index]}"
                  case "$line" in
                      "MATCH /proc/"[0-9]*) C_USERS+=("${line#MATCH }") ;;
                      "UNCERTAIN "?*) C_UNCERTAIN+=("${line#UNCERTAIN }") ;;
                      "OLDER_UNREADABLE /proc/"[0-9]*) C_OLDER=$(( C_OLDER + 1 )) ;;
                      *) break ;;
                  esac
                  index=$(( index + 1 ))
              done
              if [[ "${lines[index]:-}" == SCAN_END ]]; then
                  index=$(( index + 1 ))
              else
                  C_PROBLEM="${C_PROBLEM:-the scan end record is missing, or an unknown record comes first: '$(metric_text "${lines[index]:-}")'}"
              fi
              if [[ "${lines[index]:-}" =~ ^CHILD\ ([1-9][0-9]{0,9})\ (0|[1-9][0-9]{0,19})$ ]]; then
                  C_CPID="${BASH_REMATCH[1]}" C_CSTART="${BASH_REMATCH[2]}"
                  index=$(( index + 1 ))
              else
                  C_PROBLEM="${C_PROBLEM:-the child record is missing or malformed}"
              fi
              if [[ "${lines[index]:-}" =~ ^END\ 1\ ([A-Za-z0-9]+)\ ([A-Z0-9_]+)\ (0|[1-9][0-9]{0,11})$ \
                    && "${BASH_REMATCH[1]}" == "$CHECK_TOKEN" ]]; then
                  status="${BASH_REMATCH[2]}" ended="${BASH_REMATCH[3]}"
                  [[ "$status" == COMPLETE ]] || C_PROBLEM="${C_PROBLEM:-the terminal record has the status ${status}}"
                  if [[ -z "$C_ENTRY" ]] || (( ended < C_ENTRY || ended > back || ended > CHECK_END_BOOT_CS )); then
                      C_PROBLEM="${C_PROBLEM:-the terminal time ${ended} is not from the launch time ${C_ENTRY:-UNAVAILABLE} to the earlier of the return time ${back} and the absolute end ${CHECK_END_BOOT_CS}}"
                  fi
                  (( index == count - 1 )) || C_PROBLEM="${C_PROBLEM:-a record follows the terminal record}"
              else
                  C_PROBLEM="${C_PROBLEM:-the terminal record is missing, or it does not match the request}"
              fi
              return 0
          }

          # metric_check_stopped - read-only proof from /proc metadata that the monitor,
          # its process group, and the recorded check child have stopped. The proof
          # takes at most 1000 ms and ends by the check end. Sets M_CHECK_STOPPED to YES
          # or NO, and C_ALIVE.
          metric_check_stopped() {
              local members until_ms
              until_ms=$(( $(metric_now_ms) + 1000 ))
              (( until_ms <= M_CHECK_END )) || until_ms="$M_CHECK_END"
              while :; do
                  C_ALIVE=""
                  if ! members="$(metric_group_members "$C_MPID")"; then
                      C_ALIVE=" group ${C_MPID} cannot be checked"
                  elif [[ -n "$members" ]]; then
                      C_ALIVE=" group ${C_MPID}: ${members//$'\n'/ }"
                  fi
                  if metric_proc_live "$C_MPID" "$C_MSTART"; then
                      C_ALIVE="${C_ALIVE} monitor ${C_MPID}"
                  fi
                  if [[ -n "$C_CPID" ]] && metric_proc_live "$C_CPID" "$C_CSTART"; then
                      C_ALIVE="${C_ALIVE} child ${C_CPID}"
                  fi
                  if [[ -z "$C_ALIVE" ]]; then
                      M_CHECK_STOPPED=YES
                      return 0
                  fi
                  (( $(metric_now_ms) + 150 < until_ms )) || break
                  sleep 0.1
              done
              M_CHECK_STOPPED=NO
              return 1
          }

          # metric_process_check - the read-only process check of the task directory
          # (contract 6084196797, Section 4), inside the check part of the cleanup. The
          # unprivileged checks come first: the original runner UID, the hosted runner,
          # RUNNER_TEMP, the time left, and the executables. Then the one admitted
          # vector runs the fixed source as root. Its frame, the monitor identity, and
          # the stop of the monitor group and the check child are verified from /proc
          # metadata. Status 0 only for a complete valid frame, a known return time on
          # the boot clock, a verified stop, and no user or uncertain process;
          # otherwise the task directory stays.
          metric_process_check() {
              local left up="" rest back="" now first=""
              if [[ ! "$ORIGINAL_RUNNER_UID" =~ ^[1-9][0-9]{0,9}$ || "$UID" != "$ORIGINAL_RUNNER_UID" \
                    || "$EUID" != "$ORIGINAL_RUNNER_UID" ]]; then
                  metric_check_refuse "the original runner UID '${ORIGINAL_RUNNER_UID}' is not the nonzero real and effective UID (${UID}, ${EUID})"
                  return 1
              fi
              if ! metric_hosted_runner; then
                  metric_check_refuse "$M_CHECK_REASON"
                  return 1
              fi
              if ! metric_safe_path "$RUNNER_TEMP"; then
                  metric_check_refuse "RUNNER_TEMP '$(metric_text "$RUNNER_TEMP")' is not a safe absolute path"
                  return 1
              fi
              if ! ( cd -P -- "$RUNNER_TEMP" 2> /dev/null && [[ "$PWD" == "$RUNNER_TEMP" ]] ); then
                  metric_check_refuse "RUNNER_TEMP '${RUNNER_TEMP}' is not a canonical path"
                  return 1
              fi
              if [[ ! "$M_BOOT_CS" =~ ^(0|[1-9][0-9]{0,11})$ ]]; then
                  metric_check_refuse "the boot time of the metric start is not valid"
                  return 1
              fi
              # The check needs a positive scan time, the 5000 ms TERM grace, and the
              # 1000 ms stop verification before its end.
              left=$(( M_CHECK_END - $(metric_now_ms) ))
              if (( left <= METRIC_KILL_GRACE_MS + METRIC_STOP_RESERVE_MS )); then
                  metric_check_refuse "the cleanup reserve leaves ${left} ms for the process check, not more than $(( METRIC_KILL_GRACE_MS + METRIC_STOP_RESERVE_MS )) ms"
                  return 1
              fi
              M_OP_END="$M_CHECK_END"
              M_OUT_FILE="${M_DIR}/process-check-tools.tsv"
              M_ERR_FILE="${M_DIR}/process-check-tools.err"
              M_RECORD="bash -c <process-check executables and source hash> <${#METRIC_CHECK_TOOLS[@]} installed executables>"
              metric_op process-check-tools CLEANUP bash -c "$METRIC_TOOLS_SCRIPT" tools "$METRIC_ROOT_CHECK_SOURCE" \
                  "${METRIC_CHECK_TOOLS[@]}"
              M_OUT_FILE=""
              M_ERR_FILE=""
              if [[ "$M_OUTCOME" != COMPLETED ]]; then
                  metric_check_refuse "the executable check ended with ${M_OUTCOME}, status ${M_STATUS}"
                  return 1
              fi
              if ! metric_check_tools; then
                  metric_check_refuse "$M_CHECK_REASON"
                  return 1
              fi
              left=$(( M_CHECK_END - $(metric_now_ms) ))
              if (( left <= METRIC_KILL_GRACE_MS + METRIC_STOP_RESERVE_MS )); then
                  metric_check_refuse "the cleanup reserve leaves ${left} ms for the process check, not more than $(( METRIC_KILL_GRACE_MS + METRIC_STOP_RESERVE_MS )) ms"
                  return 1
              fi
              # The absolute check end on the boot clock, from the same end in ms. A read
              # that fails gives no time, also when it set a valid first field.
              { read -r up rest < /proc/uptime; } 2> /dev/null || up=""
              now="$(metric_now_ms)"
              if [[ ! "$up" =~ ^[0-9]{1,10}[.][0-9]{2}$ ]]; then
                  metric_check_refuse "the boot clock cannot be read"
                  return 1
              fi
              M_CHECK_LAUNCH_CS=$(( 10#${up/./} ))
              CHECK_END_BOOT_CS=$(( M_CHECK_LAUNCH_CS + (M_CHECK_END - now) / 10 ))
              CHECK_TOKEN="${TASK_TEMP##*.}${now}"
              M_CHECK_TOKEN="$CHECK_TOKEN"
              if (( M_BOOT_CS >= CHECK_END_BOOT_CS )); then
                  metric_check_refuse "the boot time of the metric start is not before the check end"
                  return 1
              fi
              M_CHECK_RESULT=INCOMPLETE
              M_OP_END="$M_CHECK_END"
              M_OUT_FILE="${M_DIR}/process-check.txt"
              M_ERR_FILE="${M_DIR}/process-check.err"
              metric_op process-check CLEANUP /usr/bin/sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C \
                  /usr/bin/bash --noprofile --norc -p -c "$METRIC_ROOT_CHECK_SOURCE" \
                  m3-process-check "$TASK_TEMP" "$RUNNER_TEMP" "$ORIGINAL_RUNNER_UID" "$M_BOOT_CS" "$CHECK_END_BOOT_CS" "$CHECK_TOKEN"
              M_OUT_FILE=""
              M_ERR_FILE=""
              # The return time on the boot clock. A failed read leaves it empty, also
              # when it set a valid first field, and the check fails; no other time
              # takes its place.
              up=""
              { read -r up rest < /proc/uptime; } 2> /dev/null || up=""
              if [[ "$up" =~ ^[0-9]{1,10}[.][0-9]{2}$ ]]; then
                  back=$(( 10#${up/./} ))
              fi
              { IFS= read -r first < "${M_DIR}/process-check.err"; } 2> /dev/null || true
              metric_check_frame "${M_DIR}/process-check.txt" "$back"
              M_CHECK_ENTRY="${C_ENTRY:-UNAVAILABLE}"
              M_CHECK_SCAN="${C_SCAN:-UNAVAILABLE}"
              M_OLDER_UNREADABLE="$C_OLDER"
              if [[ -n "$C_MPID" ]]; then
                  M_CHECK_MONITOR="${C_MPID} ${C_MPID} ${C_MSTART} ${C_EUID}"
                  M_CHECK_CHILD="${C_CPID:-UNAVAILABLE} ${C_CSTART:-UNAVAILABLE}"
                  metric_check_stopped || true
              fi
              if [[ "$M_CHECK_STOPPED" == NO ]]; then
                  metric_check_refuse "the process check monitor or its group did not stop:${C_ALIVE}"
                  return 1
              fi
              if [[ "$M_OUTCOME" != COMPLETED ]]; then
                  metric_check_refuse "the process check ended with ${M_OUTCOME}, status ${M_STATUS}${first:+: $(metric_text "$first")}"
                  return 1
              fi
              if [[ -z "$back" ]]; then
                  metric_check_refuse "the boot clock cannot be read after the process check"
                  return 1
              fi
              if [[ -n "$C_PROBLEM" ]]; then
                  metric_check_refuse "the process check result is not one complete valid frame: ${C_PROBLEM}"
                  return 1
              fi
              if (( ${#C_USERS[@]} > 0 )); then
                  M_CHECK_RESULT=MATCH
                  M_CLEANUP=REFUSED_PROCESS_ACTIVE
                  metric_fail CLEANUP_FAILURE "a process still uses the task directory: ${C_USERS[*]:0:3}"
                  return 1
              fi
              if (( ${#C_UNCERTAIN[@]} > 0 )); then
                  M_CHECK_RESULT=UNCERTAIN
                  metric_check_refuse "the process check of the task directory is not complete for ${#C_UNCERTAIN[@]} runner-UID processes (${C_OLDER} started before the metric): ${C_UNCERTAIN[0]}"
                  return 1
              fi
              M_CHECK_RESULT=COMPLETE
              return 0
          }

          # metric_cleanup - remove only the verified unique task directory, inside one
          # absolute cleanup end: the earlier of the cleanup entry plus 20000 ms and the
          # metric end. Every recorded process group must be empty, and the read-only
          # process check (metric_process_check) must end in its part of the cleanup
          # with no process that uses the directory. Then the original unprivileged
          # runner user checks the path again and removes it. An uncertain path or
          # process state keeps the directory.
          metric_cleanup() {
              local group name
              if [[ -z "$TASK_TEMP" ]]; then
                  M_CLEANUP=NOT_NEEDED
                  return 0
              fi
              M_POINT=cleanup
              M_LOG_DIR="${M_DIR}/logs"
              M_CLEANUP_START="$(metric_now_ms)"
              M_CLEANUP_END=$(( M_CLEANUP_START + METRIC_CLEANUP_MS ))
              if (( M_END_MS < M_CLEANUP_END )); then
                  M_CLEANUP_END="$M_END_MS"
              fi
              M_CHECK_END=$(( M_CLEANUP_START + METRIC_CHECK_MS ))
              if (( M_CLEANUP_END - METRIC_REMOVE_MS < M_CHECK_END )); then
                  M_CHECK_END=$(( M_CLEANUP_END - METRIC_REMOVE_MS ))
              fi
              for group in "${M_GROUPS[@]}"; do
                  if ! metric_group_empty "$group"; then
                      M_CLEANUP=REFUSED_PROCESS_ACTIVE
                      metric_fail CLEANUP_FAILURE "process group ${group} of a metric operation still has a process, so the task directory stays"
                      return 0
                  fi
              done
              name="${TASK_TEMP#"${RUNNER_TEMP}/"}"
              if [[ "$name" == "$TASK_TEMP" || ! "$name" =~ ^m3-metric-collection\.[A-Za-z0-9]{8}$ \
                    || ! -d "$TASK_TEMP" || -L "$TASK_TEMP" ]]; then
                  M_CLEANUP=REFUSED_UNEXPECTED_PATH
                  metric_fail CLEANUP_FAILURE "the task directory '${TASK_TEMP}' is not one unique directory under RUNNER_TEMP"
                  return 0
              fi
              metric_process_check || return 0
              # The check operations are recorded groups too: all must be empty.
              for group in "${M_GROUPS[@]}"; do
                  if ! metric_group_empty "$group"; then
                      M_CLEANUP=REFUSED_PROCESS_ACTIVE
                      metric_fail CLEANUP_FAILURE "process group ${group} of a metric operation still has a process after the process check, so the task directory stays"
                      return 0
                  fi
              done
              # The unprivileged path recheck, as the original runner user.
              if [[ "$UID" != "$ORIGINAL_RUNNER_UID" || "$EUID" != "$ORIGINAL_RUNNER_UID" || "$name" != "${TASK_TEMP#"${RUNNER_TEMP}/"}" \
                    || ! -d "$TASK_TEMP" || -L "$TASK_TEMP" ]]; then
                  M_CLEANUP=REFUSED_UNEXPECTED_PATH
                  metric_fail CLEANUP_FAILURE "the task directory '${TASK_TEMP}' is not the checked directory of the runner user before the removal"
                  return 0
              fi
              M_OP_END="$M_CLEANUP_END"
              metric_op remove CLEANUP rm -rf -- "$TASK_TEMP"
              if [[ "$M_OUTCOME" == COMPLETED && ! -e "$TASK_TEMP" ]]; then
                  M_CLEANUP=REMOVED
              else
                  if [[ "$M_OUTCOME" == FAILED ]]; then
                      M_CLEANUP="FAILED_STATUS_${M_STATUS}"
                  else
                      M_CLEANUP="FAILED_${M_OUTCOME}"
                  fi
                  metric_fail CLEANUP_FAILURE "the removal of the task directory ended with ${M_OUTCOME}, status ${M_STATUS}"
              fi
              return 0
          }

          # metric_finish - the inventory, the evidence limit, the verdict, and the
          # capture note of a failed attempt.
          metric_finish() {
              local verdict=UNAVAILABLE code reason total="" kind value
              M_POINT=evidence
              M_OUT_FILE="${M_DIR}/inventory.txt"
              M_ERR_FILE=/dev/null
              metric_op inventory FINAL bash -c "$METRIC_INVENTORY_SCRIPT" inventory "$M_DIR"
              M_OUT_FILE=""
              M_ERR_FILE=""
              if [[ "$M_OUTCOME" == COMPLETED ]]; then
                  M_INVENTORY=COMPLETE
                  while IFS=$'\t' read -r kind value _; do
                      if [[ "$kind" == TOTAL ]]; then
                          total="$value"
                      fi
                  done < "${M_DIR}/inventory.txt"
                  M_EVIDENCE_BYTES="${total:-UNAVAILABLE}"
                  if [[ ! "$total" =~ ^[0-9]+$ ]] || (( total + 65536 > METRIC_EVIDENCE_LIMIT )); then
                      metric_fail RESOURCE_LIMIT "the metric evidence has ${total:-an unknown number of} bytes, above ${METRIC_EVIDENCE_LIMIT} less 65536 for the result"
                  fi
              else
                  M_INVENTORY="UNAVAILABLE_${M_OUTCOME}"
                  metric_require "evidence inventory" COMMAND_FAILURE || true
              fi
              if [[ -z "$M_CODE" ]]; then
                  verdict=AVAILABLE
                  code=NONE
                  reason="the exact v2512 command gives ${M_VALUE} m/s at time ${SELECTED_TIME} for ${M_O_CELLS} cells and ${M_O_VOLUME} m3; the inputs did not change and the task directory is removed"
              else
                  code="$M_CODE"
                  reason="$M_REASON"
              fi
              metric_write_result "$verdict" "$code" "$reason"
              if [[ "$verdict" != AVAILABLE ]]; then
                  capture_note "M3 mean speed: ${code}: $(metric_text "$reason")"
              fi
              echo "m3 mean speed: ${verdict} ${code}: $(metric_text "$reason")"
              return 0
          }

          # metric_collect - the complete collection. A failed or stopped product run
          # gives NOT_ATTEMPTED, and no metric command runs.
          metric_collect() {
              local uptime=""
              M_DIR="${EVIDENCE_DIR}/m3-mean-speed"
              mkdir -p "$M_DIR" "${M_DIR}/output" "${M_DIR}/logs"
              M_CODE="" M_REASON="" M_POINT=product M_FAIL_POINT=NONE M_SEQ=0 M_RECORD="" M_FOAM_RECORD=""
              M_FSIZE="" M_FILE_LIMIT="$METRIC_OP_FILE_LIMIT" M_TASK_LAST=0 M_COPY_FSIZE=UNAVAILABLE M_CALC_FSIZE=UNAVAILABLE
              M_OLDER_UNREADABLE=UNAVAILABLE M_OP_END=""
              M_CLEANUP_START=UNAVAILABLE M_CLEANUP_END=UNAVAILABLE M_CHECK_END=UNAVAILABLE M_CHECK_RESULT=NOT_RUN
              M_CHECK_SOURCE_SHA=UNAVAILABLE M_CHECK_TOKEN=UNAVAILABLE M_CHECK_LAUNCH_CS=UNAVAILABLE M_CHECK_ENTRY=UNAVAILABLE
              M_CHECK_SCAN=UNAVAILABLE M_CHECK_MONITOR=UNAVAILABLE M_CHECK_CHILD=UNAVAILABLE M_CHECK_STOPPED=UNAVAILABLE
              M_CHECK_CLK="" M_CHECK_REASON="" CHECK_END_BOOT_CS=UNAVAILABLE CHECK_TOKEN=""
              # The original runner UID, before any elevation: the selector of the
              # process check. It stays read-only; root's UID never replaces it.
              if [[ "$(declare -p ORIGINAL_RUNNER_UID 2> /dev/null)" != "declare -r ORIGINAL_RUNNER_UID=\"${UID}\"" ]]; then
                  ORIGINAL_RUNNER_UID="$UID"
                  readonly ORIGINAL_RUNNER_UID
              fi
              M_OUT_FILE="" M_ERR_FILE="" M_OUT="" M_ERR="" M_LOG_DIR="$M_DIR"
              M_SELECT_USED=0 M_CALC_USED=0 M_WORK_USED=0 M_CLEANUP_USED=0
              M_GROUPS=() M_FILES=()
              M_STOP=EMPTY M_OUTCOME=NOT_STARTED M_STATUS=124 M_GROUP=- M_LIMIT=0 M_ELAPSED=0
              M_CLEANUP=NOT_NEEDED M_VALUE=UNAVAILABLE
              SOURCE_FLOW_CASE="${GITHUB_WORKSPACE}/src/batch_9/case_7/flow"
              TASK_TEMP="" CASE_DIR="" SELECTED_TIME=UNAVAILABLE
              M_POST_TIME=UNAVAILABLE M_SELECTION_VECTOR=UNAVAILABLE M_METRIC_VECTOR=UNAVAILABLE
              M_DICT_BYTES=UNAVAILABLE M_DICT_SHA=UNAVAILABLE
              M_INPUT_FILES=UNAVAILABLE M_INPUT_BYTES=UNAVAILABLE M_INPUTS_UNCHANGED=UNAVAILABLE M_TASK_BYTES=UNAVAILABLE
              M_OUTPUT_PATH=UNAVAILABLE M_OUTPUT_SHA=UNAVAILABLE
              M_O_ROW_TIME=UNAVAILABLE M_O_REGION=UNAVAILABLE M_O_COLUMNS=UNAVAILABLE M_O_CELLS=UNAVAILABLE
              M_O_VOLUME=UNAVAILABLE M_O_ROW_VALUE=UNAVAILABLE
              M_LOGS_RETAINED=NO M_LOG_BYTES=0 M_EVIDENCE_BYTES=UNAVAILABLE M_INVENTORY=UNAVAILABLE
              M_START_MS="$(metric_now_ms)"
              # The boot time of the start in centiseconds, for the process check. An
              # unreadable value gives 0: every runner-UID process is then relevant.
              { read -r uptime _ < /proc/uptime; } 2>/dev/null || true
              if [[ "$uptime" =~ ^[0-9]+[.][0-9]{2}$ ]]; then
                  M_BOOT_CS=$(( 10#${uptime//./} ))
              else
                  M_BOOT_CS=0
              fi
              M_END_MS=$(( M_START_MS + METRIC_TOTAL_MS ))
              if (( (CAPTURE_WORK_END - 10) * 1000 < M_END_MS )); then
                  M_END_MS=$(( (CAPTURE_WORK_END - 10) * 1000 ))
              fi
              printf 'seq\tlabel\tclass\tlimit_ms\tfile_limit_bytes\tstart_ms\tend_ms\tstatus\toutcome\tgroup\tlog\tvector\n' \
                  > "${M_DIR}/commands.tsv"
              printf 'label\tbytes\ttime_ms\n' > "${M_DIR}/task-bytes.tsv"
              metric_write_result UNAVAILABLE NOT_COMPLETED "the metric collection did not reach its end"
              if [[ "${PREPARE_RESULT:-}" != SUCCEEDED || "${OVERALL_RESULT:-}" != SUCCEEDED ]]; then
                  M_CODE=NOT_ATTEMPTED
                  M_REASON="the product run did not succeed (PREPARE_RESULT=${PREPARE_RESULT:-NOT_ATTEMPTED}, OVERALL_RESULT=${OVERALL_RESULT:-NOT_ATTEMPTED}); no metric command ran"
                  metric_write_result UNAVAILABLE "$M_CODE" "$M_REASON"
                  echo "m3 mean speed: UNAVAILABLE NOT_ATTEMPTED"
                  return 0
              fi
              metric_work || true
              metric_retain_logs
              metric_cleanup
              metric_finish
              return 0
          }
          # ---- M3 mean speed: end ----

          # The metric work comes after all other capture items, so it cannot
          # delay them, and it ends 10 seconds before the capture work limit.
          metric_collect

          # An incomplete item gives status 4, so the step never reports a
          # complete capture after a skipped or stopped operation.
          if [[ -s "$notes_file" ]]; then
              exit 4
          fi
          exit 0
          CAPTURE_WORK
          bash -n "$CAPTURE_WORK_SCRIPT"

          # capture_finish <result> <reason> - publish the capture result.
          capture_finish() {
              local result="$1" reason="$2"
              reason="$(printf '%s' "$reason" | tr '\r\n' '  ')"
              {
                echo "CAPTURE_RESULT=${result}"
                echo "CAPTURE_REASON=${reason}"
              } > "$capture_result_file"
              cat "$capture_result_file" >> "$GITHUB_ENV"
              cat "$capture_result_file"
          }

          # capture_fill_unavailable <file> <line> - keep a missing evidence
          # file explicit after an incomplete capture.
          capture_fill_unavailable() {
              [[ -s "$1" ]] || printf '%s\n' "$2" > "$1"
          }

          grace=5
          available=$(( work_budget - grace ))
          if (( available <= 0 )); then
              capture_result=SKIPPED_NO_BUDGET
              capture_reason="no capture work budget: the work limit ${work_end} is ${work_budget} seconds after capture start ${capture_start}; the optional capture did not run"
          elif [[ ! -f "${LIB:-}" ]]; then
              capture_result=FAILED
              capture_reason="the bounded-runner library is not available, so the optional capture did not run"
          else
              # shellcheck disable=SC1090
              source "$LIB"
              export EVIDENCE_DIR GITHUB_WORKSPACE
              export CAPTURE_WORK_END="$work_end"
              : > "${EVIDENCE_DIR}/capture-work-notes.txt"
              run_bounded "${EVIDENCE_DIR}/capture_work_status.txt" \
                          "${EVIDENCE_DIR}/capture-work-timeout.log" \
                          "$grace" "$available" \
                  bash "$CAPTURE_WORK_SCRIPT"
              work_result="$(classify_result "${EVIDENCE_DIR}/capture_work_status.txt" \
                                             "${EVIDENCE_DIR}/capture-work-timeout.log")"
              first_note="$(head -n 1 -- "${EVIDENCE_DIR}/capture-work-notes.txt" 2>/dev/null || true)"
              case "$work_result" in
                  SUCCEEDED)
                      capture_result=COMPLETE
                      capture_reason="all capture work completed within ${work_budget} seconds"
                      ;;
                  FAILED_EXIT_4)
                      capture_result=INCOMPLETE
                      capture_reason="${first_note:-a capture item did not complete}"
                      ;;
                  BUDGET_EXCEEDED)
                      capture_result=TIMED_OUT
                      capture_reason="the capture work was stopped at the work limit of ${available} seconds (${work_limit_source})"
                      ;;
                  FAILED_EXIT_*)
                      capture_result=FAILED
                      capture_reason="the capture work ended with status ${work_result#FAILED_EXIT_}${first_note:+; ${first_note}}"
                      ;;
                  *)
                      capture_result=FAILED
                      capture_reason="the capture work recorded no status"
                      ;;
              esac
          fi

          if [[ "$capture_result" != COMPLETE ]]; then
              capture_fill_unavailable "${EVIDENCE_DIR}/stage-summary-lines.txt" \
                  "UNAVAILABLE: ${capture_result}: ${capture_reason}"
              capture_fill_unavailable "${EVIDENCE_DIR}/batch-workspace-tree.txt" \
                  "UNAVAILABLE: ${capture_result}: ${capture_reason}"
              vtu_manifest="${EVIDENCE_DIR}/vtu-point-data.txt"
              if ! grep -q '^VTU_EVIDENCE=' "$vtu_manifest" 2>/dev/null; then
                  {
                    echo
                    echo "VTU_EVIDENCE=UNAVAILABLE"
                    echo "VTU_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                    echo "VTU_REQUIRED_FIELDS_VERDICT=UNAVAILABLE"
                  } >> "$vtu_manifest"
              fi
              if ! grep -q '^MESH_QUALITY_VERDICT=' "${EVIDENCE_DIR}/mesh-quality.txt" 2>/dev/null; then
                  {
                    echo
                    echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                    echo "MESH_QUALITY_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                  } >> "${EVIDENCE_DIR}/mesh-quality.txt"
              fi
              if ! grep -q '^CONVERGENCE_VERDICT=' "${EVIDENCE_DIR}/convergence.txt" 2>/dev/null; then
                  {
                    echo
                    echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                    echo "CONVERGENCE_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                  } >> "${EVIDENCE_DIR}/convergence.txt"
              fi
          fi

          # The mean-speed result. A capture that stops before the metric work,
          # or during it, keeps UNAVAILABLE with an exact reason, and an outer
          # stop can never give AVAILABLE.
          metric_result="${EVIDENCE_DIR}/m3-mean-speed/result.env"
          if ! grep -q '^MEAN_SPEED_VERDICT=' "$metric_result" 2>/dev/null; then
              mkdir -p "${EVIDENCE_DIR}/m3-mean-speed"
              {
                echo "MEAN_SPEED_VERDICT=UNAVAILABLE"
                echo "MEAN_SPEED_REASON_CODE=NOT_COMPLETED"
                echo "MEAN_SPEED_REASON=the capture did not reach the metric work: ${capture_result}: ${capture_reason//|//}"
                echo "MEAN_SPEED_VALUE=UNAVAILABLE"
              } >> "$metric_result"
          fi

          # The evidence verdicts, for the job summary. Each is separate from the
          # capture result and from the product result.
          evidence_verdict() {
              local value
              value="$(sed -n "s/^${2}=//p" "$1" 2>/dev/null | tail -n 1 || true)"
              printf '%s\n' "${value:-UNAVAILABLE}"
          }
          {
            echo "VTU_REQUIRED_FIELDS_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/vtu-point-data.txt" VTU_REQUIRED_FIELDS_VERDICT)"
            echo "MESH_QUALITY_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/mesh-quality.txt" MESH_QUALITY_VERDICT)"
            echo "CONVERGENCE_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/convergence.txt" CONVERGENCE_VERDICT)"
            echo "MEAN_SPEED_VERDICT=$(evidence_verdict "$metric_result" MEAN_SPEED_VERDICT)"
            echo "MEAN_SPEED_REASON_CODE=$(evidence_verdict "$metric_result" MEAN_SPEED_REASON_CODE)"
            echo "MEAN_SPEED_REASON=$(evidence_verdict "$metric_result" MEAN_SPEED_REASON)"
            echo "MEAN_SPEED_VALUE=$(evidence_verdict "$metric_result" MEAN_SPEED_VALUE)"
          } | tee -a "$GITHUB_ENV"
          if [[ -f "${EVIDENCE_DIR}/vtu-point-data.txt" ]]; then
              cat "${EVIDENCE_DIR}/vtu-point-data.txt"
          fi
          capture_finish "$capture_result" "$capture_reason"

      - name: Write the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## OpenFOAM v2512 evidence run"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| OpenFOAM baseline | \`${OPENFOAM_BASELINE:-UNAVAILABLE}\` |"
            echo "| Baseline phase | \`${BASELINE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| OpenFOAM version | \`${OPENFOAM_VERSION:-UNAVAILABLE}\` |"
            echo "| Checkout phase | \`${CHECKOUT_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Installation phase | \`${INSTALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Preparation phase | \`${PREPARE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Orchestrator started | \`${ORCHESTRATOR_STARTED:-false}\` |"
            echo "| Wrapper status | \`${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}\` |"
            echo "| Overall result | \`${OVERALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Capture start | \`${CAPTURE_START:-UNAVAILABLE}\` |"
            echo "| Capture deadline | \`${CAPTURE_DEADLINE:-UNAVAILABLE}\` |"
            echo "| Capture result | \`${CAPTURE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Capture reason | ${CAPTURE_REASON:-UNAVAILABLE} |"
            echo "| VTU required fields | \`${VTU_REQUIRED_FIELDS_VERDICT:-UNAVAILABLE}\` |"
            echo "| Mesh quality | \`${MESH_QUALITY_VERDICT:-UNAVAILABLE}\` |"
            echo "| Convergence | \`${CONVERGENCE_VERDICT:-UNAVAILABLE}\` |"
            echo "| Mean speed | \`${MEAN_SPEED_VERDICT:-UNAVAILABLE}\` |"
            echo "| Mean speed reason | \`${MEAN_SPEED_REASON_CODE:-UNAVAILABLE}\` ${MEAN_SPEED_REASON:-UNAVAILABLE} |"
            echo "| Mean speed (m/s) | ${MEAN_SPEED_VALUE:-UNAVAILABLE} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam-v2512-evidence
          # Only the selected evidence of the capture step. The directory holds
          # no checkout copy, no unfiltered Batch Workspace, and no VTU file.
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          # The five Failure Artifact names begin with a dot. The action default
          # is false, so a copied dot-prefixed file would not reach the artifact
          # without this input.
          include-hidden-files: true
          retention-days: 90
