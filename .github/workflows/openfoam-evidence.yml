name: openfoam-evidence

# Manual real-OpenFOAM evidence run for the A4-1a evidence Item.
#
# This workflow runs OpenCFD OpenFOAM v2512 through the Orchestrator for one
# DOE Batch CSV row and one Case, with the Stages setup, mesh, flow, and
# post-processing. The transport Stage never runs.
#
# The workflow starts only through workflow_dispatch. It is never a required
# check. GitHub registers the trigger only for a workflow file that exists on
# the default branch, so this file reaches main before any dispatch.
#
# The workflow tunes nothing. The run uses the committed setup defaults, and a
# real product failure stays a real product failure.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: OpenFOAM v2512 four-Stage evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # No OpenFOAM target is hard-coded here. The committed
      # .openfoam-version file is the single active target, and the
      # baseline step publishes the derived values through GITHUB_ENV for
      # every later step. These placeholders only give an explicit value
      # to a step that runs before or without a resolved baseline.
      OPENFOAM_PACKAGE: UNAVAILABLE
      OPENFOAM_BASHRC: UNAVAILABLE

    steps:
      # ---------------------------------------------------------------------
      # 1. The clock. This step is first, before checkout, installation, and
      #    preparation, so the absolute deadline covers every later phase.
      # ---------------------------------------------------------------------
      - name: Start the evidence clock
        run: |
          start="$(date +%s)"
          # The runner context is not available in job-level env, and the
          # evidence directory must stay outside the checkout, so this step
          # derives it from RUNNER_TEMP and publishes it. This step writes no
          # repository file and no evidence file, so the order is safe.
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/evidence" >> "$GITHUB_ENV"
          echo "EVIDENCE_CLOCK_START=${start}" >> "$GITHUB_ENV"
          echo "CAPTURE_DEADLINE=$(( start + 6300 ))" >> "$GITHUB_ENV"
          echo "CAPTURE_START_GUARD_SECONDS=60" >> "$GITHUB_ENV"
          {
            echo "CHECKOUT_RESULT=NOT_ATTEMPTED"
            echo "INSTALL_RESULT=NOT_ATTEMPTED"
            echo "PREPARE_RESULT=NOT_ATTEMPTED"
            echo "BASELINE_RESULT=NOT_ATTEMPTED"
            echo "OPENFOAM_BASELINE=UNAVAILABLE"
            echo "ORCHESTRATOR_STARTED=false"
            echo "OVERALL_RESULT=NOT_ATTEMPTED"
            echo "STAGE_SETUP=NOT_ATTEMPTED"
            echo "STAGE_MESH=NOT_ATTEMPTED"
            echo "STAGE_FLOW=NOT_ATTEMPTED"
            echo "STAGE_POST=NOT_ATTEMPTED"
            echo "OPENFOAM_VERSION=UNAVAILABLE"
            echo "TIMEOUT_WRAPPER_STATUS=NOT_RECORDED"
          } >> "$GITHUB_ENV"
          echo "evidence clock start: ${start}"
          echo "capture deadline    : $(( start + 6300 ))"

      # ---------------------------------------------------------------------
      # 2. The single status mechanism. Production and every pre-merge status
      #    check call these same three functions.
      # ---------------------------------------------------------------------
      - name: Create the bounded-runner library
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env, so the step
          # derives the library path from RUNNER_TEMP and publishes it.
          LIB="${RUNNER_TEMP}/evidence_lib.sh"
          echo "LIB=${LIB}" >> "$GITHUB_ENV"
          mkdir -p "$(dirname -- "$LIB")"
          cat > "$LIB" <<'EVIDENCE_LIB'
          # budget_seconds <grace> - print raw, grace, guard, available.
          # available = raw_remaining - termination_grace - capture_start_guard.
          # Pass only available to timeout.
          budget_seconds() {
              local grace="$1" now raw guard available
              now="$(date +%s)"
              raw=$(( CAPTURE_DEADLINE - now ))
              guard="$CAPTURE_START_GUARD_SECONDS"
              available=$(( raw - grace - guard ))
              printf '%s %s %s %s\n' "$raw" "$grace" "$guard" "$available"
          }

          # run_bounded <status_file> <timeout_log> <grace> <available> <command> [args...]
          # Sets TIMEOUT_WRAPPER_STATUS. Writes the child status atomically to
          # <status_file>. Terminates every descendant before it returns.
          run_bounded() {
              local status_file="$1" timeout_log="$2" grace="$3" available="$4"
              local pgid_file="${status_file}.pgid"
              shift 4
              rm -f -- "$status_file" "${status_file}.tmp" "$pgid_file"
              set +e
              LC_ALL=C timeout --verbose --signal=TERM --kill-after="${grace}s" "${available}s" \
                  bash -c '
                      status_file="$1"; shift
                      set -m
                      set +e
                      "$@" &
                      child=$!
                      printf "%s\n" "$child" > "${status_file}.pgid"
                      trap "kill -TERM -- -${child} 2>/dev/null" TERM
                      child_status=0
                      while kill -0 "$child" 2>/dev/null; do
                          wait "$child"; child_status=$?
                      done
                      printf "%s\n" "$child_status" > "${status_file}.tmp"
                      mv "${status_file}.tmp" "${status_file}"
                      exit "$child_status"
                  ' _ "$status_file" "$@" 2> "$timeout_log"
              TIMEOUT_WRAPPER_STATUS=$?
              set -e
              local pgid own_pgid
              own_pgid="$(ps -o pgid= -p $$ 2>/dev/null | tr -d ' ' || true)"
              if [[ -f "$pgid_file" ]]; then
                  pgid="$(cat -- "$pgid_file" 2>/dev/null || true)"
                  if [[ "$pgid" =~ ^[0-9]+$ ]] \
                     && [[ -n "$own_pgid" ]] && [[ "$pgid" != "$own_pgid" ]] \
                     && kill -0 -- "-${pgid}" 2>/dev/null; then
                      kill -KILL -- "-${pgid}" 2>/dev/null || true
                  fi
              fi
              return 0
          }

          # classify_result <status_file> <timeout_log>
          # An anchored timeout diagnostic has priority over a status file.
          classify_result() {
              local status_file="$1" timeout_log="$2" recorded
              if [[ -s "$timeout_log" ]] \
                 && LC_ALL=C grep -Eq '^timeout: sending signal (TERM|KILL)' "$timeout_log"; then
                  printf 'BUDGET_EXCEEDED\n'; return 0
              fi
              if [[ -f "$status_file" ]]; then
                  recorded="$(cat -- "$status_file")"
                  if [[ "$recorded" =~ ^[0-9]+$ ]]; then
                      if [[ "$recorded" == "0" ]]; then printf 'SUCCEEDED\n'
                      else printf 'FAILED_EXIT_%s\n' "$recorded"; fi
                      return 0
                  fi
              fi
              printf 'INFRASTRUCTURE_FAILURE\n'
          }
          EVIDENCE_LIB
          bash -n "$LIB"
          echo "bounded-runner library written to ${LIB}"
          sha256sum "$LIB"

      # ---------------------------------------------------------------------
      # 3. The bounded checkout. A checkout stop is never BUDGET_EXCEEDED.
      # ---------------------------------------------------------------------
      - name: Check out the repository
        id: checkout
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/checkout@v5

      - name: Record the checkout phase result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [[ "${{ steps.checkout.outcome }}" == "success" ]]; then
              echo "CHECKOUT_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
              echo "checkout phase: SUCCEEDED"
          else
              {
                echo "CHECKOUT_RESULT=INFRASTRUCTURE_FAILURE"
                echo "CHECKOUT_REASON=checkout outcome ${{ steps.checkout.outcome }}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "checkout phase: INFRASTRUCTURE_FAILURE (${{ steps.checkout.outcome }})" >&2
          fi

      # ---------------------------------------------------------------------
      # 4. The OpenFOAM baseline. The committed .openfoam-version file is the
      #    single active target of this workflow. This step runs after
      #    checkout, validates the exact target, and derives the package name
      #    and the environment file path from the validated value. A missing,
      #    unreadable, multi-line, or different baseline records an
      #    infrastructure failure and stops the run before installation,
      #    preparation, and the Orchestrator.
      # ---------------------------------------------------------------------
      - name: Resolve the OpenFOAM baseline
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          baseline_file="${GITHUB_WORKSPACE}/.openfoam-version"
          expected="v2512"

          # Every rejected baseline records the same four values, so no later
          # phase can start and the reason stays one environment-file line.
          baseline_fail() {
              {
                echo "BASELINE_RESULT=INFRASTRUCTURE_FAILURE"
                echo "BASELINE_REASON=$1"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "baseline phase: INFRASTRUCTURE_FAILURE, $1" >&2
              exit 0
          }

          if [[ ! -f "$baseline_file" || ! -r "$baseline_file" ]]; then
              baseline_fail "the baseline file .openfoam-version is missing or unreadable"
          fi

          # One literal X keeps the final newline byte significant, so this
          # one comparison rejects a missing line ending, a trailing byte, a
          # second line, and a different target.
          raw="$(cat -- "$baseline_file"; printf X)"
          if [[ "$raw" != "${expected}"$'\n'"X" ]]; then
              observed="$(printf '%s' "${raw%X}" | tr '\n' ' ' | cut -c1-120)"
              baseline_fail "the baseline must hold the exact bytes '${expected}' and one line ending; observed '${observed}'"
          fi

          # The release token, the package name, and the environment file path
          # all come from the validated baseline value.
          baseline="${raw%$'\n'X}"
          release="${baseline#v}"
          {
            echo "OPENFOAM_BASELINE=${baseline}"
            echo "OPENFOAM_RELEASE=${release}"
            echo "OPENFOAM_PACKAGE=openfoam${release}-default"
            echo "OPENFOAM_BASHRC=/usr/lib/openfoam/openfoam${release}/etc/bashrc"
            echo "BASELINE_RESULT=SUCCEEDED"
          } >> "$GITHUB_ENV"
          echo "baseline        : ${baseline}"
          echo "release token   : ${release}"
          echo "package         : openfoam${release}-default"
          echo "environment file: /usr/lib/openfoam/openfoam${release}/etc/bashrc"

      # ---------------------------------------------------------------------
      # 5. Installation. The derived package from the official openfoam.com
      #    method. The step starts only after a resolved baseline.
      # ---------------------------------------------------------------------
      - name: Install OpenFOAM v2512
        if: always() && env.CHECKOUT_RESULT == 'SUCCEEDED' && env.BASELINE_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 30)"
          {
            echo "INSTALL_RAW_REMAINING=${raw}"
            echo "INSTALL_GRACE=${grace}"
            echo "INSTALL_CAPTURE_GUARD=${guard}"
            echo "INSTALL_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "install budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "install phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          run_bounded "${EVIDENCE_DIR}/install_status.txt" \
                      "${EVIDENCE_DIR}/install-timeout.log" \
                      "$grace" "$available" \
              bash -c '
                  set -euo pipefail
                  curl -fsSL https://dl.openfoam.com/add-debian-repo.sh | sudo bash
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends "$1"
              ' _ "$OPENFOAM_PACKAGE" > "${EVIDENCE_DIR}/install.log" 2>&1
          install_result="$(classify_result "${EVIDENCE_DIR}/install_status.txt" \
                                            "${EVIDENCE_DIR}/install-timeout.log")"
          echo "INSTALL_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$install_result" == "SUCCEEDED" ]]; then
              echo "INSTALL_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$install_result" == "BUDGET_EXCEEDED" ]]; then
              echo "INSTALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "INSTALL_REASON=${install_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "install phase: ${install_result}"
          tail -n 40 "${EVIDENCE_DIR}/install.log" || true

      - name: Record the OpenFOAM version
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          # The OpenFOAM etc/bashrc sources a chain of scripts. An absent file
          # ends the step under set -e, and an unset variable in that chain
          # ends the step under set -u. Either stop would leave the phase
          # without a reason, so the environment load is guarded and every
          # failure records INFRASTRUCTURE_FAILURE with the exact reason.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The gate requires the exact validated baseline. A non-empty but
          # different version is a rejected environment, so the run can never
          # produce evidence under an unintended OpenFOAM release.
          version="${WM_PROJECT_VERSION:-}"
          if (( source_status != 0 )) || [[ "$version" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${version}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${version}'" >&2
              exit 0
          fi

          # The environment identity. Every value comes from the installed
          # system. The package version comes from the package database. A
          # value that cannot be obtained becomes the explicit UNAVAILABLE
          # token. No value is invented.
          package_version="$(dpkg-query -W -f='${Version}' "$OPENFOAM_PACKAGE" 2>/dev/null || true)"
          [[ -n "$package_version" ]] || package_version="UNAVAILABLE"
          os_identity="$( ( . /etc/os-release && printf '%s' "${PRETTY_NAME:-}" ) 2>/dev/null || true )"
          [[ -n "$os_identity" ]] || os_identity="UNAVAILABLE"
          architecture="$(uname -m 2>/dev/null || true)"
          [[ -n "$architecture" ]] || architecture="UNAVAILABLE"
          gcc_version="$(gcc -dumpfullversion 2>/dev/null || true)"
          [[ -n "$gcc_version" ]] || gcc_version="UNAVAILABLE"
          wm_options="${WM_OPTIONS:-}"
          [[ -n "$wm_options" ]] || wm_options="UNAVAILABLE"

          {
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE}"
            echo "OPENFOAM_PACKAGE_VERSION=${package_version}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC}"
            echo "WM_PROJECT_VERSION=${version}"
            echo "WM_OPTIONS=${wm_options}"
            echo "OS_IDENTITY=${os_identity}"
            echo "ARCHITECTURE=${architecture}"
            echo "GCC_VERSION=${gcc_version}"
            echo "simpleFoam: $(command -v simpleFoam || echo UNAVAILABLE)"
            echo "snappyHexMesh: $(command -v snappyHexMesh || echo UNAVAILABLE)"
            echo "surfaceTransformPoints: $(command -v surfaceTransformPoints || echo UNAVAILABLE)"
            echo "foamToVTK: $(command -v foamToVTK || echo UNAVAILABLE)"
          } | tee "${EVIDENCE_DIR}/openfoam-version.txt"
          # Only the accepted version reaches GITHUB_ENV. WM_PROJECT_VERSION
          # stays unpublished, because an inherited value would let a later
          # step pass its revalidation without a loaded environment.
          echo "OPENFOAM_VERSION=${version}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # 6. Preparation. The repository already holds the base Case template
      #    src/master_batch/simpleFoam_files and the DOE Batch CSV
      #    src/output_batch_1.csv. The contract needs one Case, so the job
      #    builds a one-row DOE Batch CSV from the committed header and one
      #    committed data row. The job adds no file to the repository and
      #    changes no committed dictionary, no committed STL, and no
      #    committed default.
      # ---------------------------------------------------------------------
      - name: Prepare the one-Case DOE Batch CSV
        if: always() && env.INSTALL_RESULT == 'SUCCEEDED'
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"
          read -r raw grace guard available <<< "$(budget_seconds 15)"
          {
            echo "PREPARE_RAW_REMAINING=${raw}"
            echo "PREPARE_GRACE=${grace}"
            echo "PREPARE_CAPTURE_GUARD=${guard}"
            echo "PREPARE_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "prepare budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "prepare phase: BUDGET_EXCEEDED, no time after grace and guard" >&2
              exit 0
          fi

          # The preparation body is an inline script, so the job adds no
          # repository file. run_bounded wraps that script.
          run_bounded "${EVIDENCE_DIR}/prepare_status.txt" \
                      "${EVIDENCE_DIR}/prepare-timeout.log" \
                      "$grace" "$available" \
              bash -c '
          set -euo pipefail
          cd "$1"
          case_id="$2"
          source_csv="src/output_batch_1.csv"
          run_csv="src/output_batch_9.csv"
          base="src/master_batch/simpleFoam_files"

          # The committed base Case is read-only input. Confirm it, never
          # rewrite it.
          for required in \
              "${base}/system/blockMeshDict" \
              "${base}/system/snappyHexMeshDict" \
              "${base}/system/controlDict" \
              "${base}/system/decomposeParDict" \
              "${base}/constant/turbulenceProperties" \
              "${base}/constant/triSurface/f18p2_all.stl" \
              "${base}/0/U" "${base}/0/p" "${base}/0/k" \
              "${base}/0/epsilon" "${base}/0/nut" \
              "$source_csv"; do
              [[ -f "$required" ]] || { echo "missing committed input: $required" >&2; exit 1; }
          done

          # One header row and exactly one data row, selected by Case id.
          head -n 1 -- "$source_csv" > "$run_csv"
          selected="$(awk -F, -v want="$case_id" \
              "NR>1 && \$1==want { print; exit }" "$source_csv")"
          [[ -n "$selected" ]] || { echo "Case ${case_id} not found in ${source_csv}" >&2; exit 1; }
          printf "%s\n" "$selected" >> "$run_csv"

          echo "== the one-Case DOE Batch CSV =="
          cat -- "$run_csv"
          echo "== committed base Case inventory =="
          find "$base" -type f | sort | head -n 40
          echo "== base Case file count =="
          find "$base" -type f | wc -l
          ' _ "$GITHUB_WORKSPACE" "7" > "${EVIDENCE_DIR}/prepare.log" 2>&1
          prepare_result="$(classify_result "${EVIDENCE_DIR}/prepare_status.txt" \
                                            "${EVIDENCE_DIR}/prepare-timeout.log")"
          echo "PREPARE_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
          if [[ "$prepare_result" == "SUCCEEDED" ]]; then
              echo "PREPARE_RESULT=SUCCEEDED" >> "$GITHUB_ENV"
          elif [[ "$prepare_result" == "BUDGET_EXCEEDED" ]]; then
              echo "PREPARE_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "PREPARE_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
              echo "PREPARE_REASON=${prepare_result}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE" >> "$GITHUB_ENV"
          fi
          echo "prepare phase: ${prepare_result}"
          cat "${EVIDENCE_DIR}/prepare.log" || true

      # ---------------------------------------------------------------------
      # 7. The bounded Orchestrator. Four Stages, one Case, -j 1, no tuning.
      # ---------------------------------------------------------------------
      - name: Run the Orchestrator
        if: always() && env.PREPARE_RESULT == 'SUCCEEDED'
        env:
          # The opt-in of specification Section 9.2. The runner has four cores
          # and the committed Case default is NP="8", so the mesh Stage needs
          # the explicit oversubscription policy. The value stays on this one
          # step, so no other step and no other phase inherits it.
          BATCH_STAGE_MPI_OVERSUBSCRIBE: "1"
        run: |
          set -euo pipefail
          source "$LIB"
          mkdir -p "$EVIDENCE_DIR"

          # The same guarded environment load as the version step. The
          # Orchestrator never starts without a loaded OpenFOAM environment.
          if [[ ! -f "$OPENFOAM_BASHRC" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=OpenFOAM environment file not found: ${OPENFOAM_BASHRC}"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, no file at ${OPENFOAM_BASHRC}" >&2
              exit 0
          fi

          set +eu
          # shellcheck disable=SC1090
          source "$OPENFOAM_BASHRC"
          source_status=$?
          set -eu

          # The Orchestrator revalidates the exact baseline after it sources
          # the environment file. A non-empty but different version stops the
          # run before the Orchestrator starts.
          if (( source_status != 0 )) || [[ "${WM_PROJECT_VERSION:-}" != "$OPENFOAM_BASELINE" ]]; then
              {
                echo "INSTALL_RESULT=INFRASTRUCTURE_FAILURE"
                echo "INSTALL_REASON=the loaded OpenFOAM environment is not the exact baseline from ${OPENFOAM_BASHRC}: source status ${source_status}, expected WM_PROJECT_VERSION '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'"
                echo "ORCHESTRATOR_STARTED=false"
                echo "OVERALL_RESULT=INFRASTRUCTURE_FAILURE"
              } >> "$GITHUB_ENV"
              echo "environment: INFRASTRUCTURE_FAILURE, source status ${source_status}, expected '${OPENFOAM_BASELINE}', observed '${WM_PROJECT_VERSION:-}'" >&2
              exit 0
          fi

          csv="${GITHUB_WORKSPACE}/src/output_batch_9.csv"

          read -r raw grace guard available <<< "$(budget_seconds 60)"
          {
            echo "ORCHESTRATOR_RAW_REMAINING=${raw}"
            echo "ORCHESTRATOR_GRACE=${grace}"
            echo "ORCHESTRATOR_CAPTURE_GUARD=${guard}"
            echo "ORCHESTRATOR_SECONDS=${available}"
          } >> "$GITHUB_ENV"
          echo "orchestrator budget: raw=${raw} grace=${grace} guard=${guard} available=${available}"

          if (( available <= 0 )); then
              echo "ORCHESTRATOR_STARTED=false" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=BUDGET_EXCEEDED" >> "$GITHUB_ENV"
          else
              echo "ORCHESTRATOR_STARTED=true" >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_START=$(date +%s)" >> "$GITHUB_ENV"
              cd "$GITHUB_WORKSPACE"
              run_bounded "${EVIDENCE_DIR}/orchestrator_status.txt" \
                          "${EVIDENCE_DIR}/orchestrator-timeout.log" \
                          "$grace" "$available" \
                  bash -c 'bash src/run_batch.sh --stage setup,mesh,flow,post-processing -j 1 "$1" \
                               > "$2" 2>&1' _ "$csv" "${EVIDENCE_DIR}/orchestrator.log"
              echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS}" >> "$GITHUB_ENV"
              echo "OVERALL_RESULT=$(classify_result "${EVIDENCE_DIR}/orchestrator_status.txt" \
                                                     "${EVIDENCE_DIR}/orchestrator-timeout.log")" \
                  >> "$GITHUB_ENV"
              echo "ORCHESTRATOR_END=$(date +%s)" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------------------
      # 8. The capture sequence. This step is the next step after the bounded
      #    execution and records CAPTURE_START before any parsing.
      #
      #    The step writes phase-results.txt first. The optional capture work
      #    then runs under one work limit: 480 seconds from capture start, and
      #    never later than 180 seconds before CAPTURE_DEADLINE. The earlier
      #    limit wins. A capture error, a timeout, or a missing budget gives a
      #    CAPTURE_RESULT and a CAPTURE_REASON, and the step then ends with
      #    status 0, so the summary and the upload steps still run. The step
      #    timeout is only a final guard.
      # ---------------------------------------------------------------------
      - name: Capture the evidence
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          capture_start="$(date +%s)"
          echo "CAPTURE_START=${capture_start}" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          deadline="${CAPTURE_DEADLINE:-0}"
          [[ "$deadline" =~ ^[0-9]+$ ]] || deadline=0

          # A step that does not reach its end keeps this result. The summary
          # step then reports it.
          capture_result_file="${EVIDENCE_DIR}/capture-result.txt"
          {
            echo "CAPTURE_RESULT=NOT_COMPLETED"
            echo "CAPTURE_REASON=the capture step did not reach its end"
          } | tee "$capture_result_file" >> "$GITHUB_ENV"

          # The capture work limit. The earlier limit wins.
          work_cap_seconds=480
          deadline_reserve_seconds=180
          work_end=$(( capture_start + work_cap_seconds ))
          work_limit_source=CAPTURE_WORK_CAP
          if (( deadline - deadline_reserve_seconds < work_end )); then
              work_end=$(( deadline - deadline_reserve_seconds ))
              work_limit_source=CAPTURE_DEADLINE_RESERVE
          fi
          work_budget=$(( work_end - capture_start ))

          echo "CAPTURE_START=${capture_start}" | tee "${EVIDENCE_DIR}/capture-clock.txt"
          {
            echo "EVIDENCE_CLOCK_START=${EVIDENCE_CLOCK_START:-UNAVAILABLE}"
            echo "CAPTURE_DEADLINE=${deadline}"
            echo "CAPTURE_START_GUARD_SECONDS=${CAPTURE_START_GUARD_SECONDS:-UNAVAILABLE}"
            echo "CAPTURE_START_WITHIN_DEADLINE=$([[ "$capture_start" -le "$deadline" ]] \
                 && echo true || echo false)"
            echo "CAPTURE_WORK_CAP_SECONDS=${work_cap_seconds}"
            echo "CAPTURE_DEADLINE_RESERVE_SECONDS=${deadline_reserve_seconds}"
            echo "CAPTURE_WORK_END=${work_end}"
            echo "CAPTURE_WORK_LIMIT_SOURCE=${work_limit_source}"
            echo "CAPTURE_WORK_BUDGET_SECONDS=${work_budget}"
          } >> "${EVIDENCE_DIR}/capture-clock.txt"

          # The phase results come first, before any file-tree scan, copy, VTU
          # parse, or checksum. OVERALL_RESULT is the product result. The
          # capture result is in capture-result.txt and never replaces it.
          {
            echo "CHECKOUT_RESULT=${CHECKOUT_RESULT:-NOT_ATTEMPTED}"
            echo "INSTALL_RESULT=${INSTALL_RESULT:-NOT_ATTEMPTED}"
            echo "PREPARE_RESULT=${PREPARE_RESULT:-NOT_ATTEMPTED}"
            echo "ORCHESTRATOR_STARTED=${ORCHESTRATOR_STARTED:-false}"
            echo "TIMEOUT_WRAPPER_STATUS=${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}"
            echo "OVERALL_RESULT=${OVERALL_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_VERSION=${OPENFOAM_VERSION:-UNAVAILABLE}"
            echo "BASELINE_RESULT=${BASELINE_RESULT:-NOT_ATTEMPTED}"
            echo "OPENFOAM_BASELINE=${OPENFOAM_BASELINE:-UNAVAILABLE}"
            echo "OPENFOAM_PACKAGE=${OPENFOAM_PACKAGE:-UNAVAILABLE}"
            echo "OPENFOAM_BASHRC=${OPENFOAM_BASHRC:-UNAVAILABLE}"
          } > "${EVIDENCE_DIR}/phase-results.txt"
          cat "${EVIDENCE_DIR}/phase-results.txt"

          # The optional capture work. It is a script file, so run_bounded can
          # stop it and every descendant at the work limit.
          CAPTURE_WORK_SCRIPT="${RUNNER_TEMP:-${EVIDENCE_DIR%/*}}/capture_work.sh"
          cat > "$CAPTURE_WORK_SCRIPT" <<'CAPTURE_WORK'
          set -euo pipefail
          notes_file="${EVIDENCE_DIR}/capture-work-notes.txt"

          # capture_note <text> - record one incomplete capture item.
          capture_note() {
              printf '%s\n' "$1" >> "$notes_file"
          }

          # bounded <label> <command> [args...] - run one blocking operation
          # under the time that is left before the capture work limit, less a
          # margin. The operation ends before the outer limit, and timeout
          # stops the process group of the operation. A timeout or any other
          # non-zero status is a capture error, so it gives a note.
          bounded() {
              _bounded 1 "$@"
          }

          # bounded_timeout_note <label> <command> [args...] - bounded, but a
          # non-zero status other than a timeout gives no note, because the
          # caller records a more exact reason for it.
          bounded_timeout_note() {
              _bounded 0 "$@"
          }

          _bounded() {
              local note_failure="$1" label="$2" left status
              shift 2
              left=$(( CAPTURE_WORK_END - 10 - $(date +%s) ))
              (( left > 120 )) && left=120
              if (( left <= 0 )); then
                  capture_note "${label}: no capture work time was left"
                  return 124
              fi
              timeout --kill-after=2s "${left}s" "$@" && status=0 || status=$?
              if (( status == 124 || status == 137 )); then
                  capture_note "${label}: exceeded the capture work limit"
              elif (( status != 0 && note_failure )); then
                  capture_note "${label}: ended with status ${status}"
              fi
              return "$status"
          }

          # Change 7. The bounded VTU point-data manifest.
          #
          # The array names come from the file header only. A foamToVTK VTU file
          # with appended data is a VTK XML file whose binary payload starts at
          # <AppendedData. The parser input ends exactly at the first byte of that
          # marker, so the parser never receives an appended-payload byte and needs
          # no header size limit. A finite ASCII VTU file has no marker, so its
          # complete file is the parser input.
          #
          # The byte count and the SHA-256 describe the complete source file, and the
          # checksum streams that file. A checksum is file identity evidence. It is
          # not scientific validation.

          vtu_expected_fields() {
              case "${1##*/}" in
                  flow_0.vtu) echo "U p wallDistance" ;;
                  flow_latest_*.vtu) echo "U p" ;;
                  trd_*.vtu) echo "${SCALAR_FIELD:-T}" ;;
                  *) echo "UNKNOWN" ;;
              esac
          }

          # ---- VTU header reader: begin ----
          # vtu_read_header <source-file> <work-dir> - copy the header bytes of one
          # VTU file to <work-dir>. Sets VTU_PARSE_INPUT and VTU_MARKER_FOUND.
          #
          # One linear streaming pass that stops at the appended-payload marker.
          # Each dd call issues one read, so it returns the bytes that are available
          # instead of waiting for a full block. Each chunk goes to a file, and only
          # the new chunk and the last 12 bytes before it are searched for the
          # marker, so the work for each chunk is constant. The loop ends as soon as
          # the marker appears, and the text is then cut at the marker, so the parser
          # input holds no appended-payload byte and the extraction never waits for
          # payload that a producer has not released. Without a marker, the loop
          # ends at end of file, and the complete finite file is the parser input.
          #
          # Three earlier forms were wrong. A 65536-byte limit dropped a valid
          # PointData declaration past that byte. Making the awk record separator
          # the tag opening character ended the marker record only at the next such
          # byte, so the parser could wait for, and hold, the complete payload.
          # Appending each chunk to one shell string and searching the complete
          # string again after each chunk made a file without a marker take time
          # that grows with the square of its size.
          #
          # Status 0: the header is ready. Status 1: the file cannot be read.
          # Status 2: the marker position cannot be found.
          vtu_read_header() {
              local source_file="$1" work_dir="$2" read_failed=0 marker_offset
              VTU_MARKER_FOUND=0
              VTU_PARSE_INPUT="${work_dir}/header"
              [[ -e "$source_file" && -r "$source_file" && ! -d "$source_file" ]] || return 1
              : > "${work_dir}/header"
              : > "${work_dir}/tail"
              exec 3< "$source_file" || return 1
              while :; do
                  if ! dd bs=65536 count=1 status=none <&3 > "${work_dir}/chunk" 2>/dev/null; then
                      read_failed=1
                      break
                  fi
                  [[ -s "${work_dir}/chunk" ]] || break
                  cat -- "${work_dir}/chunk" >> "${work_dir}/header"
                  cat -- "${work_dir}/tail" "${work_dir}/chunk" > "${work_dir}/window"
                  if LC_ALL=C grep -aqF '<AppendedData' -- "${work_dir}/window"; then
                      VTU_MARKER_FOUND=1
                      break
                  fi
                  tail -c 12 -- "${work_dir}/window" > "${work_dir}/tail"
              done
              exec 3<&-
              (( read_failed == 0 )) || return 1
              if (( VTU_MARKER_FOUND )); then
                  marker_offset="$(LC_ALL=C grep -abo -m 1 -F '<AppendedData' -- \
                                   "${work_dir}/header" | head -n 1 | cut -d: -f1 || true)"
                  [[ "$marker_offset" =~ ^[0-9]+$ ]] || return 2
                  head -c "$marker_offset" -- "${work_dir}/header" > "${work_dir}/parse"
                  VTU_PARSE_INPUT="${work_dir}/parse"
              fi
              return 0
          }

          # vtu_scan_header <source-file> <tag-file> <limit> - scan the header of one
          # VTU file. Prints one record for each line:
          #   POINT<TAB>name  CELL<TAB>name  UNNAMED<TAB>PointData|CellData
          #   POINTDATA_SEEN<TAB>0|1  CELLDATA_SEEN<TAB>0|1  OUTPUT_LIMIT<TAB>0|1
          # and appends each PointData, CellData, and enclosed DataArray start tag,
          # and each PointData and CellData end tag, to <tag-file> as original bytes:
          #   TAG offset=<zero-based byte offset> bytes=<n> element=<name> context=<name>
          #   <the n original tag bytes>
          # A record that does not fit in <limit> bytes is not written, and
          # OUTPUT_LIMIT is then 1, so no tag is cut. <limit> 0 means no limit, and
          # a negative <limit> writes no record. An empty <tag-file> writes nothing.
          #
          # The scan keeps quoted attribute values intact, so a '>' inside a value
          # does not end a tag. A name counts only from a Name attribute with a
          # single- or double-quoted value in a DataArray start tag inside a
          # complete PointData or CellData element. The attributes of the tag are
          # read in order, so Name text inside the quoted value of another
          # attribute is not a Name attribute. An unquoted value, an attribute
          # that is not well formed, or a second Name attribute gives no name.
          # No element body and no appended-payload byte is kept.
          #
          # Status 0: a complete scan. Status 1: the file cannot be read. Status 2:
          # the header is incomplete or malformed, so the names are not evidence.
          vtu_scan_header() {
              local source_file="$1" tag_file="$2" limit="$3" work_dir status=0
              work_dir="$(mktemp -d "${TMPDIR:-/tmp}/vtu-header.XXXXXX")" || return 1
              vtu_read_header "$source_file" "$work_dir" || status=$?
              if (( status != 0 )); then
                  rm -rf -- "$work_dir"
                  return "$status"
              fi
              LC_ALL=C awk -v vtu_scan=1 -v sq="'" -v tag_file="$tag_file" -v limit="$limit" \
                           -v require_end="$(( 1 - VTU_MARKER_FOUND ))" '
                  BEGIN {
                      off = 0; intag = 0; tag = ""; taglen = 0; tagoff = 0; quote = ""
                      pd = 0; cd = 0; seen_pd = 0; seen_cd = 0; saw_end = 0; bad = 0
                      used = 0; limit_hit = 0
                  }
                  function tag_name(s) {
                      if (match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) return substr(s, 1, RLENGTH)
                      return ""
                  }
                  # name_attr(t) - the Name attribute value of start tag t. Sets
                  # name_found to 1 only for one well-formed quoted Name attribute.
                  function name_attr(t,    s, sep, an, q, j, value) {
                      name_found = 0; value = ""
                      s = substr(t, 2)
                      if (!match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) return ""
                      s = substr(s, RLENGTH + 1)
                      while (1) {
                          sep = match(s, /^[ \t\r\n]+/)
                          if (sep) s = substr(s, RLENGTH + 1)
                          if (s == ">" || s == "/>") return value
                          if (!sep || !match(s, /^[A-Za-z_:][-A-Za-z0-9_:.]*/)) break
                          an = substr(s, 1, RLENGTH); s = substr(s, RLENGTH + 1)
                          if (!match(s, /^[ \t\r\n]*=[ \t\r\n]*/)) break
                          s = substr(s, RLENGTH + 1)
                          q = substr(s, 1, 1)
                          if (q != "\"" && q != sq) break
                          s = substr(s, 2); j = index(s, q)
                          if (j == 0) break
                          if (an == "Name") {
                              if (name_found) break
                              name_found = 1; value = substr(s, 1, j - 1)
                          }
                          s = substr(s, j + 1)
                      }
                      name_found = 0
                      return ""
                  }
                  function record(t, o, element, context,    header, size) {
                      header = "TAG offset=" o " bytes=" length(t) " element=" element \
                               " context=" context "\n"
                      size = length(header) + length(t) + 1
                      if (limit < 0 || (limit > 0 && used + size > limit)) { limit_hit = 1; return }
                      if (tag_file == "") return
                      printf "%s%s\n", header, t > tag_file
                      used += size
                  }
                  function handle(t, o,    second, kind, name, selfclose, ctx, value) {
                      second = substr(t, 2, 1)
                      if (second == "?" || second == "!") return
                      selfclose = 0
                      if (second == "/") {
                          kind = "end"; name = tag_name(substr(t, 3))
                      } else {
                          kind = "start"; name = tag_name(substr(t, 2))
                          selfclose = (t ~ /\/[ \t\r\n]*>$/)
                      }
                      if (name == "VTKFile" && kind == "end") saw_end = 1
                      if (name == "PointData" || name == "CellData") {
                          record(t, o, name, "-")
                          if (kind == "start") {
                              if (pd || cd) bad = 1
                              if (name == "PointData") seen_pd = 1; else seen_cd = 1
                              if (!selfclose) { if (name == "PointData") pd = 1; else cd = 1 }
                          } else {
                              if ((name == "PointData" && !pd) || (name == "CellData" && !cd)) bad = 1
                              pd = 0; cd = 0
                          }
                      } else if (name == "DataArray" && kind == "start" && (pd || cd)) {
                          ctx = pd ? "PointData" : "CellData"
                          record(t, o, "DataArray", ctx)
                          value = name_attr(t)
                          if (name_found) {
                              print (pd ? "POINT" : "CELL") "\t" value
                          } else {
                              print "UNNAMED\t" ctx
                          }
                      }
                  }
                  {
                      line = $0 "\n"; n = length(line); i = 1
                      while (i <= n) {
                          if (!intag) {
                              j = index(substr(line, i), "<")
                              if (j == 0) break
                              i += j - 1; intag = 1; tag = ""; taglen = 0; quote = ""
                              tagoff = off + i - 1
                          }
                          while (i <= n) {
                              c = substr(line, i, 1); i++
                              tag = tag c; taglen++
                              if (taglen > 1048576) { bad = 1; exit }
                              if (quote != "") { if (c == quote) quote = "" }
                              else if (c == "\"" || c == sq) quote = c
                              else if (c == ">") { intag = 0; handle(tag, tagoff); break }
                          }
                      }
                      off += n
                  }
                  END {
                      if (intag || pd || cd || bad || (require_end && !saw_end)) exit 2
                      print "POINTDATA_SEEN\t" seen_pd
                      print "CELLDATA_SEEN\t" seen_cd
                      print "OUTPUT_LIMIT\t" limit_hit
                  }' "$VTU_PARSE_INPUT" 2>/dev/null || status=$?
              rm -rf -- "$work_dir"
              case "$status" in
                  0) return 0 ;;
                  2) return 2 ;;
                  *) return 1 ;;
              esac
          }

          # vtu_header_point_data_names <source-file> - the PointData names of one
          # VTU file, in source order, on one line. Status 0: a complete parse, and
          # an empty line is a valid empty PointData result. Status 1: the file
          # cannot be read. Status 2: the header is incomplete, so no name is
          # reported.
          vtu_header_point_data_names() {
              local records status=0 kind value names=""
              records="$(vtu_scan_header "$1" "" 0)" || status=$?
              (( status == 0 )) || return "$status"
              while IFS=$'\t' read -r kind value; do
                  if [[ "$kind" == POINT ]]; then
                      names="${names:+${names} }${value}"
                  fi
              done <<< "$records"
              printf '%s\n' "$names"
          }
          # ---- VTU header reader: end ----

          # The capture script calls itself for one VTU scan, so the scan runs as
          # one bounded process.
          if [[ "${1:-}" == "--vtu-scan" ]]; then
              vtu_scan_header "$2" "$3" "$4"
              exit $?
          fi

          for name in orchestrator.log orchestrator-timeout.log install.log prepare.log; do
              [[ -f "${EVIDENCE_DIR}/${name}" ]] || echo "UNAVAILABLE" > "${EVIDENCE_DIR}/${name}"
          done
          if [[ -f "${EVIDENCE_DIR}/orchestrator_status.txt" ]]; then
              cp -- "${EVIDENCE_DIR}/orchestrator_status.txt" \
                    "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          else
              echo "ABSENT" > "${EVIDENCE_DIR}/orchestrator_status.captured.txt"
          fi

          workspace_root="${GITHUB_WORKSPACE}/src"
          batch_dir="${workspace_root}/batch_9"

          # The corrected selective capture. Each selected file keeps its path
          # relative to the Batch Workspace, so a reviewer can see which Stage and
          # which Case produced it. The selection stays explicit: no VTU file, no
          # checkout copy, and no unfiltered Batch Workspace copy is collected.
          #
          # A failed search or copy is a capture error. The note names the
          # item, and the files already copied stay in the evidence.
          #
          # copy_relative <source-file> <destination-root>
          copy_relative() {
              local source_file="$1" destination_root="$2" relative target
              relative="${source_file#"${batch_dir}/"}"
              target="${destination_root}/${relative}"
              if ! mkdir -p -- "$(dirname -- "$target")" 2>/dev/null; then
                  capture_note "Stage evidence copy ${relative}: the target directory cannot be created"
                  return 0
              fi
              if ! cp -- "$source_file" "$target" 2>/dev/null; then
                  capture_note "Stage evidence copy ${relative}: the copy failed"
              fi
              return 0
          }

          # collect_selected <destination-root> <find-expression>...
          collect_selected() {
              local destination_root="$1"
              shift
              local selected
              while IFS= read -r selected; do
                  [[ -n "$selected" ]] || continue
                  copy_relative "$selected" "$destination_root"
              done < <(bounded "Stage evidence search" \
                           find "$batch_dir" "$@" -type f 2>/dev/null || true)
          }

          # The Stage evidence comes before the tree and the VTU manifest, so a
          # later timeout keeps it.
          mkdir -p "${EVIDENCE_DIR}/summaries" "${EVIDENCE_DIR}/stage-logs"
          if [[ -d "$batch_dir" ]]; then
              # Each Stage summary is a root-relative file, so its relative path is
              # its file name and the destination stays the same as before.
              collect_selected "${EVIDENCE_DIR}/summaries" \
                  -maxdepth 1 -name '*_summary.csv'

              # Fault 1. The five Failure Artifact names begin with a dot, so the
              # earlier FAILED_* pattern matched none of them.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -maxdepth 1 \
                  \( -name '.setup_cases_failed' \
                  -o -name '.run_mesh_cases_failed' \
                  -o -name '.run_flow_cases_failed' \
                  -o -name '.run_transport_cases_failed' \
                  -o -name '.run_post_processing_cases_failed' \)

              # The Case-level OpenFOAM command logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" -name 'log.*'

              # Fault 2. Every per-Case Stage log directory, and the post-processing
              # conversion logs under <case>/vtk/logs.
              collect_selected "${EVIDENCE_DIR}/stage-logs" \
                  \( -path '*/_setup_logs/*' \
                  -o -path '*/_mesh_logs/*' \
                  -o -path '*/_flow_logs/*' \
                  -o -path '*/_transport_logs/*' \
                  -o -path '*/vtk/logs/*' \) -name '*.log'
          fi

          # Stage results from the summary files, when the summaries exist. The
          # summaries keep their Batch Workspace-relative path, and each Stage
          # summary is a root-relative file, so stage-summary-lines.txt keeps its
          # existing payload.
          stage_from_summary() {
              local file="${EVIDENCE_DIR}/summaries/$1"
              if [[ -f "$file" ]]; then
                  tail -n +2 -- "$file" | head -n 1 || true
              else
                  echo "ABSENT"
              fi
          }
          {
            echo "setup:  $(stage_from_summary setup_cases_summary.csv)"
            echo "mesh:   $(stage_from_summary run_mesh_cases_summary.csv)"
            echo "flow:   $(stage_from_summary run_flow_cases_summary.csv)"
            echo "post:   $(stage_from_summary run_post_processing_cases_summary.csv)"
          } > "${EVIDENCE_DIR}/stage-summary-lines.txt"

          {
            echo "== Batch Workspace tree =="
            if [[ -d "$batch_dir" ]]; then
                bounded "Batch Workspace tree" find "$batch_dir" -maxdepth 4 | sort || true
            else
                echo "ABSENT"
            fi
          } > "${EVIDENCE_DIR}/batch-workspace-tree.txt"

          vtk_dir_count=0
          if [[ -d "$batch_dir" ]]; then
              vtk_dir_count="$(bounded "vtk directory search" \
                               find "$batch_dir" -type d -name vtk 2>/dev/null |
                               wc -l | tr -d ' ' || true)"
          fi

          # Mesh-quality evidence from the checkMesh log text. The verdict is
          # separate from the Stage status: a checkMesh command that returns 0
          # can still report failed mesh checks. No tolerance and no waiver.
          mesh_file="${EVIDENCE_DIR}/mesh-quality.txt"
          mesh_list="${EVIDENCE_DIR%/*}/checkmesh-log-list.txt"
          : > "$mesh_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "checkMesh log search" \
                  find "$batch_dir" -name log.checkMesh -type f 2>/dev/null |
                  sort > "$mesh_list" || true
          fi
          {
            echo "== Mesh quality evidence =="
            echo "MESH_QUALITY_SOURCE=checkMesh log text; the Stage status is separate"
          } > "$mesh_file"
          mesh_logs=0
          mesh_review=0
          mesh_unavailable=0
          while IFS= read -r mesh_log; do
              [[ -n "$mesh_log" ]] || continue
              mesh_logs=$(( mesh_logs + 1 ))
              mesh_rel="${mesh_log#"${batch_dir}/"}"
              if mesh_out="$(bounded "checkMesh parse ${mesh_rel}" awk '
                      /^Failed [0-9]+ mesh checks\./ { failed = $2; saw_failed = 1 }
                      /^Mesh OK\./ { ok = 1 }
                      /Concave cells \(using face planes\) found, number of cells: [0-9]+/ {
                          concave = $NF; saw_concave = 1
                      }
                      END {
                          if (saw_failed) f = failed; else if (ok) f = 0; else f = "UNAVAILABLE"
                          if (saw_concave) c = concave
                          else if (ok) c = 0
                          else if (saw_failed) c = "NOT_REPORTED"
                          else c = "UNAVAILABLE"
                          print f " " c
                      }' "$mesh_log")"; then
                  mesh_failed="${mesh_out%% *}"
                  mesh_concave="${mesh_out##* }"
              else
                  mesh_failed=UNAVAILABLE
                  mesh_concave=UNAVAILABLE
              fi
              if [[ "$mesh_failed" == UNAVAILABLE ]]; then
                  mesh_verdict=UNAVAILABLE
                  mesh_reason="the checkMesh log has no 'Mesh OK.' line and no 'Failed N mesh checks.' line"
                  mesh_unavailable=$(( mesh_unavailable + 1 ))
              elif (( mesh_failed > 0 )); then
                  mesh_verdict=MESH_QUALITY_REVIEW_REQUIRED
                  mesh_reason="checkMesh reports ${mesh_failed} failed mesh checks; Stage success is not mesh acceptance"
                  mesh_review=$(( mesh_review + 1 ))
              else
                  mesh_verdict=MESH_QUALITY_CHECKS_PASSED
                  mesh_reason="checkMesh reports Mesh OK."
              fi
              {
                echo
                echo "MESH_LOG=${mesh_rel}"
                echo "MESH_FAILED_CHECKS=${mesh_failed}"
                echo "MESH_CONCAVE_CELLS=${mesh_concave}"
                echo "MESH_LOG_VERDICT=${mesh_verdict}"
                echo "MESH_LOG_REASON=${mesh_reason}"
              } >> "$mesh_file"
          done < "$mesh_list"
          {
            echo
            echo "MESH_QUALITY_LOG_COUNT=${mesh_logs}"
            if (( mesh_logs == 0 )); then
                echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                echo "MESH_QUALITY_REASON=no checkMesh log exists in the Batch Workspace"
            elif (( mesh_review > 0 )); then
                echo "MESH_QUALITY_VERDICT=MESH_QUALITY_REVIEW_REQUIRED"
                echo "MESH_QUALITY_REASON=${mesh_review} checkMesh logs report failed mesh checks"
            elif (( mesh_unavailable > 0 )); then
                echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                echo "MESH_QUALITY_REASON=${mesh_unavailable} checkMesh logs have no summary line"
            else
                echo "MESH_QUALITY_VERDICT=MESH_QUALITY_CHECKS_PASSED"
                echo "MESH_QUALITY_REASON=every checkMesh log reports Mesh OK."
            fi
          } >> "$mesh_file"

          # Flow convergence evidence. CONVERGED needs the explicit solver marker
          # under the actual residualControl values of the Case. Reaching the end
          # time or low final residuals is not convergence. The M3 reference is
          # the committed 1e-4 for U, p, and each configured turbulence field.
          #
          # The verdict fails closed. Actual controls that do not match the M3
          # reference give UNAVAILABLE, because the marker then describes another
          # criterion. The marker describes the final solver state only when no
          # Time line comes after it and it names the final time; a marker before
          # the final Time block gives NOT_CONVERGED. A marker with a missing
          # final record gives UNAVAILABLE. The final records are the Time line,
          # the first initial residual of Ux, Uy, Uz, and p, of each turbulence
          # field that a residualControl key other than U and p matches (at least
          # one for each key), and the continuity line, all from the final Time
          # block.
          conv_file="${EVIDENCE_DIR}/convergence.txt"
          conv_list="${EVIDENCE_DIR%/*}/solver-log-list.txt"
          : > "$conv_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "solver log search" \
                  find "$batch_dir" -name log.simpleFoam -type f 2>/dev/null |
                  sort > "$conv_list" || true
          fi
          {
            echo "== Flow convergence evidence =="
            echo "M3_REFERENCE_CRITERION=the solver convergence marker under residualControl U 1e-4, p 1e-4, and 1e-4 for each configured turbulence field"
          } > "$conv_file"
          conv_logs=0
          conv_not=0
          conv_unavailable=0
          while IFS= read -r conv_log; do
              [[ -n "$conv_log" ]] || continue
              conv_logs=$(( conv_logs + 1 ))
              conv_rel="${conv_log#"${batch_dir}/"}"
              conv_controls="$(dirname -- "$conv_log")/system/fvSolution"
              conv_controls_rel="${conv_controls#"${batch_dir}/"}"
              conv_control="UNAVAILABLE"
              conv_match="UNAVAILABLE"
              conv_entries=""
              if [[ -f "$conv_controls" ]]; then
                  copy_relative "$conv_controls" "${EVIDENCE_DIR}/case-config"
                  if conv_entries="$(bounded "residualControl parse ${conv_controls_rel}" awk '
                          { line = $0; sub(/\/\/.*/, "", line) }
                          !inrc && !done && line ~ /(^|[ \t])residualControl([ \t]|$)/ {
                              inrc = 1; depth = 0; opened = 0
                          }
                          inrc {
                              n_open = gsub(/\{/, "{", line); n_close = gsub(/\}/, "}", line)
                              if (opened && depth == 1 &&
                                  match(line, /^[ \t]*("[^"]*"|[A-Za-z_][A-Za-z0-9_.]*)[ \t]+[^ \t;]+[ \t]*;/)) {
                                  entry = line
                                  sub(/^[ \t]+/, "", entry); sub(/[ \t]*;.*$/, "", entry)
                                  gsub(/[ \t]+/, " ", entry)
                                  print entry
                              }
                              depth += n_open - n_close
                              if (n_open) opened = 1
                              if (opened && depth <= 0) { inrc = 0; done = 1 }
                          }
                          END { if (!done) exit 3 }' "$conv_controls")" && [[ -n "$conv_entries" ]]; then
                      conv_control="$(printf '%s\n' "$conv_entries" | paste -sd ';' - | sed -e 's/;/; /g')"
                      conv_match="$(printf '%s\n' "$conv_entries" | awk '
                          { key = $1; value = $2 + 0; n++
                            if (value != 0.0001) bad = 1
                            if (key == "U") u = 1; else if (key == "p") p = 1; else other = 1 }
                          END { print ((n && u && p && other && !bad) ? "true" : "false") }')"
                  fi
              fi
              conv_time=UNAVAILABLE
              conv_marker=UNAVAILABLE
              conv_position=UNAVAILABLE
              conv_marker_time=UNAVAILABLE
              conv_end=UNAVAILABLE
              conv_continuity=UNAVAILABLE
              conv_missing=UNAVAILABLE
              conv_residuals=""
              conv_log_ok=0
              if conv_out="$(bounded "solver log parse ${conv_rel}" \
                      env CONV_CONTROL_ENTRIES="$conv_entries" awk '
                      BEGIN {
                          nk = split(ENVIRON["CONV_CONTROL_ENTRIES"], entry, "\n")
                          for (i = 1; i <= nk; i++) {
                              key = entry[i]; sub(/[ \t].*$/, "", key)
                              if (key == "" || key == "U" || key == "p") continue
                              nt++; tkey[nt] = key; tre[nt] = ""
                              if (key ~ /^".*"$/) tre[nt] = "^(" substr(key, 2, length(key) - 2) ")$"
                          }
                      }
                      # turbulence_key(f, j) - 1 when residualControl key j names field f.
                      function turbulence_key(f, j) {
                          if (tre[j] != "") return (f ~ tre[j])
                          return (f == tkey[j])
                      }
                      /^Time = / {
                          time = $3; split("", seen); order = ""; count = 0; cont = ""; after = 0
                      }
                      /Solving for [A-Za-z0-9_.]+, Initial residual = / {
                          s = $0; sub(/.*Solving for /, "", s)
                          field = s; sub(/,.*/, "", field)
                          value = s; sub(/.*Initial residual = /, "", value); sub(/,.*/, "", value)
                          if (!(field in seen)) {
                              seen[field] = value; order = order (count++ ? " " : "") field
                          }
                          if (!(field in solved)) { solved[field] = 1; solved_order = solved_order " " field }
                      }
                      /time step continuity errors/ { cont = $0; sub(/^[ \t]+/, "", cont) }
                      /SIMPLE solution converged/ { marker = $0; sub(/^[ \t]+/, "", marker); after = 1 }
                      /^End[ \t]*$/ { end_seen = 1 }
                      END {
                          position = "ABSENT"
                          if (marker != "") position = (after ? "AFTER_FINAL_TIME" : "BEFORE_FINAL_TIME")
                          marker_time = marker
                          if (!(sub(/^SIMPLE solution converged in /, "", marker_time) &&
                                sub(/ iterations[ \t]*$/, "", marker_time) &&
                                marker_time ~ /^[^ \t]+$/)) marker_time = "UNAVAILABLE"
                          missing = ""
                          nb = split("Ux Uy Uz p", base, " ")
                          for (i = 1; i <= nb; i++) if (!(base[i] in seen)) missing = missing " " base[i]
                          ns = split(solved_order, sf, " ")
                          for (i = 1; i <= ns; i++) {
                              for (j = 1; j <= nt; j++) {
                                  if (turbulence_key(sf[i], j) && !(sf[i] in seen)) {
                                      missing = missing " " sf[i]; break
                                  }
                              }
                          }
                          for (j = 1; j <= nt; j++) {
                              hit = 0
                              for (fld in seen) if (turbulence_key(fld, j)) hit = 1
                              if (!hit) missing = missing " " tkey[j]
                          }
                          if (cont == "") missing = missing " continuity"
                          sub(/^ /, "", missing)
                          print "TIME\t" (time == "" ? "UNAVAILABLE" : time)
                          print "MARKER\t" (marker == "" ? "ABSENT" : marker)
                          print "POSITION\t" position
                          print "MARKER_TIME\t" marker_time
                          print "END\t" (end_seen ? "true" : "false")
                          print "CONTINUITY\t" (cont == "" ? "UNAVAILABLE" : cont)
                          print "MISSING\t" (missing == "" ? "NONE" : missing)
                          n = split(order, f, " ")
                          for (i = 1; i <= n; i++) print "RES\t" f[i] "\t" seen[f[i]]
                      }' "$conv_log")"; then
                  conv_log_ok=1
                  while IFS=$'\t' read -r conv_kind conv_a conv_b; do
                      case "$conv_kind" in
                          TIME) conv_time="$conv_a" ;;
                          MARKER) conv_marker="$conv_a" ;;
                          POSITION) conv_position="$conv_a" ;;
                          MARKER_TIME) conv_marker_time="$conv_a" ;;
                          END) conv_end="$conv_a" ;;
                          CONTINUITY) conv_continuity="$conv_a" ;;
                          MISSING) conv_missing="$conv_a" ;;
                          RES) conv_residuals="${conv_residuals}FINAL_INITIAL_RESIDUAL_${conv_a}=${conv_b}"$'\n' ;;
                      esac
                  done <<< "$conv_out"
              fi
              if (( conv_log_ok == 0 )); then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the solver log cannot be parsed"
              elif [[ "$conv_control" == UNAVAILABLE ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the residualControl configuration is not available at ${conv_controls_rel}"
              elif [[ "$conv_match" != true ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the actual residualControl values do not match the M3 reference, so the solver log is not evidence under that reference"
              elif [[ "$conv_time" == UNAVAILABLE ]]; then
                  conv_verdict=UNAVAILABLE
                  conv_reason="the solver log has no Time line"
              elif [[ "$conv_position" == AFTER_FINAL_TIME ]]; then
                  if [[ "$conv_missing" != NONE ]]; then
                      conv_verdict=UNAVAILABLE
                      conv_reason="the final Time = ${conv_time} block has no record for: ${conv_missing}"
                  elif [[ "$conv_marker_time" != "$conv_time" ]]; then
                      conv_verdict=UNAVAILABLE
                      conv_reason="the solver marker '${conv_marker}' does not name the final Time = ${conv_time}"
                  else
                      conv_verdict=CONVERGED
                      conv_reason="the solver reports '${conv_marker}' after the final Time = ${conv_time} block"
                  fi
              elif [[ "$conv_position" == BEFORE_FINAL_TIME ]]; then
                  conv_verdict=NOT_CONVERGED
                  conv_reason="the solver marker '${conv_marker}' comes before the final Time = ${conv_time} block, so it does not describe the final solver state"
              else
                  conv_verdict=NOT_CONVERGED
                  conv_reason="the solver log reaches Time = ${conv_time} with no 'SIMPLE solution converged' marker"
              fi
              case "$conv_verdict" in
                  UNAVAILABLE) conv_unavailable=$(( conv_unavailable + 1 )) ;;
                  NOT_CONVERGED) conv_not=$(( conv_not + 1 )) ;;
              esac
              {
                echo
                echo "CONVERGENCE_LOG=${conv_rel}"
                echo "CONVERGENCE_CONTROLS_SOURCE=${conv_controls_rel}"
                echo "RESIDUAL_CONTROL=${conv_control}"
                echo "RESIDUAL_CONTROL_REFERENCE_MATCH=${conv_match}"
                echo "SOLVER_CONVERGENCE_MARKER=${conv_marker}"
                echo "SOLVER_CONVERGENCE_MARKER_POSITION=${conv_position}"
                echo "FINAL_TIME=${conv_time}"
                echo "SOLVER_END_REACHED=${conv_end}"
                printf '%s' "$conv_residuals"
                echo "FINAL_CONTINUITY=${conv_continuity}"
                echo "CONVERGENCE_REQUIRED_RECORDS_MISSING=${conv_missing}"
                echo "CONVERGENCE_LOG_VERDICT=${conv_verdict}"
                echo "CONVERGENCE_LOG_REASON=${conv_reason}"
              } >> "$conv_file"
          done < "$conv_list"
          {
            echo
            echo "CONVERGENCE_LOG_COUNT=${conv_logs}"
            if (( conv_logs == 0 )); then
                echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                echo "CONVERGENCE_REASON=no simpleFoam log exists in the Batch Workspace"
            elif (( conv_unavailable > 0 )); then
                echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                echo "CONVERGENCE_REASON=${conv_unavailable} solver logs have no complete convergence evidence"
            elif (( conv_not > 0 )); then
                echo "CONVERGENCE_VERDICT=NOT_CONVERGED"
                echo "CONVERGENCE_REASON=${conv_not} solver logs have no solver convergence marker"
            else
                echo "CONVERGENCE_VERDICT=CONVERGED"
                echo "CONVERGENCE_REASON=every solver log reports convergence"
            fi
          } >> "$conv_file"

          # The VTU manifest. Each manifest line is written when it is known, so a
          # later timeout keeps the lines of the files that came before it.
          #
          # For each selected VTU file, the capture compares the required names
          # with the observed PointData names by set inclusion, and keeps the
          # original PointData, CellData, and DataArray tags in vtu-tags.txt with
          # their byte offsets and the source checksum. A tag section holds at most
          # 16384 bytes, and vtu-tags.txt holds at most 65536 bytes. A limit never
          # cuts a tag; it gives OUTPUT_LIMIT.
          vtu_manifest="${EVIDENCE_DIR}/vtu-point-data.txt"
          vtu_tags="${EVIDENCE_DIR}/vtu-tags.txt"
          vtu_tag_file_limit=16384
          vtu_tag_total_limit=65536
          vtu_tag_used=0
          : > "$vtu_tags"
          {
            echo "== VTU point-data manifest =="
            echo "EXPECTED_FIELD_SOURCE=run_post_processing_cases.sh FLOW_ZERO_FIELDS, FLOW_RESULT_FIELDS, TRD_FIELDS"
            echo "SCALAR_FIELD=${SCALAR_FIELD:-T}"
            echo "VTK_DIRECTORY_COUNT=${vtk_dir_count}"
            echo "VTU_TAG_EVIDENCE_FILE=vtu-tags.txt"
            echo "VTU_TAG_EVIDENCE_LIMITS=${vtu_tag_file_limit} bytes for each VTU file; ${vtu_tag_total_limit} bytes in total"
          } > "$vtu_manifest"
          vtu_count=0
          vtu_unavailable=0
          vtu_not_matched=0
          vtu_list="${EVIDENCE_DIR%/*}/vtu-file-list.txt"
          vtu_part="${EVIDENCE_DIR%/*}/vtu-tags.part"
          : > "$vtu_list"
          if [[ -d "$batch_dir" ]]; then
              bounded "VTU file search" \
                  find "$batch_dir" -path '*/vtk/*' -name '*.vtu' -type f 2>/dev/null |
                  sort > "$vtu_list" || true
          fi
          while IFS= read -r vtu_file; do
              [[ -n "$vtu_file" ]] || continue
              vtu_count=$(( vtu_count + 1 ))
              vtu_path="${vtu_file#"${batch_dir}/"}"
              vtu_required="$(vtu_expected_fields "$vtu_file")"
              {
                echo
                echo "VTU_PATH=${vtu_path}"
              } >> "$vtu_manifest"

              # A selected file that does not exist is source content, not a
              # capture error.
              if [[ ! -e "$vtu_file" ]]; then
                  {
                    echo "VTU_BYTES=UNAVAILABLE"
                    echo "VTU_SHA256=UNAVAILABLE"
                    echo "VTU_EXPECTED_FIELDS=${vtu_required}"
                    echo "VTU_OBSERVED_FIELDS=UNAVAILABLE"
                    echo "VTU_OBSERVED_FIELDS_REASON=the selected VTU file does not exist"
                    echo "VTU_REQUIRED_FIELDS_RESULT=MISSING_FILE"
                    echo "VTU_TAG_EVIDENCE=UNAVAILABLE"
                    echo "VTU_TAG_EVIDENCE_REASON=MISSING_FILE"
                  } >> "$vtu_manifest"
                  vtu_not_matched=$(( vtu_not_matched + 1 ))
                  continue
              fi

              if observed="$(bounded "VTU byte count ${vtu_path}" wc -c -- "$vtu_file")"; then
                  echo "VTU_BYTES=${observed%% *}" >> "$vtu_manifest"
              else
                  echo "VTU_BYTES=UNAVAILABLE" >> "$vtu_manifest"
                  vtu_unavailable=$(( vtu_unavailable + 1 ))
              fi
              vtu_sha=UNAVAILABLE
              if observed="$(bounded "VTU checksum ${vtu_path}" sha256sum -- "$vtu_file")"; then
                  vtu_sha="${observed%% *}"
                  echo "VTU_SHA256=${vtu_sha}" >> "$vtu_manifest"
              else
                  {
                    echo "VTU_SHA256=UNAVAILABLE"
                    echo "VTU_SHA256_REASON=the checksum did not complete; see capture-work-notes.txt"
                  } >> "$vtu_manifest"
                  vtu_unavailable=$(( vtu_unavailable + 1 ))
              fi
              echo "VTU_EXPECTED_FIELDS=${vtu_required}" >> "$vtu_manifest"

              # The tag section budget: the smaller of the per-file limit and the
              # rest of the total limit, less the section header and the longest
              # section end line.
              vtu_section_head="== VTU_TAGS path=${vtu_path} sha256=${vtu_sha}"
              vtu_section_end_max="== VTU_TAGS_END path=${vtu_path} tag_evidence=PARSER_FAILURE"
              vtu_cap=$(( vtu_tag_total_limit - vtu_tag_used ))
              (( vtu_cap > vtu_tag_file_limit )) && vtu_cap=$vtu_tag_file_limit
              vtu_frame=$(( ${#vtu_section_head} + ${#vtu_section_end_max} + 2 ))
              vtu_write_section=1
              vtu_scan_limit=$(( vtu_cap - vtu_frame ))
              if (( vtu_scan_limit <= 0 )); then
                  vtu_scan_limit=-1
                  (( vtu_cap >= vtu_frame )) || vtu_write_section=0
              fi
              : > "$vtu_part"

              scan_status=0
              scan_out="$(bounded_timeout_note "VTU PointData parse ${vtu_path}" \
                          bash "$0" --vtu-scan "$vtu_file" "$vtu_part" "$vtu_scan_limit")" \
                  || scan_status=$?

              vtu_point="" vtu_cell="" vtu_pd_seen=0 vtu_limit_hit=0
              if (( scan_status == 0 || scan_status == 2 )); then
                  while IFS=$'\t' read -r scan_kind scan_value; do
                      case "$scan_kind" in
                          POINT) vtu_point="${vtu_point:+${vtu_point} }${scan_value}" ;;
                          CELL) vtu_cell="${vtu_cell:+${vtu_cell} }${scan_value}" ;;
                          POINTDATA_SEEN) vtu_pd_seen="$scan_value" ;;
                          OUTPUT_LIMIT) vtu_limit_hit="$scan_value" ;;
                      esac
                  done <<< "$scan_out"
              fi

              vtu_missing=""
              case "$scan_status" in
                  0)
                      for vtu_name in $vtu_required; do
                          case " ${vtu_point} " in
                              *" ${vtu_name} "*) ;;
                              *) vtu_missing="${vtu_missing:+${vtu_missing} }${vtu_name}" ;;
                          esac
                      done
                      if (( vtu_limit_hit )); then
                          vtu_result=OUTPUT_LIMIT
                          vtu_tag_state=OUTPUT_LIMIT
                      else
                          vtu_tag_state=COMPLETE
                          if [[ "$vtu_required" == UNKNOWN ]]; then
                              vtu_result=REQUIRED_FIELDS_UNKNOWN
                          elif (( vtu_pd_seen == 0 )); then
                              vtu_result=SOURCE_POINTDATA_ABSENT
                          elif [[ -n "$vtu_missing" ]]; then
                              vtu_result=MISSING_REQUIRED_FIELDS
                          else
                              vtu_result=MATCH
                          fi
                      fi
                      {
                        echo "VTU_OBSERVED_FIELDS=${vtu_point}"
                        echo "VTU_OBSERVED_CELL_FIELDS=${vtu_cell}"
                        echo "VTU_MISSING_REQUIRED_FIELDS=${vtu_missing}"
                      } >> "$vtu_manifest"
                      ;;
                  *)
                      case "$scan_status" in
                          1)
                              if [[ ! -e "$vtu_file" ]]; then
                                  vtu_result=MISSING_FILE
                                  reason="the selected VTU file does not exist"
                              else
                                  vtu_result=PARSER_FAILURE
                                  reason="the VTU file cannot be read"
                              fi
                              ;;
                          2) vtu_result=PARSER_FAILURE; reason="the VTU header is incomplete" ;;
                          124|137)
                              vtu_result=TIMEOUT
                              reason="the PointData parse did not complete within the capture work limit"
                              ;;
                          *)
                              vtu_result=PARSER_FAILURE
                              reason="the PointData parse ended with status ${scan_status}"
                              ;;
                      esac
                      vtu_tag_state="$vtu_result"
                      {
                        echo "VTU_OBSERVED_FIELDS=UNAVAILABLE"
                        echo "VTU_OBSERVED_FIELDS_REASON=${reason}"
                      } >> "$vtu_manifest"
                      # A parse failure is a capture error. A timeout already has
                      # a note from bounded_timeout_note. A missing file is source
                      # content.
                      case "$vtu_result" in
                          PARSER_FAILURE)
                              capture_note "VTU PointData parse ${vtu_path}: ${reason}"
                              vtu_unavailable=$(( vtu_unavailable + 1 ))
                              ;;
                          TIMEOUT)
                              vtu_unavailable=$(( vtu_unavailable + 1 ))
                              ;;
                      esac
                      # A stopped scan can leave a partial record, so its records
                      # are not kept.
                      if [[ "$vtu_result" != PARSER_FAILURE ]]; then
                          : > "$vtu_part"
                      fi
                      ;;
              esac

              if (( vtu_write_section )); then
                  {
                    printf '%s\n' "$vtu_section_head"
                    cat -- "$vtu_part"
                    printf '== VTU_TAGS_END path=%s tag_evidence=%s\n' "$vtu_path" "$vtu_tag_state"
                  } >> "$vtu_tags"
                  vtu_tag_used="$(wc -c < "$vtu_tags" | tr -d ' ')"
              fi
              {
                echo "VTU_REQUIRED_FIELDS_RESULT=${vtu_result}"
                if [[ "$vtu_tag_state" == COMPLETE ]]; then
                    echo "VTU_TAG_EVIDENCE=COMPLETE"
                else
                    echo "VTU_TAG_EVIDENCE=UNAVAILABLE"
                    echo "VTU_TAG_EVIDENCE_REASON=${vtu_tag_state}"
                fi
              } >> "$vtu_manifest"
              [[ "$vtu_result" == MATCH ]] || vtu_not_matched=$(( vtu_not_matched + 1 ))
          done < "$vtu_list"

          {
            echo
            echo "VTU_FILE_COUNT=${vtu_count}"
            if (( vtu_count == 0 )); then
                echo "VTU_EVIDENCE=UNAVAILABLE"
                if [[ ! -d "$batch_dir" ]]; then
                    echo "VTU_REASON=The Batch Workspace does not exist, so the post-processing Stage produced no VTU file."
                elif (( vtk_dir_count == 0 )); then
                    echo "VTU_REASON=No Case holds a vtk directory, so the post-processing Stage wrote no VTU file."
                else
                    echo "VTU_REASON=A vtk directory exists and holds no .vtu file."
                fi
                echo "VTU_REQUIRED_FIELDS_VERDICT=UNAVAILABLE"
            elif (( vtu_unavailable > 0 )); then
                echo "VTU_EVIDENCE=PARTIAL"
                echo "VTU_REASON=${vtu_unavailable} VTU field values are UNAVAILABLE."
                echo "VTU_REQUIRED_FIELDS_VERDICT=INCOMPLETE"
            elif (( vtu_not_matched > 0 )); then
                echo "VTU_EVIDENCE=INCOMPLETE"
                echo "VTU_REASON=${vtu_not_matched} of ${vtu_count} selected VTU files do not have complete required PointData evidence."
                echo "VTU_REQUIRED_FIELDS_VERDICT=INCOMPLETE"
            else
                echo "VTU_EVIDENCE=PRESENT"
                echo "VTU_REQUIRED_FIELDS_VERDICT=COMPLETE"
            fi
          } >> "$vtu_manifest"

          # An incomplete item gives status 4, so the step never reports a
          # complete capture after a skipped or stopped operation.
          if [[ -s "$notes_file" ]]; then
              exit 4
          fi
          exit 0
          CAPTURE_WORK
          bash -n "$CAPTURE_WORK_SCRIPT"

          # capture_finish <result> <reason> - publish the capture result.
          capture_finish() {
              local result="$1" reason="$2"
              reason="$(printf '%s' "$reason" | tr '\r\n' '  ')"
              {
                echo "CAPTURE_RESULT=${result}"
                echo "CAPTURE_REASON=${reason}"
              } > "$capture_result_file"
              cat "$capture_result_file" >> "$GITHUB_ENV"
              cat "$capture_result_file"
          }

          # capture_fill_unavailable <file> <line> - keep a missing evidence
          # file explicit after an incomplete capture.
          capture_fill_unavailable() {
              [[ -s "$1" ]] || printf '%s\n' "$2" > "$1"
          }

          grace=5
          available=$(( work_budget - grace ))
          if (( available <= 0 )); then
              capture_result=SKIPPED_NO_BUDGET
              capture_reason="no capture work budget: the work limit ${work_end} is ${work_budget} seconds after capture start ${capture_start}; the optional capture did not run"
          elif [[ ! -f "${LIB:-}" ]]; then
              capture_result=FAILED
              capture_reason="the bounded-runner library is not available, so the optional capture did not run"
          else
              # shellcheck disable=SC1090
              source "$LIB"
              export EVIDENCE_DIR GITHUB_WORKSPACE
              export CAPTURE_WORK_END="$work_end"
              : > "${EVIDENCE_DIR}/capture-work-notes.txt"
              run_bounded "${EVIDENCE_DIR}/capture_work_status.txt" \
                          "${EVIDENCE_DIR}/capture-work-timeout.log" \
                          "$grace" "$available" \
                  bash "$CAPTURE_WORK_SCRIPT"
              work_result="$(classify_result "${EVIDENCE_DIR}/capture_work_status.txt" \
                                             "${EVIDENCE_DIR}/capture-work-timeout.log")"
              first_note="$(head -n 1 -- "${EVIDENCE_DIR}/capture-work-notes.txt" 2>/dev/null || true)"
              case "$work_result" in
                  SUCCEEDED)
                      capture_result=COMPLETE
                      capture_reason="all capture work completed within ${work_budget} seconds"
                      ;;
                  FAILED_EXIT_4)
                      capture_result=INCOMPLETE
                      capture_reason="${first_note:-a capture item did not complete}"
                      ;;
                  BUDGET_EXCEEDED)
                      capture_result=TIMED_OUT
                      capture_reason="the capture work was stopped at the work limit of ${available} seconds (${work_limit_source})"
                      ;;
                  FAILED_EXIT_*)
                      capture_result=FAILED
                      capture_reason="the capture work ended with status ${work_result#FAILED_EXIT_}${first_note:+; ${first_note}}"
                      ;;
                  *)
                      capture_result=FAILED
                      capture_reason="the capture work recorded no status"
                      ;;
              esac
          fi

          if [[ "$capture_result" != COMPLETE ]]; then
              capture_fill_unavailable "${EVIDENCE_DIR}/stage-summary-lines.txt" \
                  "UNAVAILABLE: ${capture_result}: ${capture_reason}"
              capture_fill_unavailable "${EVIDENCE_DIR}/batch-workspace-tree.txt" \
                  "UNAVAILABLE: ${capture_result}: ${capture_reason}"
              vtu_manifest="${EVIDENCE_DIR}/vtu-point-data.txt"
              if ! grep -q '^VTU_EVIDENCE=' "$vtu_manifest" 2>/dev/null; then
                  {
                    echo
                    echo "VTU_EVIDENCE=UNAVAILABLE"
                    echo "VTU_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                    echo "VTU_REQUIRED_FIELDS_VERDICT=UNAVAILABLE"
                  } >> "$vtu_manifest"
              fi
              if ! grep -q '^MESH_QUALITY_VERDICT=' "${EVIDENCE_DIR}/mesh-quality.txt" 2>/dev/null; then
                  {
                    echo
                    echo "MESH_QUALITY_VERDICT=UNAVAILABLE"
                    echo "MESH_QUALITY_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                  } >> "${EVIDENCE_DIR}/mesh-quality.txt"
              fi
              if ! grep -q '^CONVERGENCE_VERDICT=' "${EVIDENCE_DIR}/convergence.txt" 2>/dev/null; then
                  {
                    echo
                    echo "CONVERGENCE_VERDICT=UNAVAILABLE"
                    echo "CONVERGENCE_REASON=the capture did not complete: ${capture_result}: ${capture_reason}"
                  } >> "${EVIDENCE_DIR}/convergence.txt"
              fi
          fi

          # The evidence verdicts, for the job summary. Each is separate from the
          # capture result and from the product result.
          evidence_verdict() {
              local value
              value="$(sed -n "s/^${2}=//p" "$1" 2>/dev/null | tail -n 1 || true)"
              printf '%s\n' "${value:-UNAVAILABLE}"
          }
          {
            echo "VTU_REQUIRED_FIELDS_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/vtu-point-data.txt" VTU_REQUIRED_FIELDS_VERDICT)"
            echo "MESH_QUALITY_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/mesh-quality.txt" MESH_QUALITY_VERDICT)"
            echo "CONVERGENCE_VERDICT=$(evidence_verdict "${EVIDENCE_DIR}/convergence.txt" CONVERGENCE_VERDICT)"
          } | tee -a "$GITHUB_ENV"
          if [[ -f "${EVIDENCE_DIR}/vtu-point-data.txt" ]]; then
              cat "${EVIDENCE_DIR}/vtu-point-data.txt"
          fi
          capture_finish "$capture_result" "$capture_reason"

      - name: Write the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## OpenFOAM v2512 evidence run"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| OpenFOAM baseline | \`${OPENFOAM_BASELINE:-UNAVAILABLE}\` |"
            echo "| Baseline phase | \`${BASELINE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| OpenFOAM version | \`${OPENFOAM_VERSION:-UNAVAILABLE}\` |"
            echo "| Checkout phase | \`${CHECKOUT_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Installation phase | \`${INSTALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Preparation phase | \`${PREPARE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Orchestrator started | \`${ORCHESTRATOR_STARTED:-false}\` |"
            echo "| Wrapper status | \`${TIMEOUT_WRAPPER_STATUS:-NOT_RECORDED}\` |"
            echo "| Overall result | \`${OVERALL_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Capture start | \`${CAPTURE_START:-UNAVAILABLE}\` |"
            echo "| Capture deadline | \`${CAPTURE_DEADLINE:-UNAVAILABLE}\` |"
            echo "| Capture result | \`${CAPTURE_RESULT:-NOT_ATTEMPTED}\` |"
            echo "| Capture reason | ${CAPTURE_REASON:-UNAVAILABLE} |"
            echo "| VTU required fields | \`${VTU_REQUIRED_FIELDS_VERDICT:-UNAVAILABLE}\` |"
            echo "| Mesh quality | \`${MESH_QUALITY_VERDICT:-UNAVAILABLE}\` |"
            echo "| Convergence | \`${CONVERGENCE_VERDICT:-UNAVAILABLE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfoam-v2512-evidence
          # Only the selected evidence of the capture step. The directory holds
          # no checkout copy, no unfiltered Batch Workspace, and no VTU file.
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          # The five Failure Artifact names begin with a dot. The action default
          # is false, so a copied dot-prefixed file would not reach the artifact
          # without this input.
          include-hidden-files: true
          retention-days: 90
